name: Tests
# PR : « smoke » + les seuls périmètres touchés (job « changes », voir sa table plus bas).
# Push sur main : « smoke » seul. Lancement manuel : suite complète.
on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation seule : pas de CI. Les .md lus par un test ou un build ne sont PAS listes
      # (docs/CH2-SPEC.md, chapters/ch2-silent-bells/TEXTES.md) et declenchent donc la CI.
      - '*.md'
      - 'chapters/*/NOTES.md'
      - 'shared/NOTES.md'
      - 'docs/AUDIT-*.md'
      - 'docs/COMMUN.md'
      - 'docs/DEVLOG-NOTES.md'
      - 'docs/GLOSSAIRE.md'
      - 'docs/LORE.md'
      - 'docs/TEXTES-CH1.md'
      - 'docs/decisions/**'
      - 'archives/**'
  pull_request:
    paths-ignore:
      # Documentation seule : pas de CI. Les .md lus par un test ou un build ne sont PAS listes
      # (docs/CH2-SPEC.md, chapters/ch2-silent-bells/TEXTES.md) et declenchent donc la CI.
      - '*.md'
      - 'chapters/*/NOTES.md'
      - 'shared/NOTES.md'
      - 'docs/AUDIT-*.md'
      - 'docs/COMMUN.md'
      - 'docs/DEVLOG-NOTES.md'
      - 'docs/GLOSSAIRE.md'
      - 'docs/LORE.md'
      - 'docs/TEXTES-CH1.md'
      - 'docs/decisions/**'
      - 'archives/**'
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  # Les pushes sur main ne sont jamais annules : chaque commit de main doit aller au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Calcule les périmètres à tester. Sur PR : fichiers modifiés par rapport à la base.
  # Sur lancement manuel : tous les périmètres. Sur push vers main : aucun (seul « smoke » tourne).
  #   shared/**, build/**, tests/**, ce workflow  -> tous les périmètres
  #   chapters/ch2-silent-bells/**                -> ch2
  #   site/**                                     -> hub
  #   chapters/ch1-ember-bridge/**                -> aucun périmètre dédié (couvert par « smoke »)
  changes:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scopes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ALL="shared ch2 hub"
          if [ "$EVENT" = "push" ]; then
            # Push sur main : aucun périmètre, les étapes « Tests » et builds sont sautés.
            echo "scopes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "scopes=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! FILES=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "scopes=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          S=""
          while IFS= read -r f; do
            case "$f" in
              shared/*|build/*|tests/*|.github/workflows/tests.yml) S="$S $ALL" ;;
              chapters/ch2-silent-bells/*) S="$S ch2" ;;
              site/*) S="$S hub" ;;
            esac
          done <<< "$FILES"
          echo "scopes=$S" >> "$GITHUB_OUTPUT"
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Le build reproduit exactement le fichier de reference
        run: |
          python3 build/build.py
          git diff --exit-code chapters/ch1-ember-bridge/dist/index.html
      - name: Chapitre II - le build reproduit exactement dist
        run: |
          python3 build/build_ch2.py
          git diff --exit-code chapters/ch2-silent-bells/dist/
          test -z "$(git status --porcelain chapters/ch2-silent-bells/dist/)"
      - name: Site (hub + chapitres) - le build reproduit exactement site/
        run: |
          python3 build/build_site.py
          git diff --exit-code site/
          test -z "$(git status --porcelain site/)"
      - name: Version de test
        run: python3 build/build_test.py
      - name: Cache des navigateurs Playwright
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer Playwright
        working-directory: tests
        run: |
          npm ci
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Chapitre I - test de fumee (3 phases x 3 difficultes) et polices hors ligne
        working-directory: tests
        run: |
          node smoke.js
          node fonts-offline.js
      # site/index.html : le hub ; site/ch1, site/ch2 : les chapitres ouverts depuis le hub (lien Retour)
      - name: Apercu du jeu (hub et Chapitres I et II)
        uses: actions/upload-artifact@v4
        with:
          name: jeu-apercu
          path: |
            chapters/ch1-ember-bridge/dist/index.html
            chapters/ch2-silent-bells/dist/index.html
            site/index.html
            site/ch1/index.html
            site/ch2/index.html
          retention-days: 14
          if-no-files-found: error

  tests:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Commun (cles, audio, Epreuve, entrees, aide, annonces, cinematiques)
            scope: shared
            run: |
              node keys.js
              node audio.js
              node trial.js
              node input.js
              node inputs.js
              node help.js
              node announce.js
              node cine.js
          - name: menu-layout
            scope: shared
            run: |
              node menu-layout.js
              node menu-title.js
          - name: Chapitre II (textes, cles, fumee, Epreuve)
            scope: ch2
            run: |
              node ch2-texts.js
              node ch2-keys.js
              node ch2-smoke.js
              node ch2-trial.js
          - name: Chapitre II (entrees, titre, retouches, annonces, bot)
            scope: ch2
            run: |
              node ch2-input.js
              node ch2-title.js
              node ch2-retouches3.js
              node ch2-announce.js
              node ch2-bot.js 100 --check
          - name: Hub (site assemble)
            scope: hub
            run: |
              node hub.js
              node hub-site.js
    steps:
      # Un périmètre non touché saute toutes les étapes (pas de build, pas de Playwright).
      - uses: actions/checkout@v4
        if: contains(needs.changes.outputs.scopes, matrix.scope)
      - uses: actions/setup-node@v4
        if: contains(needs.changes.outputs.scopes, matrix.scope)
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@v5
        if: contains(needs.changes.outputs.scopes, matrix.scope)
        with: { python-version: '3.12' }
      - name: Builds (ils alimentent la version de test)
        if: contains(needs.changes.outputs.scopes, matrix.scope)
        run: |
          python3 build/build.py
          python3 build/build_ch2.py
          python3 build/build_site.py
          python3 build/build_test.py
      - name: Cache des navigateurs Playwright
        id: pw
        if: contains(needs.changes.outputs.scopes, matrix.scope)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer Playwright
        if: contains(needs.changes.outputs.scopes, matrix.scope)
        working-directory: tests
        run: |
          npm ci
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Tests
        if: contains(needs.changes.outputs.scopes, matrix.scope)
        working-directory: tests
        run: ${{ matrix.run }}
