name: Tests
# PR : « smoke » + les seuls périmètres touchés (job « changes », voir sa table plus bas).
# Pas de push sur main. Lancement manuel : périmètres au choix (entrée « scopes »), bot en option.
# PR en brouillon : rien ne tourne. La CI se lance à la mise en prêt (ready_for_review).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      # Documentation seule : pas de CI. Les .md lus par un test ou un build ne sont PAS listes
      # (docs/CH2-SPEC.md, chapters/ch2-silent-bells/TEXTES.md) et declenchent donc la CI.
      - '*.md'
      - 'chapters/*/NOTES.md'
      - 'shared/NOTES.md'
      - 'site/NOTES.md'
      - 'docs/BALANCE.md'
      - 'docs/AUDIT-*.md'
      - 'docs/COMMUN.md'
      - 'docs/DEVLOG-NOTES.md'
      - 'docs/GLOSSAIRE.md'
      - 'docs/LORE.md'
      - 'docs/TEXTES-CH1.md'
      - 'docs/decisions/**'
      - 'archives/**'
  workflow_dispatch:
    inputs:
      scopes:
        description: 'Périmètres à tester (shared ch2 hub)'
        type: string
        default: 'shared ch2 hub'
      bot:
        description: 'Lancer ch2-bot (100 parties, --check)'
        type: boolean
        default: false
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Calcule les périmètres à tester. Sur PR : fichiers modifiés par rapport à la base.
  # Sur lancement manuel : l'entrée « scopes ».
  #   shared/**, build/**, tests/**, ce workflow  -> tous les périmètres
  #   chapters/ch2-silent-bells/**                -> ch2
  #   site/**                                     -> hub
  #   chapters/ch1-ember-bridge/**                -> aucun périmètre dédié (couvert par « smoke »)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scopes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_SCOPES: ${{ inputs.scopes }}
        run: |
          ALL="shared ch2 hub"
          if [ "$EVENT" != "pull_request" ]; then
            echo "scopes=$INPUT_SCOPES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! FILES=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "scopes=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          S=""
          while IFS= read -r f; do
            case "$f" in
              shared/*|build/*|tests/*|.github/workflows/tests.yml) S="$S $ALL" ;;
              chapters/ch2-silent-bells/*) S="$S ch2" ;;
              site/*) S="$S hub" ;;
            esac
          done <<< "$FILES"
          echo "scopes=$S" >> "$GITHUB_OUTPUT"
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Site (hub + chapitres) - le build reproduit exactement site/
        run: |
          python3 build/build_site.py
          git diff --exit-code site/
          test -z "$(git status --porcelain site/)"
      - name: Version de test
        run: python3 build/build_test.py
      - name: Cache des navigateurs Playwright
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer Playwright
        working-directory: tests
        run: |
          npm ci
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Chapitre I - test de fumee (3 phases x 3 difficultes) et polices hors ligne
        working-directory: tests
        run: |
          node smoke.js
          node fonts-offline.js
      # site/index.html : le hub ; site/ch1, site/ch2 : les chapitres ouverts depuis le hub (lien Retour)
      - name: Apercu du jeu (hub et Chapitres I et II)
        uses: actions/upload-artifact@v4
        with:
          name: jeu-apercu
          path: |
            site/index.html
            site/ch1/index.html
            site/ch2/index.html
          retention-days: 14
          if-no-files-found: error

  tests:
    name: Tests
    needs: changes
    # Périmètres vides : le job ne démarre pas. Brouillon : rien ne tourne.
    if: needs.changes.outputs.scopes != '' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Builds (ils alimentent la version de test)
        run: |
          for cfg in chapters/*/chapter.json; do
            python3 build/build_chapter.py "$(basename "$(dirname "$cfg")")"
          done
          python3 build/build_site.py
          python3 build/build_test.py
      - name: Cache des navigateurs Playwright
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Installer Playwright
        working-directory: tests
        run: |
          npm ci
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Commun (cles, audio, Epreuve, entrees, aide, annonces, cinematiques)
        if: contains(needs.changes.outputs.scopes, 'shared')
        working-directory: tests
        run: |
          node keys.js
          node audio.js
          node trial.js
          node input.js
          node inputs.js
          node help.js
          node announce.js
          node cine.js
      - name: menu-layout
        if: contains(needs.changes.outputs.scopes, 'shared')
        working-directory: tests
        run: |
          node menu-layout.js
          node menu-title.js
      - name: Chapitre II (textes, cles, fumee, Epreuve)
        if: contains(needs.changes.outputs.scopes, 'ch2')
        working-directory: tests
        run: |
          node ch2-texts.js
          node ch2-keys.js
          node ch2-smoke.js
          node ch2-trial.js
      - name: Chapitre II (entrees, titre, retouches, annonces)
        if: contains(needs.changes.outputs.scopes, 'ch2')
        working-directory: tests
        run: |
          node ch2-input.js
          node ch2-title.js
          node ch2-retouches3.js
          node ch2-announce.js
      - name: Chapitre II - bot (lancement manuel seulement)
        if: github.event_name == 'workflow_dispatch' && inputs.bot
        working-directory: tests
        run: node ch2-bot.js 100 --check
      - name: Hub (site assemble)
        if: contains(needs.changes.outputs.scopes, 'hub')
        working-directory: tests
        run: |
          node hub.js
          node hub-site.js
