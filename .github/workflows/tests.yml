name: Tests
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Le build reproduit exactement le fichier de reference
        run: |
          python3 build/build.py
          git diff --exit-code chapters/ch1-ember-bridge/dist/index.html
      - name: Chapitre II - le build reproduit exactement dist
        run: |
          python3 build/build_ch2.py
          git diff --exit-code chapters/ch2-silent-bells/dist/
          test -z "$(git status --porcelain chapters/ch2-silent-bells/dist/)"
      - name: Version de test
        run: python3 build/build_test.py
      - name: Installer Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test de fumee (3 phases x 3 difficultes) et polices hors ligne
        working-directory: tests
        run: |
          node smoke.js
          node fonts-offline.js
      - name: Chapitre II - textes, cles de sauvegarde, test de fumee (3 phases, hors ligne, sans reseau), aucun mot d'annonce
        working-directory: tests
        run: |
          node ch2-texts.js
          node ch2-keys.js
          node ch2-smoke.js
          node ch2-announce.js
      - name: Apercu du jeu (Chapitres I et II)
        uses: actions/upload-artifact@v4
        with:
          name: jeu-apercu
          path: |
            chapters/ch1-ember-bridge/dist/index.html
            chapters/ch2-silent-bells/dist/index.html
          retention-days: 14
          if-no-files-found: error
