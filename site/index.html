html:not(.lb-go) body *{visibility:hidden}
html:not(.lb-go) #gate,html:not(.lb-go) #gate *{visibility:visible}
#gate .btn{--lantern:#ffe066;--lanternRgb:255,224,102}
:root{
  --bg:#08060d;
  --panel:#16111d;
  --line:#2d2438;
  --fg:#f0e8df;
  --muted:#a69a93;
  --font-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg)}
body{position:fixed;inset:0;width:100%}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.hub{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;overflow:hidden;
  padding:max(var(--pad),env(safe-area-inset-top,0px)) max(var(--pad),env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(var(--pad),env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(var(--lanternRgb),.05),transparent 70%),radial-gradient(ellipse 120% 90% at 50% 120%,#140f1e,transparent 60%),var(--bg)}
.motes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.mote{position:absolute;bottom:-10px;border-radius:50%;background:var(--moteCol);box-shadow:var(--moteGlow);opacity:0;pointer-events:none;animation:hrise linear infinite}
@keyframes hrise{0%{transform:translate(0,0);opacity:0}15%{opacity:var(--motePeak)}100%{transform:translate(var(--dx),var(--moteRise));opacity:0}}
.hhead{position:absolute;left:max(var(--pad),env(safe-area-inset-left,0px));right:max(var(--pad),env(safe-area-inset-right,0px));top:var(--titleTop,0px);z-index:1;text-align:center;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.brand{margin:0;font-family:var(--font-display);font-weight:800;font-size:var(--titleFs);line-height:.95;letter-spacing:.04em;padding-left:.04em;text-transform:uppercase}
.brand span{color:var(--lantern);text-shadow:0 0 40px rgba(var(--lanternRgb),.7)}
.brand i{font-style:normal;color:var(--bell);text-shadow:0 0 40px rgba(var(--lanternRgb),.25)}
.figwrap{position:relative;width:100%;min-height:0;align-self:stretch}
.fig{position:absolute;left:var(--fx,50%);top:var(--fy,50%);width:var(--s);height:var(--s);transform:translate(-50%,-50%)}
.wire{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wire line{stroke-width:var(--wireW);vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:var(--wireOff);transition:opacity var(--lightDur) ease,stroke var(--lightDur) ease}
.wire line.on{opacity:var(--wireOn)}
.tw{position:absolute;width:var(--hit);height:var(--hit);transform:translate(-50%,-50%);display:grid;place-items:center;padding:0;margin:0;border:0;border-radius:50%;background:none;cursor:pointer;color:inherit;font:inherit}
.tw>*{grid-area:1/1}
.tw:disabled{cursor:default}
.tw:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tw .dot{display:block;width:var(--dot);height:var(--dot);border-radius:50%;border:var(--ringW) solid var(--ringOff);background:transparent;transition:background-color var(--lightDur) ease,border-color var(--lightDur) ease,box-shadow var(--lightDur) ease,opacity var(--lightDur) ease}
.tw.play .dot,.tw.done .dot{background:var(--c);border-color:var(--c);box-shadow:0 0 var(--glowB) var(--glowS) rgba(var(--cr),.55)}
.tw.play .dot{animation:hpulse var(--pulseDur) ease-in-out infinite alternate}
.tw .halo{display:none;width:calc(var(--dot) + 2*(var(--haloGap) + var(--haloW)));height:calc(var(--dot) + 2*(var(--haloGap) + var(--haloW)));border:var(--haloW) solid var(--c);border-radius:50%;pointer-events:none}
.tw.play .halo{display:block}
.tw.soon .dot{border-color:var(--c);opacity:.7}
.tw.ring .dot{animation:hring var(--ringDur) ease-out 1}
.tw.sel .dot{animation:none;opacity:1;box-shadow:0 0 calc(var(--glowB)*1.8) calc(var(--glowS)*1.8) rgba(var(--cr),.85)}   
@keyframes hpulse{from{opacity:var(--pulseLo);box-shadow:0 0 calc(var(--glowB)/3) 0 rgba(var(--cr),.3)}to{opacity:1}}
@keyframes hring{0%{box-shadow:0 0 var(--glowB) var(--glowS) rgba(var(--cr),.55)}30%{box-shadow:0 0 calc(var(--glowB)*2.4) calc(var(--glowS)*2.4) rgba(var(--cr),.85)}100%{box-shadow:0 0 var(--glowB) var(--glowS) rgba(var(--cr),.55)}}
.core{position:absolute;left:50%;top:50%;width:var(--core);height:var(--core);transform:translate(-50%,-50%);border-radius:50%;background:var(--coreCol);opacity:var(--coreLo);box-shadow:0 0 calc(var(--core)*1.5) 1px var(--coreCol);animation:hbeat var(--beat) ease-in-out infinite;pointer-events:none}
@keyframes hbeat{0%,100%{opacity:var(--coreLo)}12%{opacity:var(--coreHi)}24%{opacity:var(--coreLo)}36%{opacity:calc(var(--coreHi)*.7)}50%{opacity:var(--coreLo)}}
.hcard{position:absolute;z-index:4;left:0;top:0;width:max-content;max-width:calc(100vw - 2*var(--cardEdge));display:grid;gap:4px;justify-items:center;text-align:center;padding:10px 14px 8px;background:rgba(14,10,20,.92);border:1px solid rgba(var(--cr),.5);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55);outline:none}
.hcard .tip{position:absolute;left:var(--tipX,50%);top:0;width:var(--tipS);height:var(--tipS);background:#0e0a14;border:solid rgba(var(--cr),.5);border-width:1px 0 0 1px;border-top-left-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.hcard.up .tip{top:100%;border-width:0 1px 1px 0;border-radius:0 0 2px 0}
.hcard h2{margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:var(--nameFs);line-height:1;letter-spacing:.16em;padding-left:.16em;text-transform:uppercase;color:var(--c)}
.hcard .soon{margin:0;min-height:var(--touch);display:grid;align-items:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hcard .btn{min-height:max(44px,var(--touch));padding:0 20px;font-size:14px;font-weight:700;letter-spacing:.2em;text-indent:.2em;border:1px solid rgba(var(--cr),.55);border-radius:4px;background:transparent;color:var(--fg);transition:background-color .22s ease,border-color .22s ease,color .22s ease}
.hcard .btn:focus-visible,.hcard .btn:active{background:rgba(var(--cr),.22);border-color:var(--c);color:#fff}
.hcard .btn:focus-visible{outline:none}

.gear:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.hset{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(8,6,13,.6);outline:none}
.hsbox{overscroll-behavior:contain;touch-action:pan-y;position:relative;width:var(--setW);max-height:100%;overflow:auto;display:grid;gap:10px;padding:18px 20px;background:rgba(14,10,20,.96);border:1px solid var(--line);border-top:3px solid var(--lantern);box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(var(--lanternRgb),.12)}

<script id="fpLang">(function(){try{var l=localStorage.getItem('lb-lang'),f=l?l==='fr':/^fr/i.test((navigator.languages&&navigator.languages[0])||navigator.language||'');if(f){document.getElementById('gateBtn').textContent='Commencer';}}catch(e){}})()</script>

<script>
(()=>{
'use strict';
const LB={};
LB.FONT={display:'"Big Shoulders Display",Impact,sans-serif',body:'"DM Sans",system-ui,sans-serif'};
LB.coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
LB.DPR_COARSE_MAX=1.5;
LB.dpr=Math.min(LB.coarse?LB.DPR_COARSE_MAX:2,window.devicePixelRatio||1);
LB.$=id=>document.getElementById(id);
LB.cacheLayer=(w,h,draw,o)=>{
  o=o||{};const k=o.k||LB.dpr,rd=o.round||Math.ceil,ty=Math.floor((o.y0||0)*k);
  const c=document.createElement('canvas');c.width=rd(w*k);c.height=Math.max(1,rd(h*k)-ty);
  const x=c.getContext('2d');x.setTransform(k,0,0,k,0,-ty);draw(x);return c;
};
LB.COMMON=['lang','snd','mus','help','tuto'];
LB.OLD_KEYS={'lb-lang':['pn-lang','eb-lang'],'lb-snd':['db-optSnd'],'lb-mus':['db-optMus'],'lb-help':['db-optHelp']};
LB.id='';LB.old={};LB.oldPrefix=[];
LB.key=name=>LB.COMMON.includes(name)?'lb-'+name:'lb-'+LB.id+'-'+name;
LB.oldKeys=k=>{const o=(LB.OLD_KEYS[k]||[]).concat(LB.old[k]||[]);
  for(const [n,a] of LB.oldPrefix)if(k.startsWith(n))o.push(a+k.slice(n.length));return o};
LB.store={get(k,d){try{let v=localStorage.getItem(k);
  if(v==null)for(const o of LB.oldKeys(k)){v=localStorage.getItem(o);if(v!=null){try{localStorage.setItem(k,v)}catch(e){}break}}
  return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
LB.endSeen=()=>LB.store.get(LB.key('end'),'0')==='1';
LB.setup=({id,old={},oldPrefix=[],audio})=>{LB.id=id;LB.old=old;LB.oldPrefix=oldPrefix;
  try{const ks=[];for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));
    const want=Object.keys(LB.OLD_KEYS).concat(Object.keys(old));
    for(const [n,a] of oldPrefix)ks.filter(k=>k.startsWith(a)).forEach(k=>want.push(n+k.slice(a.length)));
    want.forEach(k=>LB.store.get(k))}catch(e){}
  LB.lang.init();LB.audio.config(audio);LB.audio.load()};
LB.LANGS=['en','fr'];
LB.lang={cur:'en',
  init(){let l='en';try{const nl=(navigator.languages&&navigator.languages[0])||navigator.language||'';if(/^fr/i.test(nl))l='fr'}catch(e){}
    const v=LB.store.get(LB.key('lang'),null);if(LB.LANGS.includes(v))l=v;return LB.lang.cur=l},
  set(l){if(!LB.LANGS.includes(l))return;LB.lang.cur=l;LB.store.set(LB.key('lang'),l)}};
LB._=(en,fr)=>LB.lang.cur==='fr'?fr:en;
LB.audio=(()=>{
  let ctx=null,master=null,sfx=null,mus=null,bg=false;
  const nbs=new Map(); 
  const lv={master:1,sfx:1,mus:1},A={sound:true,music:true,stat:{tone:0,noise:0,made:0}};
  const apply=smooth=>{if(!ctx)return;master.gain.value=lv.master;sfx.gain.value=A.sound?lv.sfx:0;
    const m=A.music?lv.mus:0;if(smooth)mus.gain.setTargetAtTime(m,ctx.currentTime,.12);else mus.gain.value=m};
  function ensure(){
    try{
      if(bg&&!document.hidden)bg=false; 
      if(ctx&&ctx.state==='closed'){ctx=null;nbs.clear()}
      if(!ctx){
        const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
        try{ctx=new C({latencyHint:'playback'})}catch(e){ctx=new C()}
        try{master=ctx.createGain();master.connect(ctx.destination);sfx=ctx.createGain();sfx.connect(master);mus=ctx.createGain();mus.connect(master);apply();A.stat.made++}
        catch(e){ctx=null;return null}
      }
      if(!bg&&ctx.state!=='running'&&ctx.resume)ctx.resume().catch(()=>{}); 
    }catch(e){}
    return ctx;
  }
  function background(off){bg=off;try{if(ctx){if(off){if(ctx.state==='running')ctx.suspend().catch(()=>{})}else ensure()}}catch(e){}}
  function tone(f,dur,type,vol,dest,when,f2,o){
    if(!ctx||(!dest&&!A.sound))return;
    if(ctx.state!=='running')ensure();
    try{
      const t=when||ctx.currentTime,atk=o&&o.atk!=null?o.atk:.006,end=o&&o.end||.0005,tail=o&&o.tail!=null?o.tail:.05;
      const os=ctx.createOscillator(),g=ctx.createGain();
      os.type=type||'sine';os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dur);
      if(atk>0){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk)}else g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(end,t+dur);
      os.connect(g);g.connect(dest||sfx);os.start(t);os.stop(t+dur+tail);A.stat.tone++;
    }catch(e){}
  }
  function noise(dur,vol,ft,ff,q,dest,when,ff2,o){
    if(!ctx||(!dest&&!A.sound))return;
    if(ctx.state!=='running')ensure();
    try{
      const t=when||ctx.currentTime,atk=o&&o.atk||0,end=o&&o.end||.0005;
      const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
      s.buffer=noiseBuf(1);s.loop=true;fl.type=ft;fl.frequency.setValueAtTime(ff,t);if(ff2)fl.frequency.exponentialRampToValueAtTime(ff2,t+dur);fl.Q.value=q||1;
      if(atk>0){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+atk)}else g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(end,t+dur);
      s.connect(fl);fl.connect(g);g.connect(dest||sfx);s.start(t);s.stop(t+dur+.05);A.stat.noise++;
    }catch(e){}
  }
  function noiseBuf(dur){
    if(!ctx)return null;
    let b=nbs.get(dur);
    if(!b){b=ctx.createBuffer(1,Math.round(ctx.sampleRate*dur),ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;nbs.set(dur,b)}
    return b;
  }
  function unlock(){
    ensure();
    try{if(ctx&&ctx.state==='running'&&!ctx.__u){ctx.__u=1;const b=ctx.createBuffer(1,1,22050),n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);n.start(0)}}catch(e){}
  }
  ['click','pointerup','mousedown','touchend','keydown'].forEach(ev=>window.addEventListener(ev,()=>{if(!ctx||ctx.state!=='running'||!ctx.__u)unlock()},true));
  document.addEventListener('visibilitychange',()=>background(document.hidden));
  window.addEventListener('pagehide',()=>background(true));window.addEventListener('pageshow',()=>background(document.hidden));
  window.addEventListener('blur',()=>{if(document.hidden)background(true)});window.addEventListener('focus',()=>{if(!document.hidden)background(false)});
  Object.assign(A,{
    ensure,background,tone,noise,noiseBuf,
    config(o){Object.assign(lv,o||{});apply()},
    load(){A.sound=LB.store.get(LB.key('snd'),'1')==='1';A.music=LB.store.get(LB.key('mus'),'1')==='1';apply()},
    setSound(on){A.sound=!!on;LB.store.set(LB.key('snd'),A.sound?'1':'0');apply();if(A.sound)ensure()},
    setMusic(on){A.music=!!on;LB.store.set(LB.key('mus'),A.music?'1':'0');apply(true);if(A.music)ensure()},
    now(){return ctx?ctx.currentTime:0}
  });
  Object.defineProperties(A,{ctx:{get:()=>ctx},dest:{get:()=>ctx&&ctx.destination},sfx:{get:()=>sfx},mus:{get:()=>mus},master:{get:()=>master},
    state:{get:()=>ctx?ctx.state:'none'},bg:{get:()=>bg}});
  return A;
})();
LB.QUALITY_T={
  coarse:.5,   
  win:2000,    
  avg:23,      
  spike:34,    
  spikes:5,    
  skip:250,    
  mid:.25,     
  midAbove:.3  
};
LB.quality=(()=>{
  const T=LB.QUALITY_T;
  let q=LB.coarse?T.coarse:1,slowT=0,slowN=0,slowS=0;
  const Q={
    get level(){return q},
    attach(cx){
      const pr=CanvasRenderingContext2D.prototype,db=Object.getOwnPropertyDescriptor(pr,'shadowBlur'),dc=Object.getOwnPropertyDescriptor(pr,'shadowColor');
      if(db&&db.set&&dc&&dc.set){
        Object.defineProperty(cx,'shadowBlur',{get(){return db.get.call(this)},set(v){db.set.call(this,v*q)},configurable:true});
        Object.defineProperty(cx,'shadowColor',{get(){return dc.get.call(this)},set(v){dc.set.call(this,q>0?v:'rgba(0,0,0,0)')},configurable:true});
      }
    },
    watch(raw,paused){
      if(paused||raw>T.skip||q===0)return;
      slowT+=raw;slowN++;if(raw>T.spike)slowS++;
      if(slowT>=T.win){const avg=slowT/slowN;if(avg>T.avg||slowS>=T.spikes)q=q>T.midAbove?T.mid:0;slowT=0;slowN=0;slowS=0}
    }
  };
  return Q;
})();
LB.HERO_T={
  block:{act:.333,rec:.7,grace:.06,perf:.08},
  dodge:{act:.333,rec:.7,grace:.05,perf:.08},
  hold:{act:.333,rec:.7,grace:.06,perf:.08,drain:.36,regen:.38,broken:.9},
  deny:.25,                                         
  hurt:{base:{block:.38,dodge:.38,hold:.55},min:.14,margin:.2}
};
LB.HERO_DIFF={
  easy:{hp:6,m:2,rm:1},
  normal:{hp:4,m:1,rm:1},
  hard:{hp:3,m:.6,rm:1.2},
  trial:{hp:4,heal:1}
};
LB.diff={
  cur:null,
  apply(name,chap){const out=Object.assign({},chap||{},LB.HERO_DIFF[name]);if(chap&&chap.trial)Object.assign(out,LB.HERO_DIFF.trial);return out},
  use(d){return LB.diff.cur=d}
};
LB.diff.cur=LB.diff.apply('normal');
LB.hero={
  create(){return{s:'ready',t:0,deny:0,at:-9,rd:0,rk:'',g:'block',held:false,stam:1}},
  dur(g){const H=LB.HERO_T[g||'block'],d=LB.diff.cur,m=d.m,rm=d.rm||1;
    return{act:H.act*m,rec:H.rec*rm,grace:H.grace,perf:H.perf*m,hurt:LB.HERO_T.hurt.base[g||'block'],broken:H.broken,drain:H.drain,regen:H.regen}},
  press(p,g,now){p.held=true;
    if(p.s==='ready'){p.s='act';p.t=0;p.at=now!=null?now:0;p.g=g||'block';return true}
    if(p.s==='act'||p.s==='recover')p.deny=LB.HERO_T.deny;
    return false},
  release(p){p.held=false},
  step(p,dt,o){o=o||{};const g=o.gesture||p.g||'block',H=LB.HERO_T[g],c=LB.hero.dur(g),hold=g==='hold',held=hold&&(o.held!==undefined?o.held:p.held);let ev='';
    p.t+=dt;p.deny=Math.max(0,p.deny-dt);
    if(p.s==='act'){
      if(held&&p.t>c.act){p.stam-=dt*H.drain;if(p.stam<=0){p.stam=0;p.s='recover';p.t=0;p.rd=c.broken;p.rk='broken';ev='broken'}}
      else if(p.t>=c.act){p.s='recover';p.t=0;p.rd=c.rec;p.rk='act'}
    }else if((p.s==='recover'||p.s==='hurt')&&p.t>=p.rd){p.s='ready';p.t=0}
    if(hold&&!(p.s==='act'&&held))p.stam=Math.min(1,p.stam+dt*H.regen);
    return ev},
  stops(p,o){o=typeof o==='number'?{win:o}:(o||{});const c=LB.hero.dur(p.g),win=o.win!=null?o.win:c.act,gr=o.grace!=null?o.grace:c.grace+(o.graceAdd||0);
    return(p.s==='act'&&p.t<=win+.002)||(p.s==='recover'&&p.rk==='act'&&p.t<gr)},
  stopped(p,held){p.s='ready';p.t=0;if(LB.tuto)LB.tuto.note(held?'hold':p.g==='dodge'?'dodge':'block')},

LB.cine=(()=>{
  const T=LB.CINE_T,c01=v=>v<0?0:v>1?1:v;

    box=document.createElement('div');box.className='cine';box.id='cine';box.hidden=true;
    box.innerHTML='<div class="cbox"><canvas id="cineC" aria-hidden="true"></canvas></div><p class="ccap" id="cineCap" aria-live="polite"></p><button type="button" class="btn ghost" id="cineSkip">Skip ›</button>';
    document.body.appendChild(box);if(LB.hdr)LB.hdr.watch(box);
    cvs=box.querySelector('canvas');cap=box.querySelector('.ccap');sk=box.querySelector('button');cx=cvs.getContext('2d');
    K=LB.dpr;cvs.width=960*K;cvs.height=540*K;
    sk.addEventListener('click',()=>{if(cur)cur.skip()});
    window.addEventListener('keydown',e=>{if(!cur)return;e.stopImmediatePropagation();e.preventDefault();if(T.keys.includes(e.key))cur.skip()},true);

    const dur=s=>Math.max(T.min,s.d);
    function advance(dt){
      st.t+=dt;if(o.onTick)o.onTick(st.t,dt);
      const sc=st.sc;let acc=0,i=0;for(;i<sc.length;i++){if(st.t<acc+dur(sc[i]))break;acc+=dur(sc[i])}
      if(i>=sc.length){finish();return false}
      const s=sc[i],d=dur(s),lt=st.t-acc;st.lt=lt;st.p=lt/d;st.al=Math.min(1,lt/T.fade,(d-lt)/T.fade);
      if(st.i!==i){st.i=i;cap.textContent=s.txt?s.txt():LB._(s.en,s.fr);cap.style.color=s.col||'';if(s.enter)s.enter(st)}
      if(s.cue)s.cue.forEach(([at,fn],k)=>{const n='cue'+i+'-'+k;if(!st[n]&&st.p>at){st[n]=1;fn(st)}});
      cap.style.opacity=String(c01(Math.min(lt-T.capIn,d-T.capIn-lt)/T.capFade));

    }
    function render(){
      cx.setTransform(K,0,0,K,0,0);cx.globalAlpha=1;cx.fillStyle='#000';cx.fillRect(0,0,960,540);
      st.sc[st.i].draw(st.p,st.t,st.lt,st,cx);
      cx.setTransform(K,0,0,K,0,0);cx.globalAlpha=1-st.al;cx.fillStyle='#000';cx.fillRect(0,0,960,540);cx.globalAlpha=1;

      if(!st)return;

      if(!advance(dt))return;

      if(key){seen=true;LB.store.set(key,'1')}
      try{o.onEnd&&o.onEnd()}catch(e){}
      try{d&&d()}catch(e){}
    }
    function play(done){
      if(st||cur)return;LB.audio.ensure();cvs.width=960*K;cvs.height=540*K;
      sk.textContent=LB._('Skip ›','Passer ›');cap.textContent='';cap.style.opacity='0';cap.style.color='';
      box.hidden=false;st={t:0,i:-1,last:performance.now(),done,raf:0,sc:typeof o.scenes==='function'?o.scenes():o.scenes};cur=self;

  }

})();

    else if(k==='Tab'){const f=[...$('hset').querySelectorAll('button')],i=f.indexOf(document.activeElement);e.preventDefault();try{f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}catch(x){}}
    return}
  if(k==='Escape'){if(card){e.preventDefault();close(true)}return}
  const f={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[k];if(!f)return;e.preventDefault();
  const o=focusables();if(!o.length)return;const a=document.activeElement,cur=a&&a.classList&&a.classList.contains('tw')?+a.dataset.n:card||0;
  if(card)close(false);
  const i=o.indexOf(cur),n=i<0?home():o[(i+f+o.length)%o.length];try{tw[n].focus({preventScroll:true})}catch(x){}}
function arrive(){bed.start();celebrate();try{tw[home()].focus({preventScroll:true})}catch(e){}}   // après « Commencer »
function back(){bed.start();celebrate();try{tw[backN&&states()[backN]!=='closed'?backN:home()].focus({preventScroll:true})}catch(e){}}   // retour d'un chapitre, sans écran
vars();motes();build();apply(feastStates());setRows();
$('langs').innerHTML=LB.LANGS.map(l=>'<button type="button" data-lang="'+l+'" aria-pressed="false">'+l.toUpperCase()+'</button>').join('');
document.querySelectorAll('#langs button').forEach(b=>b.addEventListener('click',()=>{LB.lang.set(b.dataset.lang);lang();b.blur()}));
$('ver').textContent='v'+LB.VERSION;$('ver').setAttribute('aria-label','Version '+LB.VERSION);
$('hcGo').addEventListener('click',e=>{e.stopPropagation();enter()});
$('hcard').addEventListener('click',e=>e.stopPropagation());
$('hub').addEventListener('click',e=>{if(card&&!e.target.closest('.tw,.hcard,.hfoot,.gear,.hset'))close(false)});
$('setBtn').addEventListener('click',e=>{e.stopPropagation();settings(!setOpen)});
$('hsClose').addEventListener('click',()=>settings(false));
$('tutoBtn').addEventListener('click',e=>{e.stopPropagation();tuto(!tutoOpen)});
$('htClose').addEventListener('click',()=>tuto(false));
$('htuto').addEventListener('click',e=>{if(e.target===$('htuto'))tuto(false)});
$('hset').addEventListener('click',e=>{if(e.target===$('hset'))settings(false)});
$('gateBtn').addEventListener('click',()=>{LB.audio.ensure();$('gate').hidden=true;LB.lift();arrive()});
document.addEventListener('keydown',keys);
addEventListener('resize',layout);
addEventListener('pageshow',e=>{if(e.persisted){leaving=false;$('hcGo').disabled=false;if($('gate').hidden){bed.nodes=null;bed.start()}}});   // retour arrière du navigateur (page gardée en mémoire)
lang();
if(backN){$('gate').hidden=true;LB.lift();back()}else{try{$('gateBtn').focus({preventScroll:true})}catch(e){}}
})();
</script>
