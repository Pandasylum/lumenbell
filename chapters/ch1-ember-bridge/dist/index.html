/* Layout: one centered column. Header with the phase track, two health bars, the 16:9 arena,
   then the single action button and options. Menu and phase cards are overlays in the arena (full screen on phones).
   Single dark look by choice: the whole scene is lit by lava. */
:root{
  --bg:#0c0911;
  --panel:#16111d;
  --line:#2d2438;
  --fg:#f0e8df;
  --muted:#a69a93;
  --ember:#ff7a2b;
  --glow:#ffc15a;
  --ward:#6fd3ff;
  --font-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* Jeu tactile : pas de sélection de texte, pas de menu contextuel ni de halo au toucher */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{
  color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;width:100%;margin:0 auto;display:grid;gap:14px}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:.95;letter-spacing:.01em;text-wrap:balance}
.phases{display:flex;gap:6px;margin:0;padding:0;list-style:none;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.phases li{border:1px solid var(--line);color:var(--muted)}
.phases button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:5px 12px;cursor:pointer;min-width:38px}
.phases button:disabled{opacity:.4;cursor:not-allowed}
.phases li:not(.on) button:hover:not(:disabled){color:var(--fg);background:rgba(255,255,255,.06)}
.phases li.on{border-color:var(--ember);color:#1a0c04;background:var(--ember)}

.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.bar{display:grid;gap:5px;min-width:0}
.bar span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar.boss{text-align:right}
.bar span b{margin-left:4px;color:var(--fg);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px}
.pips span{flex:1;height:12px;background:#0a070f;border:1px solid var(--line)}
.pips span.on{background:var(--ward);border-color:var(--ward)}
.bar.boss .pips span.on{background:var(--ember);border-color:var(--ember)}
.pips span.mark{border-bottom:3px solid var(--glow)}

.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border:1px solid var(--line);background:#0a070f;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:12px;background:rgba(8,6,13,.74);overflow:auto}
.card{max-width:460px;display:grid;gap:10px;justify-items:start;padding:20px 22px;background:var(--panel);border:1px solid var(--line)}
.card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px}
.rtab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;width:100%;margin:2px 0 4px}.rtab div{display:flex;flex-direction:column;gap:1px}.rtab small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.rtab b{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}.rtab .rec b{color:var(--ember)}

.btn{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border:0;padding:10px 20px;background:var(--ember);color:#1a0c04}
.btn:hover{background:var(--glow)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.ward{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;min-width:230px;height:56px;padding:0 22px;background:rgba(111,211,255,.1);color:var(--ward);border:2px solid var(--ward);touch-action:manipulation}
.ward:active{background:rgba(111,211,255,.3)}
.hint{margin:0;color:var(--muted);font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.hright{display:flex;align-items:center;gap:10px}
.mbtn{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.mrow{display:flex;gap:8px;align-items:center}
.mbtn:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.ov.clear{background:transparent;place-items:end center}
.ov.clear .card{background:rgba(22,17,29,.84);max-width:640px;padding:12px 18px;gap:6px}
.btn.ghost{background:none;color:var(--ember);border:2px solid var(--ember)}
.btn.ghost:hover{background:rgba(255,122,43,.15);color:var(--glow)}

@media (max-width:560px){
  .card{padding:12px 14px;gap:8px}
  .ward{width:100%}
  .opts{margin-left:0}
}
/* Smartphone */
@media (pointer:coarse){.hint{display:none}.ward{min-height:84px;font-size:24px}.btn,.mbtn,.phases button{min-height:44px}.opts label{padding:8px 4px}}
@media (max-width:480px){
  body{padding-block:12px 20px}
  .ov:not(.menu):not(.clear){position:fixed;z-index:40;background:rgba(8,6,13,.9);padding:16px}
  .ov:not(.menu):not(.clear) .card{max-width:420px}
}
@media (max-height:520px) and (orientation:landscape){
  /* Paysage : l'arène prend toute la hauteur, le reste passe dans une colonne à droite */
  body{padding-block:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px))}
  .wrap{min-height:calc(100dvh - 12px);max-width:none;grid-template-columns:minmax(0,1fr) clamp(170px,26vw,230px);grid-template-areas:"stage top" "stage bars" "stage controls";grid-template-rows:auto auto 1fr;gap:8px 12px;align-items:start}
  .top{grid-area:top;display:grid;gap:6px}
  .top h1{display:none}
  .hright{flex-wrap:nowrap;gap:6px}
  .phases button{min-width:30px;padding-inline:6px}

  .phases button,.mbtn{min-height:34px;padding-block:2px}
  .bars{grid-area:bars;grid-template-columns:1fr;gap:8px}
  .bar.boss{text-align:left}
  .bar span{font-size:11px}.pips span{height:9px}
  .stage{grid-area:stage;width:min(100%,calc((100dvh - 12px)*16/9));margin:0 auto;align-self:center}
  .controls{grid-area:controls;display:grid;gap:8px;align-self:end}
  .controls>*{width:100%;min-width:0}

}
/* Portrait mobile : les barres de vie ont une hauteur fixe (une ligne chacune, sans retour à la ligne),
   donc l'arène et le bouton d'action ne bougent plus quand les valeurs changent. Gros bouton d'action. */
@media (orientation:portrait) and (max-width:700px){
  .bars{grid-template-columns:1fr;gap:8px}
  .bar{gap:4px}
  .bar.boss{text-align:left}
  .bar span{display:flex;justify-content:space-between;white-space:nowrap;min-height:16px;line-height:16px}

}

<script>
(()=>{
'use strict';
/* ---------- shared/ : commun à la série (voir shared/NOTES.md). Un seul objet, LB, dans l'IIFE du chapitre ---------- */
const LB={};
/* Polices du canvas : mêmes familles que --font-display / --font-body du CSS (build/fonts.css, inlinées par le build) */
LB.FONT={display:'"Big Shoulders Display",Impact,sans-serif',body:'"DM Sans",system-ui,sans-serif'};
/* ---------- sauvegarde : clés lb-… ----------
   Clés communes à la série : lb-<nom> pour les noms de COMMON ; propres à un chapitre : lb-<id>-<nom> (LB.key).
   LB.store.get lit la nouvelle clé, sinon les anciennes dans l'ordre (OLD_KEYS communes, puis celles du chapitre, puis
   les préfixes du chapitre) et recopie la première trouvée dans la nouvelle. Les anciennes clés ne sont jamais effacées ni écrites. */
LB.COMMON=['lang','snd','mus','help'];
LB.OLD_KEYS={'lb-lang':['pn-lang','eb-lang'],'lb-snd':['db-optSnd'],'lb-mus':['db-optMus'],'lb-help':['db-optHelp']};
LB.id='';LB.old={};LB.oldPrefix=[];
LB.key=name=>LB.COMMON.includes(name)?'lb-'+name:'lb-'+LB.id+'-'+name;
LB.oldKeys=k=>{const o=(LB.OLD_KEYS[k]||[]).concat(LB.old[k]||[]);
  for(const [n,a] of LB.oldPrefix)if(k.startsWith(n))o.push(a+k.slice(n.length));return o};
LB.store={get(k,d){try{let v=localStorage.getItem(k);
  if(v==null)for(const o of LB.oldKeys(k)){v=localStorage.getItem(o);if(v!=null){try{localStorage.setItem(k,v)}catch(e){}break}}
  return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* À appeler en tête du chapitre, avant toute lecture : id (préfixe lb-<id>-), old ({nouvelle clé:[anciennes]}),
   oldPrefix ([[début de la nouvelle clé, début de l'ancienne]], pour les records). Migre au démarrage toutes les clés
   connues (et chaque ancienne clé à préfixe présente), puis fixe la langue. */
LB.setup=({id,old={},oldPrefix=[],audio})=>{LB.id=id;LB.old=old;LB.oldPrefix=oldPrefix;
  try{const ks=[];for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));
    const want=Object.keys(LB.OLD_KEYS).concat(Object.keys(old));
    for(const [n,a] of oldPrefix)ks.filter(k=>k.startsWith(a)).forEach(k=>want.push(n+k.slice(a.length)));
    want.forEach(k=>LB.store.get(k))}catch(e){}
  LB.lang.init();LB.audio.config(audio);LB.audio.load()};
/* ---------- langue et texte ----------
   Choix mémorisé (lb-lang) prioritaire ; sinon la langue de l'appareil (français si elle commence par « fr »), sinon anglais.
   LB.LANGS : ordre des boutons de langue (celui du Chapitre I). */
LB.LANGS=['en','fr'];
LB.lang={cur:'en',
  init(){let l='en';try{const nl=(navigator.languages&&navigator.languages[0])||navigator.language||'';if(/^fr/i.test(nl))l='fr'}catch(e){}
    const v=LB.store.get(LB.key('lang'),null);if(LB.LANGS.includes(v))l=v;return LB.lang.cur=l},
  set(l){if(!LB.LANGS.includes(l))return;LB.lang.cur=l;LB.store.set(LB.key('lang'),l)}};
LB._=(en,fr)=>LB.lang.cur==='fr'?fr:en;
/* ---------- audio : un seul contexte pour toute la série ----------
   LB.audio.ctx : l'unique AudioContext (créé au premier ensure(), recréé s'il est fermé). Chaîne : sources → bus sfx / mus → master → sortie.
   Niveaux par chapitre : LB.setup({audio:{master,sfx,mus}}), 1 par défaut. LB.audio.dest = sortie brute (musique qui a sa propre chaîne).
   Réglages Son / Musique : lb-snd, lb-mus lus par LB.store (load, appelé par LB.setup), écrits par setSound / setMusic.
   Arrière-plan (onglet caché, écran verrouillé, page quittée) : le contexte est suspendu, relancé au retour ou au premier geste. */
LB.audio=(()=>{
  let ctx=null,master=null,sfx=null,mus=null,bg=false,nb=null;
  const lv={master:1,sfx:1,mus:1},A={sound:true,music:true,stat:{tone:0,noise:0,made:0}};
  /* smooth : le bus musique suit en fondu (constante de temps 0,12 s, celle de l'arrêt de la musique du Chapitre I) ; sinon il prend sa valeur d'un coup (création du contexte) */
  const apply=smooth=>{if(!ctx)return;master.gain.value=lv.master;sfx.gain.value=A.sound?lv.sfx:0;
    const m=A.music?lv.mus:0;if(smooth)mus.gain.setTargetAtTime(m,ctx.currentTime,.12);else mus.gain.value=m};
  function ensure(){
    try{
      if(bg&&!document.hidden)bg=false; /* garde-fou : l'arrière-plan ne peut pas durer quand la page est visible (un événement de retour perdu bloquerait le son) */
      if(ctx&&ctx.state==='closed'){ctx=null;nb=null}
      if(!ctx){
        const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
        try{ctx=new C({latencyHint:'playback'})}catch(e){ctx=new C()}
        try{master=ctx.createGain();master.connect(ctx.destination);sfx=ctx.createGain();sfx.connect(master);mus=ctx.createGain();mus.connect(master);apply();A.stat.made++}
        catch(e){ctx=null;return null}
      }
      if(!bg&&ctx.state!=='running'&&ctx.resume)ctx.resume().catch(()=>{}); /* suspended, ou « interrupted » sur Safari */
    }catch(e){}
    return ctx;
  }
  /* off=true : le contexte est suspendu et reste coupé tant qu'on n'est pas revenu */
  function background(off){bg=off;try{if(ctx){if(off){if(ctx.state==='running')ctx.suspend().catch(()=>{})}else ensure()}}catch(e){}}
  /* enveloppe par défaut = celle du Chapitre II ; o={atk,end,tail} pour une enveloppe plus ancienne (Chapitre I) */
  function tone(f,dur,type,vol,dest,when,f2,o){
    if(!ctx||(!dest&&!A.sound))return;
    if(ctx.state!=='running')ensure();
    try{
      const t=when||ctx.currentTime,atk=o&&o.atk!=null?o.atk:.006,end=o&&o.end||.0005,tail=o&&o.tail!=null?o.tail:.05;
      const os=ctx.createOscillator(),g=ctx.createGain();
      os.type=type||'sine';os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dur);
      if(atk>0){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk)}else g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(end,t+dur);
      os.connect(g);g.connect(dest||sfx);os.start(t);os.stop(t+dur+tail);A.stat.tone++;
    }catch(e){}
  }
  function noise(dur,vol,ft,ff,q,dest,when,ff2,o){
    if(!ctx||(!dest&&!A.sound))return;
    if(ctx.state!=='running')ensure();
    try{
      if(!nb){nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
      const t=when||ctx.currentTime,atk=o&&o.atk||0,end=o&&o.end||.0005;
      const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
      s.buffer=nb;s.loop=true;fl.type=ft;fl.frequency.setValueAtTime(ff,t);if(ff2)fl.frequency.exponentialRampToValueAtTime(ff2,t+dur);fl.Q.value=q||1;
      if(atk>0){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+atk)}else g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(end,t+dur);
      s.connect(fl);fl.connect(g);g.connect(dest||sfx);s.start(t);s.stop(t+dur+.05);A.stat.noise++;
    }catch(e){}
  }
  /* le navigateur n'autorise le son qu'après un vrai geste : on crée / relance le contexte à chacun d'eux tant qu'il ne tourne pas, et on joue un son muet pour l'amorcer */
  function unlock(){
    ensure();
    try{if(ctx&&ctx.state==='running'&&!ctx.__u){ctx.__u=1;const b=ctx.createBuffer(1,1,22050),n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);n.start(0)}}catch(e){}
  }
  ['click','pointerup','mousedown','touchend','keydown'].forEach(ev=>window.addEventListener(ev,()=>{if(!ctx||ctx.state!=='running'||!ctx.__u)unlock()},true));
  document.addEventListener('visibilitychange',()=>background(document.hidden));
  window.addEventListener('pagehide',()=>background(true));window.addEventListener('pageshow',()=>background(document.hidden));
  window.addEventListener('blur',()=>{if(document.hidden)background(true)});window.addEventListener('focus',()=>{if(!document.hidden)background(false)});
  Object.assign(A,{
    ensure,background,tone,noise,
    config(o){Object.assign(lv,o||{});apply()},
    load(){A.sound=LB.store.get(LB.key('snd'),'1')==='1';A.music=LB.store.get(LB.key('mus'),'1')==='1';apply()},
    setSound(on){A.sound=!!on;LB.store.set(LB.key('snd'),A.sound?'1':'0');apply();if(A.sound)ensure()},
    setMusic(on){A.music=!!on;LB.store.set(LB.key('mus'),A.music?'1':'0');apply(true);if(A.music)ensure()},
    now(){return ctx?ctx.currentTime:0}
  });
  /* défini à part : Object.assign recopierait la valeur des accesseurs au lieu de les garder */
  Object.defineProperties(A,{ctx:{get:()=>ctx},dest:{get:()=>ctx&&ctx.destination},sfx:{get:()=>sfx},mus:{get:()=>mus},master:{get:()=>master},
    state:{get:()=>ctx?ctx.state:'none'},bg:{get:()=>bg}});
  return A;
})();
/* ---------- LB.hero : la machine à états du Veilleur, commune aux deux chapitres (session engine/hero-states) ----------
   ready -> act -> recover -> ready. Un appui n'agit qu'en ready ; pendant l'action ou la récupération il ne lance rien et ne fait que
   poser deny (la lanterne du Veilleur passe au rouge, dessin du chapitre). Chaque attaque est jugée à son impact : elle est arrêtée
   si le Veilleur est en action à cet instant, ou dans la grâce (grace) de sa récupération ; une attaque arrêtée le renvoie à ready
   (LB.hero.stopped), de sorte qu'une série s'enchaîne. Un coup reçu (hurt) étourdit le Veilleur, raccourci pour qu'il puisse arrêter
   l'attaque suivante : min(base, max(min, écart − marge)).
   Gestes : block (bloquer, tapoter), dodge (esquiver), hold (bloquer tenu : la garde dure tant que le bouton est tenu, avec une
   endurance drain / regen par seconde ; épuisée, récupération broken). L'action dure act × m, la récupération rec × rm (m, rm :
   difficulté, LB.diff.cur) ; un arrêt appuyé moins de perf × m avant l'impact est parfait.
   Réglages propres à une attaque (fenêtre courte du souffle, marge de plus en Difficile) : jamais ici, le chapitre les passe à
   LB.hero.stops(p, {win, grace, graceAdd}) et LB.hero.hurt(p, écart, {dur, min}). Noms d'état gardés (p.s, p.t, p.rd, p.rk, p.deny,
   p.at) : lus par le dessin et par les tests. Durées en secondes, reprises telles quelles des deux chapitres. */
LB.HERO_T={
  block:{act:.333,rec:.7,grace:.06,perf:.08},
  dodge:{act:.333,rec:.7,grace:.05,perf:.08},
  hold:{act:.333,rec:.7,grace:.06,perf:.08,drain:.36,regen:.38,broken:.9},
  deny:.25,                                         /* appui refusé : durée du retour rouge */
  hurt:{base:{block:.38,dodge:.38,hold:.55},min:.14,margin:.2}
};
/* Difficulté du Veilleur : PV (hp), multiplicateurs de l'action (m) et de la récupération (rm). trial : Épreuve, 4 PV au départ, +1 PV entre les
   phases (heal) dans la limite des 4 PV de départ (décision du 31 octobre, qui remplace « aucun soin ») ; elle s'ajoute à la difficulté de base (m et rm de Normal ou de Difficile). */
LB.HERO_DIFF={
  easy:{hp:6,m:2,rm:1},
  normal:{hp:4,m:1,rm:1},
  hard:{hp:3,m:.6,rm:1.2},
  trial:{hp:4,heal:1}
};
LB.diff={
  cur:null,
  /* difficulté du chapitre (ses propres réglages) + celle du Veilleur ; chap.trial ajoute les règles de l'Épreuve */
  apply(name,chap){const out=Object.assign({},chap||{},LB.HERO_DIFF[name]);if(chap&&chap.trial)Object.assign(out,LB.HERO_DIFF.trial);return out},
  /* difficulté en cours (lue par LB.hero pour m et rm) : le chapitre l'appelle à chaque choix de difficulté */
  use(d){return LB.diff.cur=d}
};
LB.diff.cur=LB.diff.apply('normal');
LB.hero={
  create(){return{s:'ready',t:0,deny:0,at:-9,rd:0,rk:'',g:'block',held:false,stam:1}},
  /* durées du geste g pour la difficulté en cours */
  dur(g){const H=LB.HERO_T[g||'block'],d=LB.diff.cur,m=d.m,rm=d.rm||1;
    return{act:H.act*m,rec:H.rec*rm,grace:H.grace,perf:H.perf*m,hurt:LB.HERO_T.hurt.base[g||'block'],broken:H.broken,drain:H.drain,regen:H.regen}},
  /* appui : en ready, lance l'action (renvoie vrai, `now` = date de l'appui pour le parfait) ; sinon deny */
  press(p,g,now){p.held=true;
    if(p.s==='ready'){p.s='act';p.t=0;p.at=now!=null?now:0;p.g=g||'block';return true}
    if(p.s==='act'||p.s==='recover')p.deny=LB.HERO_T.deny;
    return false},
  release(p){p.held=false},
  /* avance d'un pas ; renvoie 'broken' quand la garde tenue vient de s'épuiser, sinon '' */
  step(p,dt,o){o=o||{};const g=o.gesture||p.g||'block',H=LB.HERO_T[g],c=LB.hero.dur(g),hold=g==='hold',held=hold&&(o.held!==undefined?o.held:p.held);let ev='';
    p.t+=dt;p.deny=Math.max(0,p.deny-dt);
    if(p.s==='act'){
      if(held&&p.t>c.act){p.stam-=dt*H.drain;if(p.stam<=0){p.stam=0;p.s='recover';p.t=0;p.rd=c.broken;p.rk='broken';ev='broken'}}
      else if(p.t>=c.act){p.s='recover';p.t=0;p.rd=c.rec;p.rk='act'}
    }else if((p.s==='recover'||p.s==='hurt')&&p.t>=p.rd){p.s='ready';p.t=0}
    if(hold&&!(p.s==='act'&&held))p.stam=Math.min(1,p.stam+dt*H.regen);
    return ev},

/* ---------- LB.cine : intro et outro des chapitres (session engine/cine, 1er novembre 2026) ----------
   Le cadre commun des cinématiques : canvas dédié 960 x 540 en plein écran (#cineC), légende HTML dessous (#cineCap),
   bouton « Passer » (#cineSkip), cartons enchaînés avec un fondu au noir à chaque bout, Échap / Entrée / Espace passent.
   Le chapitre ne donne que ses scènes : LB.cine.create({key, scenes, onStart, onTick, onEnd}) → {play(done), replay(done),
   seen(), playing(), skip()}.
   - scenes : tableau (ou fonction qui le rend au moment de jouer) de cartons {d, en, fr, draw} ; à la place de en/fr, txt()
     peut rendre le texte déjà traduit (le Chapitre II garde ainsi sa fonction de texte, relue par tests/ch2-texts.js) ; col = couleur de la
     légende (annonce du chapitre suivant) ; enter(st) au début du carton ; cue = [[p, fn], …] : fn une seule fois quand
     l'avancement p du carton dépasse le seuil. draw(p, t, lt, st, cx) : p avancement du carton (0 à 1), t temps depuis le
     début, lt temps dans le carton, st état de la lecture (drapeaux libres), cx contexte du canvas (repère 960 x 540).
   - key : drapeau « vue » (LB.key(key), par ex. lb-ch1-intro), écrit à la fin ou au passage ; sans key, aucun drapeau.
     testSeen : la copie de test du Chapitre I le pose pour ne jamais lire le drapeau (intro considérée vue).
   - play ne regarde pas le drapeau : c'est le chapitre qui décide (seen()) ; replay = play (rejeu depuis un menu).
   - Durées : LB.CINE_T (fondu, légende, durée minimale d'un carton) ; la durée de chaque carton est dans la table du chapitre.
   - Horloge : requestAnimationFrame (pas borné à dtMax). LB.cine.manual = true (copies de test) : plus de rAF, le test
     appelle LB.cine.step(dt, dessiner).
   - Le cadre (boîte, légende, bouton) est créé ici avec son style (LB.CINE_CSS) ; le bouton prend la classe « btn ghost »
     du chapitre (sa couleur). Le dessin ne doit jamais tirer Math.random hors des scènes qui le faisaient déjà. */
LB.CINE_T={fade:.8,capIn:.5,capFade:.6,min:6,dtMax:.1,keys:['Escape','Enter',' ']};
LB.CINE_CSS='.cine{position:fixed;inset:0;z-index:120;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}\n'+
 '.cine[hidden]{display:none}\n'+
 '.cbox{width:min(100%,calc((100dvh - 120px)*16/9));aspect-ratio:16/9}\n'+
 '.cbox canvas{display:block;width:100%;height:100%}\n'+
 '.ccap{margin:0;min-height:3.2em;max-width:min(760px,100%);text-align:center;color:var(--fg);font-size:clamp(15px,2.4vw,22px);line-height:1.45;text-wrap:balance;opacity:0}\n'+
 '#cineSkip{position:absolute;right:14px;bottom:14px;padding:8px 18px;font-size:15px;min-height:40px}\n';
LB.cine=(()=>{
  const T=LB.CINE_T,c01=v=>v<0?0:v>1?1:v;
  let box=null,cvs=null,cx=null,cap=null,sk=null,K=1,cur=null;
  function mount(){
    if(box)return{cx,K};
    const st=document.createElement('style');st.textContent=LB.CINE_CSS;document.head.appendChild(st);
    box=document.createElement('div');box.className='cine';box.id='cine';box.hidden=true;
    box.innerHTML='<div class="cbox"><canvas id="cineC" aria-hidden="true"></canvas></div><p class="ccap" id="cineCap" aria-live="polite"></p><button type="button" class="btn ghost" id="cineSkip">Skip ›</button>';
    document.body.appendChild(box);
    cvs=box.querySelector('canvas');cap=box.querySelector('.ccap');sk=box.querySelector('button');cx=cvs.getContext('2d');
    const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
    K=Math.min(2,coarse?1.25:(window.devicePixelRatio||1));cvs.width=960*K;cvs.height=540*K;
    sk.addEventListener('click',()=>{if(cur)cur.skip()});
    window.addEventListener('keydown',e=>{if(!cur)return;e.stopImmediatePropagation();e.preventDefault();if(T.keys.includes(e.key))cur.skip()},true);
    return{cx,K};
  }
  function create(o){
    mount();
    const key=o.key?LB.key(o.key):null;
    let seen=o.testSeen?true:key?LB.store.get(key,'0')==='1':false,st=null;
    const dur=s=>Math.max(T.min,s.d);
    function advance(dt){
      st.t+=dt;if(o.onTick)o.onTick(st.t,dt);
      const sc=st.sc;let acc=0,i=0;for(;i<sc.length;i++){if(st.t<acc+dur(sc[i]))break;acc+=dur(sc[i])}
      if(i>=sc.length){finish();return false}
      const s=sc[i],d=dur(s),lt=st.t-acc;st.lt=lt;st.p=lt/d;st.al=Math.min(1,lt/T.fade,(d-lt)/T.fade);
      if(st.i!==i){st.i=i;cap.textContent=s.txt?s.txt():LB._(s.en,s.fr);cap.style.color=s.col||'';if(s.enter)s.enter(st)}
      if(s.cue)s.cue.forEach(([at,fn],k)=>{const n='cue'+i+'-'+k;if(!st[n]&&st.p>at){st[n]=1;fn(st)}});
      cap.style.opacity=String(c01(Math.min(lt-T.capIn,d-T.capIn-lt)/T.capFade));
      return true;
    }
    function render(){
      cx.setTransform(K,0,0,K,0,0);cx.globalAlpha=1;cx.fillStyle='#000';cx.fillRect(0,0,960,540);
      st.sc[st.i].draw(st.p,st.t,st.lt,st,cx);
      cx.setTransform(K,0,0,K,0,0);cx.globalAlpha=1-st.al;cx.fillStyle='#000';cx.fillRect(0,0,960,540);cx.globalAlpha=1;
    }
    function frame(now){
      if(!st)return;
      const dt=Math.min(T.dtMax,(now-st.last)/1000);st.last=now;
      if(!advance(dt))return;
      render();st.raf=requestAnimationFrame(frame);
    }
    function finish(){
      if(!st)return;const d=st.done;cancelAnimationFrame(st.raf);st=null;cur=null;box.hidden=true;
      if(key){seen=true;LB.store.set(key,'1')}
      try{o.onEnd&&o.onEnd()}catch(e){}
      try{d&&d()}catch(e){}
    }
    function play(done){
      if(st||cur)return;LB.audio.ensure();cvs.width=960*K;cvs.height=540*K;
      sk.textContent=LB._('Skip ›','Passer ›');cap.textContent='';cap.style.opacity='0';cap.style.color='';
      box.hidden=false;st={t:0,i:-1,last:performance.now(),done,raf:0,sc:typeof o.scenes==='function'?o.scenes():o.scenes};cur=self;
      if(o.onStart)o.onStart(st);
      try{sk.focus({preventScroll:true})}catch(e){}
      if(!LB.cine.manual)st.raf=requestAnimationFrame(frame);
    }
    const self={play,replay:play,seen:()=>seen,playing:()=>!!st,skip:finish,
      step(dt,draw){if(st&&advance(dt)&&draw!==false)render()}};
    return self;
  }
  return{create,mount,manual:false,active:()=>cur,skip:()=>{if(cur)cur.skip()},step:(dt,draw)=>{if(cur)cur.step(dt,draw)}};
})();

/* ---------- LB.title : titre de fin d'intro (décision n° 6 du 28 octobre : comme au Chapitre I) ----------
   « LUMEN » couleur du chapitre + « BELL » crème, 96 px, halo de la couleur du chapitre ; ligne du chapitre en Big Shoulders
   26 px crème dessous. LB.title(ctx, t, t0, {col, sub}) : apparaît en TITLE_T.in secondes à partir de t0. Placement :

/* LB.BRAND : règle de couleur unique du mot « LUMENBELL » (titre d'intro, carton « à suivre », menu des deux chapitres) :
   « LUMEN » = LB.CH_COL du chapitre (couleur du chapitre au menu), « BELL » = bell (crème). Aucune autre couleur en dur pour ce mot ; garde dans tests/cine.js. */

LB.TITLE_T={in:1.75,size:96,sub:26,y:118,subDy:42,gap:8,maxW:840,ls:4,subLs:3,glow:.85,blur:30,subCol:'rgba(240,232,223,.88)'};

LB.title=(c,t,t0,o)=>{
  const T=LB.TITLE_T,a=(t-t0)/T.in,ta=a<0?0:a>1?1:a;if(!(ta>0))return;
  c.save();c.globalAlpha=ta;c.shadowColor=LB.rgba(o.col,T.glow);c.shadowBlur=T.blur;c.textAlign='left';
  const ls=c.letterSpacing!==undefined,font=s=>'800 '+s+'px '+LB.FONT.display;
  c.font=font(T.size);if(ls)c.letterSpacing=T.ls+'px';

  const U=o.sub.toUpperCase(),asc=c.measureText(U).actualBoundingBoxAscent||T.sub*.72;
  c.fillText(U,480,Math.max(T.y+T.subDy,T.y+desc+T.gap+asc));c.restore();

/* ---------- LB.input : entrées communes ----------
   Action : Espace, flèche haut, W, Z, toucher l'arène ou le bouton d'action ; relâchement (touche, doigt, perte du focus) pour
   tous ; P / Échap : pause ; R : réessayer ; Entrée / Espace : carte, pause (reprendre) et menu (Normal) ; écran de démarrage :
   seul son bouton agit ; case à cocher focalisée : rien. bind({press, release, pause, retry, skip}) : skip(e) rend true si le
   chapitre a pris la touche (cinématique propre au chapitre). */
LB.input=(()=>{
  const ACT=[' ','Spacebar','ArrowUp','w','W','z','Z'];let h={},bound=false;
  function bind(hh){h=hh;if(bound)return;bound=true;
    const cv=document.getElementById('c'),ward=document.getElementById('ward'),rel=()=>{if(h.release)h.release()};
    for(const t of [cv,ward]){if(!t)continue;
      t.addEventListener('pointerdown',e=>{e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(x){}if(h.press)h.press()});
      t.addEventListener('pointerup',rel);t.addEventListener('pointercancel',rel);t.addEventListener('lostpointercapture',rel)}
    if(ward){ward.addEventListener('click',e=>{if(e.detail===0&&h.press)h.press()});ward.addEventListener('contextmenu',e=>e.preventDefault())}
    window.addEventListener('blur',rel);
    window.addEventListener('keyup',e=>{if(ACT.includes(e.key)||e.key==='Enter')rel()});   /* Entrée : bouton d'action focalisé (clic clavier) */
    window.addEventListener('keydown',e=>{
      if(LB.gate.visible())return;   /* écran de démarrage : seul le bouton agit */
      const k=e.key,a=document.activeElement;
      if(a&&a.tagName==='INPUT')return;
      if(h.skip&&h.skip(e))return;
      if(e.repeat){if(ACT.includes(k)&&!LB.menu.visible())e.preventDefault();return}
      if(k==='r'||k==='R'){if(!LB.menu.visible()&&h.retry){e.preventDefault();h.retry()}return}
      if(k==='p'||k==='P'||k==='Escape'){if(!LB.menu.visible()&&h.pause){e.preventDefault();h.pause()}return}
      const ok=k===' '||k==='Enter';
      if(LB.pause.visible()){if(ok&&a!==document.getElementById('pMenu')){e.preventDefault();LB.pause.resume()}return}
      if(LB.menu.visible()){const mn=document.getElementById('menu');if(ok&&!mn.contains(a)){e.preventDefault();mn.querySelector('#mphM [data-diff=normal]').click()}return}
      if(LB.card.visible()){if(ok&&a!==LB.card.el.go){e.preventDefault();LB.card.el.go.click()}return}
      if(ACT.includes(k)){e.preventDefault();if(h.press)h.press()}
    });
  }
  return{bind,ACT};
})();

   haut) ; cx, cy, r = cercle (rayon à l'ouverture) ; tt = temps jusqu'à l'impact ; act = durée de l'action. Le Chapitre II garde
   ses aides propres : demi-cercle des faisceaux (hold), pointillé des reflets (fake). Table LB.CUE_T. */
LB.CUE_T={lead:.8,bar:{w:68,h:6},shrink:20,open:'#6fd3ff',near:'rgba(255,122,43,.85)',ring:'rgba(111,211,255,.9)'};

  if(tt<=act&&tt>0){ctx.strokeStyle=T.ring;ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.cx,o.cy,o.r-T.shrink*(1-tt/act),0,6.283);ctx.stroke()}};

function tone(f,d,type,v,slide){LB.audio.tone(f,d,type,v||.05,null,null,slide?Math.max(30,f+slide):0,E_TONE)}
const say=t=>{el.live.textContent=t};
function noise(d,v,f0,f1){LB.audio.noise(d,v,'bandpass',f0,.9,null,null,Math.max(30,f1),{atk:Math.min(.03,d/3),end:.0001})}
function footfall(big){tone(big?58:90,big?.22:.1,'sine',big?.16:.08,-30);noise(big?.16:.07,big?.1:.05,big?500:900,big?120:300)}
function anvil(){tone(1320,.6,'triangle',.06,0);tone(1985,.4,'sine',.04,0);tone(160,.14,'square',.06,-60)}
function forgeSparks(S,x,y,n){for(let i=0;i<(n||24);i++){const a=rand(-3.0,-.15),v=rand(160,520),L=rand(.25,.7);S.sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:900,life:L,max:L,col:i%3?'#ffd27a':(i%2?'#ffffff':'#ff9a3c'),sz:rand(2,4.5)})}}
function boom(d,v){tone(55,d,'sine',v,-20);noise(d,v*.9,900,50)}
function whoosh(d,v,up){noise(d,v,up?400:2800,up?2800:400)}
/* Cri de douleur du Colosse : hurlement qui monte puis s'effondre en gémissement tremblant */
function painCry(d,v){
  const AC=LB.audio.ctx;if(!LB.audio.sound||!AC)return;
  if(AC.state!=='running')ensureAudio();
  d=d||1.7;v=v||.17;
  try{
    const n=AC.currentTime,g=AC.createGain(),f=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),lfo=AC.createOscillator(),lg=AC.createGain();
    f.type='bandpass';f.Q.value=2.2;f.frequency.setValueAtTime(1100,n);f.frequency.linearRampToValueAtTime(1500,n+.2);f.frequency.exponentialRampToValueAtTime(420,n+d);
    f2.type='lowpass';f2.frequency.value=2600;
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.05);g.gain.setValueAtTime(v,n+d*.35);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    lfo.frequency.setValueAtTime(7,n);lfo.frequency.linearRampToValueAtTime(11,n+d);lg.gain.setValueAtTime(10,n);lg.gain.linearRampToValueAtTime(26,n+d);lfo.connect(lg);
    [[180,'sawtooth'],[186,'sawtooth'],[90,'square']].forEach(([fr,ty])=>{
      const o=AC.createOscillator();o.type=ty;
      o.frequency.setValueAtTime(fr,n);o.frequency.exponentialRampToValueAtTime(fr*1.7,n+.16);o.frequency.exponentialRampToValueAtTime(fr*.42,n+d);
      lg.connect(o.frequency);o.connect(f);o.start(n);o.stop(n+d);
    });
    f.connect(f2);f2.connect(g);g.connect(LB.audio.sfx);lfo.start(n);lfo.stop(n+d);
  }catch(e){}
  noise(d*.6,v*.5,2400,600);
}
function roar(){
  const AC=LB.audio.ctx;if(!LB.audio.sound||!AC)return;
  if(AC.state!=='running')ensureAudio();
  try{
    const n=AC.currentTime,d=.9,g=AC.createGain(),f=AC.createBiquadFilter(),lfo=AC.createOscillator(),lg=AC.createGain();
    f.type='lowpass';f.frequency.setValueAtTime(900,n);f.frequency.exponentialRampToValueAtTime(220,n+d);
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16,n+.06);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    lfo.frequency.value=38;lg.gain.value=30;lfo.connect(lg);
    [95,142,71].forEach((fr,i)=>{
      const o=AC.createOscillator();o.type=i?'square':'sawtooth';
      o.frequency.setValueAtTime(fr*1.5,n);o.frequency.exponentialRampToValueAtTime(fr*.55,n+d);
      lg.connect(o.frequency);o.connect(f);o.start(n);o.stop(n+d);
    });
    lfo.start(n);lfo.stop(n+d);f.connect(g);g.connect(LB.audio.sfx);
  }catch(e){}
}

/* ---------- state ---------- */
function makeEmbers(){return Array.from({length:70},()=>({x:rand(0,W),y:rand(0,H),v:rand(14,48),s:rand(1,2.6),ph:rand(0,6.28)}))}

  const emb=G?G.embers:makeEmbers();

     boss:{s:'idle',t:0,wait:1.5},pl:Object.assign(LB.hero.create(),{x:PX}),
     sparks:[],rings:[],floats:[],trail:[],swTrail:[],sw:{p1:false,p2:false,p3:false},atk:{last:'',n:0,plain:0},kick:0,wound:0,p2:false,fy:null,jf:null,fin:null,ringFx:null,embers:emb,

/* Remet à zéro les variantes d'attaque du Colosse (durées modifiées, double crochet, souffle enchaîné…). */
function clearMods(b){b.fli=0;b.fyb=false;b.sk=0;b.dbl=false;b.dbf=false;b.second=false;b.combo=false;b.pend=null}
function toIdle(){
  const b=G.boss;b.s='idle';b.t=0;b.fury=0;clearMods(b);
  b.wait=DIFF.hard?rand(DIFF.waitMin,DIFF.waitMax):rand(1.2,2.2);
}

function start(){
  el.go2.hidden=true;el.table.hidden=true;
  if(RUN.on&&!R&&!Q&&G&&G.mode==='lost'){restartRun();return}
  if(pendingLore){pendingLore=false;paused=false;el.ov.hidden=true;ensureAudio();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();return}
  if(R){
    if(R.mode==='lost'){if(RUN.on)restartRun();else beginP3(true);return}
    if(R.mode==='space'){showMenu(false);return}
    R=null;setPhaseUI(1);newGame();lastP=-1;lastB=-1;hud();
  }
  if(Q){
    if(Q.mode==='lost'){if(RUN.on)restartRun();else beginP2(true);return}
    if(Q.mode==='lake'){beginP3();return}
    Q=null;setPhaseUI(1);newGame();lastP=-1;lastB=-1;hud();
  }
  if(G.mode==='won'&&G.p2){beginP2();return}
  if(G.mode==='play'||G.mode==='intro')return;
  const fresh=G.mode==='title';
  if(!fresh)newGame();
  if(fresh){G.mode='intro';G.it=0;G.ix=530;G.sx=1;G.ib=0;G.ir=false;G.pl.x=-60}
  else{G.mode='play';G.boss.wait=1.2}
  el.ov.hidden=true;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  ensureAudio();
  say(fresh?_('The Watcher takes his post on the bridge. The Colossus arrives.','Le Veilleur prend position sur le pont. Le Colosse arrive.'):_('Fight started.','Combat lancé.'));
}
function introStep(dt){
  G.it+=dt;const T=G.it,p=G.pl;
  if(!G.i0){G.i0=true;boom(1.6,.1);whoosh(1.2,.05,true)}
  if(T<2.2){const h=Math.floor(T*7.5/Math.PI);if(h!==G.ih){G.ih=h;footfall(false)}}
  if(T<1.9){const b=Math.floor(T/.42);if(b!==G.ibf){G.ibf=b;footfall(true);G.shake=reduce?0:Math.max(G.shake,3)}}
  /* le Veilleur arrive par la gauche et prend position ; le Colosse arrive par la droite */
  p.x=T<2.2?-60+(PX+60)*es(T/2.2):PX;
  G.ix=T<1.8?530*(1-eo(T/1.8)):0;
  G.sx=1;
  G.ib=T<2.2?Math.abs(Math.sin(T*7.5))*4*(1-es(clamp01((T-1.7)/.5))):0;
  if(T<2.2&&Math.random()<.25)G.sparks.push({x:p.x-14,y:DECK-2,vx:rand(-50,-10),vy:-rand(10,40),g:200,life:.35,max:.35,col:'#9a8a9e',sz:rand(2,3)});
  if(T<1.8&&Math.random()<.5)G.sparks.push({x:BX+G.ix+rand(-20,60),y:DECK-2,vx:rand(20,110),vy:-rand(10,70),g:200,life:.5,max:.5,col:'#9a8a9e',sz:rand(3,6)});
  if(T>=2.2&&!G.is){G.is=true;dust(PX,DECK);tone(200,.3,'sine',.06,-100);tone(660,.5,'sine',.04,200)}
  if(T>=3.0&&!G.ir){G.ir=true;G.shake=reduce?0:10;G.flash=.3;tone(70,.9,'sawtooth',.09,60);float(_('RAAAH!','RAAAH !'),BX-90,DECK-300,'#ffb347');roar();boom(.8,.14)}
  if(T>=4.0){G.mode='play';G.boss.wait=1.2;G.ix=0;G.sx=1;G.ib=0;say(_('Fight started.','Combat lancé.'))}
}
function press(){
  if(paused)return;
  if(R){rPress();return}
  if(Q){qPress();return}
  if(!G)return;
  if(G.mode==='title'){start();return}
  if(G.mode!=='play')return;
  ensureAudio();
  if(LB.hero.press(G.pl,'block'))tone(520,.14,'triangle',.05,320)
}
/* Carte de défaite (o : carte à montrer). Épreuve : tout reprendre. Facile : à la 3e défaite sans aide, la carte propose
   d'activer l'aide visuelle (LB.help, décision n° 3 du 28 octobre). */
function deathCard(o){
  if(RUN.on){o.go=_('Start over from Phase I','Reprendre à la phase I');o.desc+=_(' In the trial, one death sends you back to the very beginning, at full health.'," Dans l'épreuve, une mort te renvoie au tout début, en pleine forme.");return o}
  if(LB.help.defeat(DIFF.easy)){o.desc+=LB.tx(CHAPTER.help.offer);o.go2=LB.helpOffer();o.onGo2=()=>{LB.help.enable();start()}}
  return o;
}
function showEnd(){
  const win=G.mode==='won';
  const o={onGo:start,eye:win?(G.p2?_('Transition','Transition'):_('Phase I cleared','Phase I terminée')):_('Defeat','Défaite'),
  title:win?(G.p2?_('Phase I cleared','Phase I terminée'):_('Phase I cleared','Phase I terminée')):_('Crushed on the stone.','Écrasé sur la pierre.'),
  stats:_('Blocks ','Blocages ')+G.blocks+_(' · Hits taken ',' · Coups subis ')+G.grabs+trStr(1),
  desc:win?(G.p2?_('The Colossus smashes the bridge and dives through the breach into the foundry beneath the arch, as if he knew the way.',"Le Colosse fracasse le pont et plonge par la brèche dans la fonderie cachée sous l'arche, comme s'il en connaissait le chemin."):_(`Phase II will open with its upcoming attacks.`,`La phase II s'ouvrira avec ses prochaines attaques.`)):_(`The lantern rolls across the stones of the bridge and goes out. Nothing holds the Colossus back now: the road to the valleys lies open.`,`La lanterne roule sur les pierres du pont et s'éteint. Plus rien ne retient le Colosse : la route des vallées est ouverte.`),
  go:win?(G.p2?_('Start Phase II','Lancer la phase II'):_('Replay Phase I','Rejouer la phase I')):_('Retry','Réessayer')};
  LB.card.show(win?o:deathCard(o));
}

const ONO={};

  add('SKRAAT',['CLAWED!','GRIFFÉ !']);
  add('CLANG',['DISARMED!','DÉSARMÉ !']);
  add('THUNK',['STUCK!','PLANTÉ !']);
  add('KRAKOOM',['FINAL BLOW!','COUP ULTIME !']);
  add('CRAAAC',['WING SHATTERED!','AILE BRISÉE !']);
  add('GRAAAH!',['GRAAAH!']);add('GRAAAH !',['GRAAAH !']);add('RAAAH!',['RAAAH!']);add('RAAAH !',['RAAAH !']);
  add('PHASE II',['PHASE II']);add('PHASE III',['PHASE III']);
  ['BAM','FWOOOSH','KRAAAK','BOOM','CHAK','SKRAAT','CLANG','THUNK','CRAAAC','KRAKOOM'].forEach(k=>{ONO[k]=k});
})();
function ono(t){return ONO[t]||null}
/* Taille des onomatopées : plus le coup est lourd, plus le mot est gros. */
const ONOSZ={BAM:44,FWOOOSH:46,KRAAAK:48,BOOM:52,CHAK:42,SKRAAT:46,CLANG:44,THUNK:42,CRAAAC:52,KRAKOOM:68};
/* Son d'impact : un coup sourd grave et un claquement de bruit ; p = puissance (0,3 léger, 1 lourd, 1,5 coup fatal). */
function thud(p){boom(.2+.12*p,.1+.05*p);noise(.09+.05*p,.14+.07*p,2400,240)}
/* Cris du Colosse quand il est touché : six voix différentes (texte et son), choisies selon la force du coup et sa vie restante, sans jamais répéter deux fois la même. */
const CRIES=[
  {t:['GRAAAH!','GRAAAH !'],f:95,s0:1.3,up:1.5,pk:.12,dn:.5,d:.95,v:.16,fa:900,fb:900,fc:220,q:1,vr:38,vd:30,r:.3},
  {t:['RAAAH!','RAAAH !'],f:150,s0:1,up:1.9,pk:.2,dn:.55,d:.8,v:.14,bp:1,fa:1100,fb:1600,fc:500,q:2.2,vr:9,vd:20,r:.5},
  {t:['HRRNGH!','HRRNGH !'],f:80,s0:1.2,up:1.1,pk:.08,dn:.7,d:.32,v:.14,fa:700,fb:700,fc:300,q:1,vr:55,vd:18,r:.6},
  {t:['KHAAAA!','KHAAAA !'],f:210,s0:1,up:1.2,pk:.15,dn:.8,d:.7,v:.07,bp:1,fa:2400,fb:2400,fc:900,q:1.2,vr:20,vd:8,r:1.5},
  {t:['GWOOOAR!','GWOOOAR !'],f:62,s0:1.6,up:1.2,pk:.25,dn:.4,d:1.25,v:.18,fa:700,fb:700,fc:150,q:1,vr:6,vd:10,r:.2},
  {t:['AARRGH!','AARRGH !'],f:190,s0:.9,up:2.1,pk:.35,dn:.5,d:1,v:.13,bp:1,fa:1300,fb:2100,fc:450,q:2.5,vr:13,vd:45,r:.5}
];
CRIES.forEach(c=>c.t.forEach(s=>{ONO[s]=s}));
let LASTCRY=-1;
function cryVoice(c){
  const AC=LB.audio.ctx;if(!LB.audio.sound||!AC)return;
  if(AC.state!=='running')ensureAudio();
  try{
    const n=AC.currentTime,d=c.d,g=AC.createGain(),f=AC.createBiquadFilter(),lfo=AC.createOscillator(),lg=AC.createGain();
    f.type=c.bp?'bandpass':'lowpass';f.Q.value=c.q;
    f.frequency.setValueAtTime(c.fa,n);f.frequency.linearRampToValueAtTime(c.fb,n+d*c.pk);f.frequency.exponentialRampToValueAtTime(c.fc,n+d);
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(c.v,n+Math.min(.06,d*.15));g.gain.setValueAtTime(c.v,n+d*.3);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    lfo.frequency.setValueAtTime(c.vr,n);lg.gain.setValueAtTime(c.vd*.5,n);lg.gain.linearRampToValueAtTime(c.vd,n+d);lfo.connect(lg);
    [[1,'sawtooth'],[1.5,'square'],[.5,'sawtooth']].forEach(([m,ty])=>{
      const o=AC.createOscillator(),fr=c.f*m;o.type=ty;
      o.frequency.setValueAtTime(fr*c.s0,n);o.frequency.exponentialRampToValueAtTime(fr*c.up,n+d*c.pk);o.frequency.exponentialRampToValueAtTime(fr*c.dn,n+d);
      lg.connect(o.frequency);o.connect(f);o.start(n);o.stop(n+d);
    });
    lfo.start(n);lfo.stop(n+d);f.connect(g);g.connect(LB.audio.sfx);
  }catch(e){}
  if(c.r)noise(c.d*.7,c.v*c.r,2600,700);
}
/* Joue un cri et renvoie son texte. heavy : coup lourd ; hp : PV restants du Colosse (≤ 3 : cris plus déchirés). */
function hurtCry(heavy,hp){
  const pool=hp!=null&&hp<=3?[5,4,1,2]:heavy?[0,1,4,5]:[2,1,0,3];
  let i;do{i=pool[Math.floor(Math.random()*pool.length)]}while(i===LASTCRY);
  LASTCRY=i;cryVoice(CRIES[i]);
  return _(CRIES[i].t[0],CRIES[i].t[1]);
}
/* Cri de la foudre : deux voix superposées (un beuglement grave et un hurlement déchiré), très long, bien plus fort que les autres. */
const MEGA={t:['GRAAAAAAAH!','GRAAAAAAAH !'],
  a:{f:70,s0:1.8,up:2.3,pk:.3,dn:.35,d:2.2,v:.24,fa:900,fb:1500,fc:200,q:1.4,vr:8,vd:35,r:.5},
  b:{f:200,s0:.9,up:2.2,pk:.35,dn:.5,d:1.7,v:.11,bp:1,fa:1300,fb:2300,fc:450,q:2.5,vr:13,vd:50,r:.6}};
MEGA.t.forEach(s=>{ONO[s]=s});
function megaCry(){cryVoice(MEGA.a);cryVoice(MEGA.b);LASTCRY=-1;return _(MEGA.t[0],MEGA.t[1])}
/* Cri du Colosse en phase I : toujours à côté de sa tête, jamais sur le point d'impact. */
function cry1(heavy){float(hurtCry(heavy,G.bhp),HEAD[0]-70,HEAD[1]-50,heavy?'#ffc15a':'#ffb347')}
function float(txt,x,y,col){txt=ono(txt);if(!txt)return;G.floats.push({txt,x,y,col,sz:ONOSZ[txt]||38,life:.9,max:.9})}

/* ---------- game logic ---------- */
function liftAmt(){
  if(G.pl.s==='final'){const t=G.pl.t;return 80*Math.sin(Math.PI*clamp01((t-2.9)/.7))-clamp01((t-3.3)/.5)*430}
  const b=G.boss;
  if(b.s==='lift')return b.t<.12?0:LIFT_MAX*eo(clamp01((b.t-.12)/.43));
  if(b.s==='hold')return LIFT_MAX;
  if(b.s==='slam')return LIFT_MAX*(1-ei(clamp01(b.t/.16)));
  return 0;
}
/* Le bouclier est levé (ou vient juste de retomber : grâce du geste, LB.HERO_T.block). */
function blocked(){return LB.hero.stops(G.pl)}
function resolveStrike(){
  const p=G.pl,b=G.boss;
  const warded=blocked();
  if(warded&&b.dbl){ /* chaîne double : premier coup bloqué, le second arrive 0,5 s plus tard */
    b.dbl=false;b.sk=.32;
    blockSuccess(BAR[0],BAR[1]);
    b.s='rewind';b.t=0;
    say(_('First hit blocked.','Premier coup bloqué.'));
    return;
  }
  b.dbl=false;b.sk=0;
  if(warded){
    LB.hero.stopped(p); /* une attaque bloquée renvoie à ready, comme partout (décision du 28 octobre) */
    if(b.combo)startComboFlame('head');else{b.s='rebound';b.t=0}
    G.blocks++;G.hitstop=.08;G.flash=.35;G.shake=Math.max(G.shake,reduce?0:5);thud(.4);
    ring(BAR[0],BAR[1]);
    burst(BAR[0],BAR[1],26,['#bfeaff','#6fd3ff','#ffffff']);
    float('CLANG',BAR[0]-30,BAR[1]-110,'#bfeaff');
    tone(880,.28,'square',.05,-260);tone(1400,.2,'sine',.04);
    say(_('Block successful.','Blocage réussi.'));
  }else{
    b.s='lift';b.t=0;p.s='grabbed';p.t=0;
    float(_('HOOKED!','ACCROCHÉ !'),PX,DECK-190,'#ff8a6b');
    tone(150,.2,'sawtooth',.06,-80);
    say(_('Caught by the hook.','Accroché par le crochet.'));
  }
}
function headHit(){
  const b=G.boss;
  G.bhp=Math.max(0,G.bhp-DMG_BLOCK);G.recoil=1;G.shake=reduce?0:13;G.hitstop=.11;G.flash=.4;thud(1.2);ring(HEAD[0],HEAD[1]);
  burst(HEAD[0],HEAD[1],22,['#ffffff','#ffc15a','#ff7a2b']);
  tone(170,.25,'square',.08,-110);
  if(G.bhp<=0){b.s='dead';b.t=0;G.mode='won';G.endIn=1.4;say(_('Phase I cleared.','Phase I terminée.'))}
  else{b.s='stagger';b.t=0;b.stagT=0}
}
function slamHit(){
  const b=G.boss,p=G.pl;
  G.php=Math.max(0,G.php-DMG_GRAB);G.grabs++;G.shake=reduce?0:15;G.hurt=.35;G.hitstop=.1;thud(1.3);
  dust(PX,DECK);tone(80,.35,'sine',.14,-40);burst(PX+10,DECK-60,24,['#ffc15a','#ff7a2b','#ffffff']);float(_('BOOM!','BOUM !'),PX,DECK-190,'#ff8a6b');
  p.s='down';p.t=0;p.downT=.9;b.s='release';b.t=0;
  if(G.php<=0){G.mode='lost';G.endIn=1.1;say(_('You are down. Defeat.','Tu es à terre. Défaite.'))}
}
function startAttack(){
  const b=G.boss,a=G.atk;
  if(DIFF.fury[G.bhp]){startFury(DIFF.fury[G.bhp]);return}
  const kinds=['whip','sword','flame'];
  let k=a.last===''?'whip':kinds[Math.floor(Math.random()*3)];
  if(k===a.last&&a.n>=2){const o=kinds.filter(x=>x!==k);k=o[Math.floor(Math.random()*2)]}
  /* Difficile : un crochet ou un marteau peut être suivi de souffles sans respiration ; le contre n'arrive qu'après les avoir bloqués. */
  let combo=false;
  if(DIFF.hard&&k!=='flame'){
    const c=DIFF.chain.find(x=>G.bhp<=x[0]);

  const was=a.plain;

function bossStep(dt){
  const b=G.boss;b.t+=dt;
  switch(b.s){
    case 'idle':if(G.mode==='play'&&b.t>=b.wait)startAttack();break;
    case 'windup':if(b.t>=T.windup){b.s='strike';b.t=0;tone(260,.14,'sawtooth',.06,-160)}break;
    case 'rewind':if(b.t>=.18){b.s='strike';b.t=0;tone(260,.14,'sawtooth',.06,-160)}break;
    case 'strike':if(b.t>=(b.sk||T.strike))resolveStrike();break;
    case 'rebound':if(b.t>=T.rebound)headHit();break;
    case 'stagger':if(b.t>=(b.stagT||T.stagger))toIdle();break;
    case 'lift':if(b.t>=.55){b.s='hold';b.t=0}break;
    case 'hold':if(b.t>=.22){b.s='slam';b.t=0}break;
    case 'slam':if(b.t>=.16)slamHit();break;
    case 'release':if(b.t>=.6)toIdle();break;
    case 'sw1w':if(b.t>=T.sw1w){b.s='sw1';b.t=0;tone(300,.12,'sawtooth',.06,-180)}break;
    case 'sw1':if(b.t>=T.sw1)resolveSword(1);break;
    case 'swgap':if(b.t>=T.swgap){b.s='sw2w';b.t=0}break;
    case 'sw2w':if(b.t>=T.sw2w){b.s='sw2';b.t=0;tone(240,.14,'sawtooth',.06,-160)}break;
    case 'sw2':if(b.t>=T.sw2)resolveSword(2);break;
    case 'sw3g':if(b.t>=T.sw3g){b.s='sw3w';b.t=0}break;
    case 'sw3w':if(b.t>=T.sw3w){b.s='sw3';b.t=0;tone(300,.12,'sawtooth',.06,-180)}break;
    case 'sw3':if(b.t>=T.sw3)resolveSword(3);break;
    case 'swrec':if(b.t>=T.swrec)toIdle();break;
    case 'orb':if(b.t>=T.cast+T.orb)orbHit();break;
    case 'fl_in':if(b.t>=(b.fli||T.fli)){b.s='fl_out';b.t=0;tone(200,.25,'sawtooth',.07,-120)}break;
    case 'fl_out':if(b.t>=T.flo){if(b.fyb)resolveFuryBreath();else resolveFlame()}break;
    case 'fl_rec':if(b.t>=T.flrec)toIdle();break;
    case 'fl_stab':if(b.t>=T.dash+.1)legHit();break;
    case 'hurt':if(b.t>=b.hurtT)toIdle();break;
    case 'fy_roar':if(b.t>=1.0)fyEnter(G.fy.seq[0]);break;
    case 'fy_t':if(b.t>=T.fyt){b.s='fy_j';b.t=0;tone(220,.15,'sawtooth',.06,-120)}break;
    case 'fy_j':if(b.t>=.3)resolveJet();break;
    case 'fy_gap':if(b.t>=T.fyg){b.s='fy_t';b.t=0}break;
    case 'rk_t':if(b.t>=.5){b.s='rk_j';b.t=0;tone(150,.5,'sawtooth',.05,-80)}break;
    case 'rk_j':if(b.t>=.55)resolveRock();break;
    case 'fy_cast':if(b.t>=T.ringAt+.55)ringHit();break;
    case 'fy_fail':if(b.t>=.9)toIdle();break;
    case 'fin':{
      const F=G.fin;
      if(!F.a&&b.t>=.5){
        F.a=true;G.shake=reduce?0:8;G.flash=.35;
        dust(PX,DECK);burst(PX,DECK,24,['#ffffff','#fff2b8','#bfeaff']);
        tone(110,.5,'sine',.12,-50);tone(700,.6,'sine',.06,500);
      }
      if(!F.b&&b.t>=1.1){
        /* gros impact : le rayon explose sur le torse du Colosse, qui recule sous le choc */
        F.b=true;G.bhp=0;G.shake=reduce?0:26;G.flash=.95;
        const cx=BX-40,cy=DECK-200;
        burst(cx,cy,70,['#ffffff','#fff0b0','#ffd966','#ffc15a']);burst(cx+30,cy+40,40,['#ffffff','#fff2b8','#ffc15a','#ff7a2b']);burst(cx-10,cy-50,30,['#ffffff','#fff0b0']);
        boom(1.6,.28);tone(55,1.2,'sawtooth',.14,-20);tone(1200,.8,'sine',.06,-600);noise(.5,.2,5000,400);painCry(1.9,.2);
        float(_('BOOM!','BOUM !'),BX-160,DECK-320,'#ffffff');
      }
      if(!F.r&&b.t>=1.55){F.r=true;whoosh(.5,.08,true);painCry(.8,.1);say(_('Staggered, the Colossus raises his hammer.','Ébranlé, le Colosse lève son marteau.'))}
      if(!F.s&&b.t>=2.0){
        /* coup de marteau devant lui : le pont éclate et s'ouvre */
        F.s=true;G.shake=reduce?0:22;G.flash=.35;anvil();boom(1.1,.22);
        burst(HOLE_X,DECK,50,['#ffc15a','#ff7a2b','#9a8a9e','#ffffff']);forgeSparks(G,HOLE_X,DECK-6,44);dust(HOLE_X-60,DECK);dust(HOLE_X+60,DECK);
      }
      if(!F.j&&b.t>=2.25){F.j=true;whoosh(.6,.1,false);say(_(`The Colossus dives through the breach into the Foundry. The Watcher leaps after him.`,`Le Colosse plonge par la brèche dans la Fonderie. Le Veilleur saute à sa poursuite.`))}
      if(!F.c&&b.t>=2.75){F.c=true;boom(.8,.12)}
      break;}
  }
}
let lastP=-1,lastB=-1,tries=[0,0,0,0],cntS=null;
function trStr(ph){const n=RUN.on?RUN.n:(tries[ph]||1);return ' · '+(n>1?_('Attempts ','Essais '):_('Attempt ','Essai '))+n}
function hud(){
  const S=R||Q||G;
  if(S!==cntS&&S.mode==='play'){cntS=S;tries[R?3:Q?2:1]++}
  if(S.php!==lastP){LB.hud.player(S.php,DIFF.hp);lastP=S.php}
  const bmax=S===R?DIFF.rbhp:DIFF.bhp,bk=S===G?1:S===R?3:2;
  if(S.bhp!==lastB||S.mkBox!==bk){S.mkBox=bk;LB.hud.boss(S.bhp,bmax,LB.hud.marks(rageHp(DIFF,bk)));lastB=S.bhp}   /* repères : rages calculées (rageHp) et dernier PV */
}
function step(dt){
  G.time+=dt;
  for(const e of G.embers){e.y-=e.v*dt;e.x+=Math.sin(G.time*.8+e.ph)*8*dt;if(e.y<-10){e.y=H+10;e.x=rand(0,W)}}
  for(let i=G.sparks.length-1;i>=0;i--){const s=G.sparks[i];s.life-=dt;if(s.life<=0){G.sparks.splice(i,1);continue}s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt}
  for(let i=G.rings.length-1;i>=0;i--){G.rings[i].life-=dt;if(G.rings[i].life<=0)G.rings.splice(i,1)}
  for(let i=G.floats.length-1;i>=0;i--){G.floats[i].life-=dt;if(G.floats[i].life<=0)G.floats.splice(i,1)}
  G.shake=Math.max(0,G.shake-dt*45);G.flash=Math.max(0,G.flash-dt*2.2);G.hurt=Math.max(0,G.hurt-dt*1.6);G.recoil=Math.max(0,G.recoil-dt*3.5);G.kick=Math.max(0,G.kick-dt*5);G.wound=Math.max(0,G.wound-dt*.5);
  if(G.endIn>0){G.endIn-=dt;if(G.endIn<=0){if(G.mode==='won'&&G.p2&&RUN.on)beginP2(true);else showEnd()}}
  if(G.hitstop>0){G.hitstop-=dt;return}
  const p=G.pl;LB.hero.step(p,dt,{gesture:'block'}); /* ready / action / récupération / coup reçu : LB.hero ; le reste (prise, riposte, coup de lanterne) est animation */
  if(p.s==='down'&&G.mode==='play'&&p.t>=(p.downT||.9)){p.s='ready';p.t=0}
  else if(p.s==='cast'&&p.t>=T.cast+T.orb){p.s='ready';p.t=0}
  else if(p.s==='dash'&&p.t>=T.dash){p.s='stab';p.t=0}
  else if(p.s==='stab'&&p.t>=.3){p.s='back';p.t=0}
  else if(p.s==='back'&&p.t>=T.back){p.s='ready';p.t=0}
  else if(p.s==='ring'&&p.t>=T.ringAt+.55){p.s='ready';p.t=0}
  if(p.s==='dash')p.x=PX+(STAB_X-PX)*eo(clamp01(p.t/T.dash));
  else if(p.s==='stab')p.x=STAB_X;
  else if(p.s==='back')p.x=STAB_X-(STAB_X-PX)*es(clamp01(p.t/T.back));
  else if(p.s==='final')p.x=p.t<2.9?PX:PX+(HOLE_X-PX)*es(clamp01((p.t-2.9)/.6));
  else p.x=PX;
  if(p.s==='dash')G.sparks.push({x:p.x,y:DECK-3,vx:rand(-60,-10),vy:-rand(10,60),g:200,life:.4,max:.4,col:'#9a8a9e',sz:rand(2,4)});
  if(p.s==='ring'&&!p.fired&&p.t>=T.ringAt){
    p.fired=true;G.ringFx={t:0};G.shake=reduce?0:9;G.flash=.3;dust(PX,DECK);
    tone(120,.4,'sine',.12,-60);tone(800,.5,'sine',.05,400);
  }
  if(G.ringFx){G.ringFx.t+=dt;if(G.ringFx.t>.8)G.ringFx=null}
  if(G.jf){G.jf.t-=dt;if(G.jf.t<=0)G.jf=null}
  if(G.mode==='intro')introStep(dt);
  bossStep(dt);
  hud();

function pose(){
  const b=G.boss,t=b.t,sw=Math.sin(G.time*3);
  let hand,tip,sag=40,heat=.25;
  switch(b.s){
    case 'idle':
      hand=[IDLE_HAND[0],IDLE_HAND[1]+sw*3];tip=[hand[0]-34+sw*9,hand[1]+104];sag=46;break;
    case 'windup':{
      const k=eo(clamp01(t/.35));
      hand=lerp2(IDLE_HAND,UP_HAND,k);hand[0]+=Math.sin(G.time*55)*1.6*(t/T.windup);
      const rest=[hand[0]-34,hand[1]+104];
      tip=lerp2(rest,TIP_BACK,k);tip[0]+=Math.sin(G.time*8)*5;
      sag=48;heat=.3+.7*(t/T.windup);break;}
    case 'strike':{
      const p=clamp01(t/(b.sk||T.strike));
      hand=lerp2(UP_HAND,FWD_HAND,eo(clamp01(t/.14)));
      tip=lerp2(TIP_BACK,BAR,ei(p));tip[1]-=140*Math.sin(Math.PI*p)*(1-.55*p);
      sag=-80*(1-p)+8;heat=1;break;}
    case 'rewind':{
      const k=eo(clamp01(t/.18));
      hand=lerp2(FWD_HAND,UP_HAND,k);tip=lerp2(BAR,TIP_BACK,k);tip[1]-=60*Math.sin(Math.PI*k);
      sag=-30;heat=1;break;}
    case 'rebound':{
      hand=FWD_HAND;
      const e=es(clamp01(t/T.rebound));
      tip=lerp2(BAR,HEAD,e);tip[1]-=100*Math.sin(Math.PI*e);
      sag=-40;heat=1;break;}
    case 'stagger':{
      const k=eo(clamp01(t/.5));
      hand=lerp2(FWD_HAND,IDLE_HAND,k);
      tip=lerp2(HEAD,[hand[0]-24,hand[1]+110],eo(clamp01(t/.45)));
      sag=50;break;}
    case 'lift':{
      hand=lerp2(FWD_HAND,[BX-150,206],eo(clamp01(t/.55)));
      const cur=[CHEST[0],CHEST[1]-liftAmt()];
      tip=lerp2(BAR,cur,clamp01(t/.12));sag=14;heat=1;break;}
    case 'hold':
      hand=[BX-150,206+Math.sin(G.time*34)*2];tip=[CHEST[0],CHEST[1]-LIFT_MAX];sag=10;heat=1;break;
    case 'slam':
      hand=lerp2([BX-150,206],[BX-140,300],ei(clamp01(t/.16)));
      tip=[CHEST[0],CHEST[1]-liftAmt()];sag=10;heat=1;break;
    case 'release':{
      const k=eo(clamp01(t/.6));
      hand=lerp2([BX-140,300],IDLE_HAND,k);
      tip=lerp2([CHEST[0],CHEST[1]+10],[hand[0]-34,hand[1]+104],k);sag=50;break;}
    case 'dead':
      hand=[BX-120,342];tip=[hand[0]-70,DECK-6];sag=24;break;
    default:
      hand=[IDLE_HAND[0],IDLE_HAND[1]+sw*3];tip=[hand[0]-34+sw*9,hand[1]+104];sag=46;
  }
  return {hand,tip,sag,heat};
}

function swordPose(){

  const A0=-Math.PI+.18;
  let hand=[IDLE2[0],IDLE2[1]],a=A0,len=0,heat=0;
  switch(b.s){

      len=SW_LEN*eo(clamp01(t/.5));heat=.3+.7*(t/T.sw1w);break;}
    case 'sw1':{
      const e=es(clamp01(t/T.sw1));
      hand=lerp2(SW1_BACK,SW1_HIT,e);a=-Math.PI+.18*(1-e);len=SW_LEN;heat=1;break;}
    case 'swgap':{
      const k=eo(clamp01(t/T.swgap));
      hand=lerp2(SW1_HIT,SW2_UP,k);a=-Math.PI+(Math.PI-1.2)*k;len=SW_LEN;heat=1;

    case 'sw2w':

    case 'sw2':{

    case 'sw3g':{
      const k=eo(clamp01(t/T.sw3g));

      if(!G.sw.p2){hand[0]-=60*Math.sin(Math.PI*clamp01(t/.24))}
      hand[0]+=G.kick*30;break;}
    case 'sw3w':
      hand=[SW1_BACK[0],SW1_BACK[1]+Math.sin(tm*50)*1.5];a=-Math.PI+.18;len=SW_LEN;heat=1;break;
    case 'sw3':{
      const e=es(clamp01(t/T.sw3));
      hand=lerp2(SW1_BACK,SW1_HIT,e);a=-Math.PI+.18*(1-e);len=SW_LEN;heat=1;break;}
    case 'swrec':{
      const k=eo(clamp01(t/T.swrec));
      hand=lerp2(DIFF.hard?SW1_HIT:SW2_HIT,IDLE2,k);a=-3.62+.66*k;len=SW_LEN*(1-clamp01(t/.5));heat=.8;
      if(!(DIFF.hard?G.sw.p3:G.sw.p2)){const q=Math.sin(Math.PI*clamp01(t/.24));hand[0]-=60*q;hand[1]+=60*q}

      else{hand=DN;a=-4.71;len=SW_LEN;heat=1.2}

function drawArm(S,H,Lmin,out){
  const dx=H[0]-S[0],dy=H[1]-S[1],d=Math.max(1,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),L=Math.max(Lmin,d*.56);

/* Chaîne de forge à crochet : maillons de fer le long d'une suite de points, crochet de levage au bout */
function drawHookChain(pts,heat){
  const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1];if(tot<2)return;
  const at=d=>{let i=1;while(i<L.length-1&&L[i]<d)i++;const u=(d-L[i-1])/Math.max(.001,L[i]-L[i-1]);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*u,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*u,Math.atan2(pts[i][1]-pts[i-1][1],pts[i][0]-pts[i-1][0])]};
  ctx.save();ctx.lineCap='round';
  if(heat>0){ctx.strokeStyle='rgba(255,140,60,'+(.35*Math.min(1,heat))+')';ctx.lineWidth=12;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
  let k=0;
  for(let d=4;d<tot-14;d+=11,k++){
    const [x,y,a]=at(d);ctx.save();ctx.translate(x,y);ctx.rotate(a);
    if(k%2===0){ctx.strokeStyle='#241b2a';ctx.lineWidth=4.5;ctx.beginPath();ctx.ellipse(0,0,8,4.5,0,0,6.283);ctx.stroke();ctx.strokeStyle='#7a6a82';ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(0,0,8,4.5,0,0,6.283);ctx.stroke()}
    else{ctx.strokeStyle='#241b2a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke();ctx.strokeStyle='#8a7a92';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-6,-1);ctx.lineTo(6,-1);ctx.stroke()}
    ctx.restore();
  }
  const [hx,hy,ha]=at(tot);
  ctx.save();ctx.translate(hx,hy);ctx.rotate(ha);
  ctx.strokeStyle='#241b2a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(2,0);ctx.arc(2,9,9,-Math.PI/2,Math.PI*.95);ctx.stroke();
  ctx.strokeStyle='#9a8aa2';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-13,-1);ctx.lineTo(2,-1);ctx.arc(2,9,8,-Math.PI/2,Math.PI*.95);ctx.stroke();
  ctx.fillStyle='#241b2a';ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(-3,3);ctx.lineTo(-2,11);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#241b2a';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(-16,0,5,3.5,0,0,6.283);ctx.stroke();
  if(heat>.5){ctx.strokeStyle='rgba(255,170,80,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(2,9,6,0,Math.PI*.8);ctx.stroke()}
  ctx.restore();
  ctx.restore();
}
function drawWhip(h,tp,sag,heat){
  const c=[(h[0]+tp[0])/2,(h[1]+tp[1])/2+sag],pts=[];
  for(let i=0;i<=20;i++){const u=i/20,m=1-u;pts.push([m*m*h[0]+2*m*u*c[0]+u*u*tp[0],m*m*h[1]+2*m*u*c[1]+u*u*tp[1]])}
  drawHookChain(pts,heat);
}

/* Chaîne du Colosse : « hk » va de 0 (elle est enroulée sur son torse) à 1 (déroulée dans sa main) ; le même nombre règle les maillons du torse et la longueur dans la main */
function hookStep(o,target,t){
  const dt=Math.min(.05,Math.max(0,t-(o.hl==null?t:o.hl)));o.hl=t;
  const cur=o.hv||0,sp=(target>cur?1/.45:1/.4)*dt;
  o.hv=Math.abs(target-cur)<=sp?target:cur+Math.sign(target-cur)*sp;
  return o.hv;
}

  drawSwordArm(dx,dy);
}

/* Repère d'aide commun (LB.cue, shared/js/28-ui.js) : barre au-dessus du Veilleur en Normal et en Difficile (orange tant que le
   blocage n'est pas ouvert, bleue pendant la fenêtre), cercle qui se resserre en Facile. Approche affichée : LB.CUE_T.lead. */
function drawHints(){
  if(G.mode!=='play'||!LB.help.on())return;
  const b=G.boss,p=G.pl;
  /* repère de timing : barre au-dessus de la tête, ou en Facile un cercle qui se resserre autour du Veilleur (bleu = fenêtre de blocage) */
  const cue=(k,blue)=>{
    if(DIFF.easy){LB.cue.ring(ctx,PX+10,DECK-100,blue?40+22*clamp01(k):110-48*clamp01(k),blue);return}
    LB.cue.bar(ctx,PX,DECK-206,k,blue);
  };
  if(['sw1w','sw1','swgap','sw2w','sw2','sw3g','sw3w','sw3'].includes(b.s)){
    const hit=+b.s.charAt(2),wait=[T.sw1w,T.sw2w,T.sw3w][hit-1],strike=[T.sw1,T.sw2,T.sw3][hit-1];
    if(b.s!=='swgap'&&b.s!=='sw3g'){
      const tl=wait+strike;
      const ela=b.s.endsWith('w')?b.t:wait+b.t;
      const rem=Math.max(0,tl-ela),inWin=rem<=HD('block').act;
      const k=inWin?rem/HD('block').act:ela/(tl-HD('block').act);
      cue(k,inWin);
    }
    const nsw=DIFF.hard?3:2;
    for(let i=0;i<nsw;i++){
      const ok=[G.sw.p1,G.sw.p2,G.sw.p3][i],x=PX+(i-(nsw-1)/2)*18,y=DECK-220;

    const rem=Math.max(0,tl-ela),inWin=rem<=T.flwin;
    const k=inWin?rem/T.flwin:ela/(tl-T.flwin);
    cue(k,inWin);
  }
  if(G.fy&&(['fy_roar','fy_t','fy_j','fy_gap','rk_t','rk_j'].includes(b.s)||b.fyb)){
    const F=G.fy,n=F.seq.length;
    if(b.s==='fy_t'||b.s==='fy_j'||b.s==='rk_t'||b.s==='rk_j'){
      const rk=b.s==='rk_t'||b.s==='rk_j',t1=rk?.5:T.fyt,tl=t1+(rk?.55:.3);
      const ela=(b.s==='fy_t'||b.s==='rk_t')?b.t:t1+b.t;
      const rem=Math.max(0,tl-ela),inWin=rem<=HD('block').act;
      const k=inWin?rem/HD('block').act:ela/(tl-HD('block').act);
      cue(k,inWin);

    for(let i=0;i<n;i++){
      const x=PX+(i-(n-1)/2)*18,y=DECK-220;

      if(i<F.i&&F.ok[i]){ctx.fillStyle='#6fd3ff';ctx.fill()}
      else if(i<F.i){ctx.fillStyle='#ff5252';ctx.fill()}
      else{ctx.strokeStyle='rgba(240,232,223,.6)';ctx.lineWidth=2;ctx.stroke()}
    }
  }
  if(b.s==='windup'||b.s==='strike'){
    const k=b.s==='windup'?b.t/T.windup:1-b.t/(b.sk||T.strike);
    const col=b.s==='windup'?'rgba(255,122,43,.85)':'#6fd3ff';
    cue(k,b.s==='strike');

}

function qHurt(k){

function qAtkStep(dt){
  const a=Q.atk;a.t+=dt;

function qAtkEnd(){

    if(!ok)Q.chainMiss=true;

function qCounter(k){

function qFinal(){

function qCnStep(dt){

    qBurst(chest[0],chest[1],44,['#ffffff','#fff2b8','#bfeaff']);

function qBoss(dt){
  const b=Q.boss;b.t+=dt;

    case 'atk':qAtkStep(dt);break;
    case 'gap':if(b.t>=.55)qChainNext();break;
    case 'cn':qCnStep(dt);break;

function qChainNext(){const k=Q.chain.shift();Q.last=k;qLaunch(k)}
/* lakeY : ancien niveau du lac qui montait pendant la chute ; garde l'horloge de la fin (le Colosse touche la lave au même instant qu'avant). lt : instant (Q.lt par défaut). */
function lakeY(lt){return H+80-(H+80-340)*ei(clamp01(((lt==null?Q.lt:lt)-.4)/1.8))}
/* descente du Colosse vers la lave pendant la fin (dessin seulement), figée au plongeon */
function qDive(){return Q.mode==='lake'?Math.max(0,QLAKE-lakeY(Q.splash||Q.lt)):0}
function qLayout(){
  const t=Q.t;

  if(Q.mode==='intro'){
    const eb=1-eo(clamp01(t/2.0)),eh=1-eo(clamp01((t-.2)/1.9));
    bx+=90*eb;by-=560*eb;hx-=60*eh;hy-=620*eh;
  }
  by+=Math.sin(Q.time*2)*7; /* le Colosse vole ; le Veilleur se tient sur son bloc */
  bx+=Q.recoil*20;

function qEnd(){
  const win=Q.mode==='lake';

  const o={onGo:start,eye:win?_('Transition','Transition'):_('Defeat · Phase II','Défaite · Phase II'),

  go:win?_('Start Phase III','Lancer la phase III'):_('Retry Phase II','Réessayer la phase II')};

function qStep(dt){
  Q.time+=dt;Q.t+=dt;
  for(const s of Q.streaks){s.y-=s.v*dt*(Q.speed/320);if(s.y<-80){s.y=H+rand(0,80);s.x=rand(0,W)}}
  for(const d of Q.debris){d.y-=d.v*dt*(Q.speed/320);d.a+=d.w*dt;if(d.y<-60){d.y=H+rand(20,120);d.x=rand(60,W-60)}}
  Q.scroll+=Q.speed*dt;
  for(let i=Q.sparks.length-1;i>=0;i--){const s=Q.sparks[i];s.life-=dt;if(s.life<=0){Q.sparks.splice(i,1);continue}s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt}
  for(let i=Q.rings.length-1;i>=0;i--){Q.rings[i].life-=dt;if(Q.rings[i].life<=0)Q.rings.splice(i,1)}
  for(let i=Q.floats.length-1;i>=0;i--){Q.floats[i].life-=dt;if(Q.floats[i].life<=0)Q.floats.splice(i,1)}
  for(let i=Q.exps.length-1;i>=0;i--){Q.exps[i].t+=dt;if(Q.exps[i].t>.9)Q.exps.splice(i,1)}
  for(let i=Q.fbs.length-1;i>=0;i--){Q.fbs[i].t+=dt;if(Q.fbs[i].t>.7)Q.fbs.splice(i,1)}
  Q.shake=Math.max(0,Q.shake-dt*45);Q.flash=Math.max(0,Q.flash-dt*2.2);Q.hurt=Math.max(0,Q.hurt-dt*1.6);Q.recoil=Math.max(0,Q.recoil-dt*3.5);
  if(Q.endIn>0){Q.endIn-=dt;if(Q.endIn<=0)qEnd()}
  qLayout();
  if(Q.hitstop>0){Q.hitstop-=dt;hud();return}
  const p=Q.pl;LB.hero.step(p,dt,{gesture:'dodge'});
  if(Q.mode==='intro'){
    Q.speed=320+580*(1-clamp01(Q.t/2.6));
    Q.wo=es(clamp01((Q.t-1.0)/1.0));
    /* battements d'ailes : un souffle grave + un claquement sourd, de plus en plus lents */
    const FL=[.9,1.25,1.7,2.25];while(Q.fn<FL.length&&Q.t>=FL[Q.fn]){noise(.4,.24,700,140);boom(.3,.08);Q.fn++}
    if(!Q.wing&&Q.t>=1.35){Q.wing=true;Q.shake=reduce?0:12;Q.flash=.35;tone(90,.7,'sawtooth',.09,60);qFloat(_('PHASE II','PHASE II'),W/2-110,120,'#ffc15a',54,1.8);qBurst(Q.bx+60,Q.by-60,30,['#ffc15a','#ff7a2b'])}
    if(Q.t>=2.7){Q.mode='play';Q.boss.wait=.6;Q.wo=1}
    hud();return;
  }
  if(Q.mode!=='lake'){Q.speed=320}
  if(Q.mode==='play')qBoss(dt);
  if(Q.mode==='lake'){
    Q.lt+=dt;
    Q.wo=1-.75*es(clamp01(Q.lt/1.0));
    if(!Q.splash&&lakeY()<=Q.by+150){
      Q.splash=Q.lt;
      qBurst(QB[0]-40,QLAKE,70,['#fff2b8','#ffc15a','#ff7a2b','#ffffff']);
      qRing(QB[0]-40,QLAKE);Q.flash=.6;Q.shake=reduce?0:18;
      tone(60,.9,'sine',.15,-30);tone(300,.5,'sawtooth',.04,-200);
    }
    if(Q.splash){
      const d=Q.lt-Q.splash;Q.speed=Math.max(0,Q.speed-900*dt);
      if(d<1.0)Q.dropY=d*240;
      else{
        /* ravivé par le métal en fusion, il jaillit du four, ailes déployées, et s'envole vers la cheminée */
        const e=d-1.0;Q.dropY=240-e*e*620-e*180;Q.wo=Math.min(1.25,.25+e*3);
        if(!Q.erupt){Q.erupt=true;Q.flash=.7;Q.shake=reduce?0:22;roar();boom(1.2,.2);qBurst(QB[0]-20,QLAKE,80,['#fff2b8','#ffc15a','#ff7a2b','#ffffff']);qRing(QB[0]-20,QLAKE);forgeSparks(Q,QB[0]-20,QLAKE,50);
          say(_('The Colossus bursts from the furnace, wings spread!','Le Colosse jaillit du four, ailes déployées !'))}
        if(Math.random()<.6)Q.sparks.push({x:Q.bx+rand(-60,60),y:Q.by+rand(20,120),vx:rand(-40,40),vy:rand(60,200),g:300,life:.6,max:.6,col:Math.random()<.5?'#ffc15a':'#ff7a2b',sz:rand(3,6)});
      }
    }
    else Q.speed=320+600*clamp01(Q.lt/1.4);
    if(!Q.ended&&Q.splash&&Q.lt-Q.splash>2.8){Q.ended=true;qEnd()}
  }
  hud();
}

/* ---------- rendu phase II ---------- */
function qp(pts,fill,stroke,lw){
  ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.lineJoin='round';ctx.stroke()}
}
function qlimb(a,b,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function qflame(x,y,w,h,ph,col){
  const t=R?R.time:Q?Q.time:G.time;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w,y);
  ctx.quadraticCurveTo(x+Math.sin(t*8+ph)*w*.6-w*.2,y-h*.55,x+Math.sin(t*6+ph)*w*.5,y-h);
  ctx.quadraticCurveTo(x+Math.sin(t*7+ph)*w*.4+w*.2,y-h*.5,x+w,y);ctx.closePath();ctx.fill();
}
/* Phase II : le fond de la Fonderie, sous le pont (1er novembre : plus de chute, le décor ne défile plus). */
function qScrollY(base,period){return (base%period+period)%period-60}
function qGear(x,y,r,a,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=col;
  for(let i=0;i<10;i++){ctx.rotate(.628);ctx.fillRect(-r*.14,-r-8,r*.28,14)}
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.arc(0,0,r*.45,0,6.283,true);ctx.fill();
  ctx.restore();
}
function qBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0607');g.addColorStop(.55,'#1d0d0a');g.addColorStop(1,'#5a1a08');

  ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='rgba(255,230,160,.9)';ctx.lineWidth=2;ctx.stroke();
  }

      for(let i=0;i<4;i++)ctx.fillRect(x0+22+i*((w-44)/4),y+33,(w-44)/4-4,14);

/* hotte du grand four, au-dessus du lac : la cheminée par où le Colosse s'envole à la fin */

function qrock(x,y,r,rot,hot){

function wingAngle(){
  let ang=Math.sin(Q.time*2.3)*.07;

    const ws=a.hits.filter(h=>h.k==='wave'),last=ws[ws.length-1].at;
    const raise=clamp01(a.t/.5)*(1-clamp01((a.t-(last-.3))/.5));

/* dmg (0 à 1) : aile abîmée après la foudre, bouts rongés, trous brûlés, une membrure brisée. */
const WING_OK=[[0,0],[200,-215],[250,-130],[345,-120],[285,-30],[330,60],[230,60],[250,140],[110,95]];

const WING_HOLES=[[[190,-120],[215,-100],[205,-70],[180,-85]],[[270,-20],[295,-5],[285,25],[258,10]],[[150,40],[175,50],[165,75],[140,62]]];
function drawWing(S,ang,sc,col,wo0,fire,side,dmg){

function aq(a,kind,canon){
  const off=a.off||0,pt=a.pt,hs=a.hits.filter(h=>h.k===kind);
  let prev=(kind==='breath'&&a.cf!=null)?a.cf:0,hit=null;
  for(let i=0;i<hs.length;i++){
    const base=hs[i].at-off;
    if(pt<base+.25||i===hs.length-1){hit=base;break}
    prev=base;
  }
  if(hit==null)return pt;
  const lead=Math.max(.3,hit-prev);
  return pt>=hit?canon+(pt-hit):canon-(hit-pt)*canon/lead;
}

}

/* ---------- rendu phase III ---------- */
function finTh(t){return t<FIN.collapse?0:1.4*ei(clamp01((t-FIN.collapse)/1.1))}
function flameRow(foot,d,pre,post,sc){
  /* onde de choc : une succession d'explosions qui part du pied du Colosse et grossit jusqu'à atteindre le héros */
  if(d<=-pre||d>=post)return;
  const N=7,life=.5+post*.3,gx=GUARD[0];
  ctx.save();ctx.shadowColor='#ff7a2b';ctx.shadowBlur=18;
  for(let i=0;i<N;i++){
    const t0=-pre*(1-i/(N-1)),a=d-t0;
    if(a<0||a>=life)continue;
    const k=a/life,x=foot+(gx-foot)*(i/(N-1)),r=(24+i*11)*sc*(.55+.6*es(k)),al=1-k*k;
    const y=DECK-r*.35,g=ctx.createRadialGradient(x,y,2,x,y,r);
    g.addColorStop(0,'rgba(255,248,215,'+(.95*al)+')');g.addColorStop(.35,'rgba(255,190,90,'+(.8*al)+')');
    g.addColorStop(.75,'rgba(255,100,35,'+(.45*al)+')');g.addColorStop(1,'rgba(255,60,20,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
    if(k<.5){ctx.strokeStyle='rgba(255,230,160,'+(.7*(1-k*2))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*.8,0,6.283);ctx.stroke()}
  }
  ctx.restore();
}
function drawBolt(x,y0,y1,al,big){
  if(al<=0)return;
  const pts=[[x,y0]];for(let i=1;i<=9;i++)pts.push([i===9?x:x+rand(-34,34),y0+(y1-y0)*i/9]);
  ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor='#fff0b0';ctx.shadowBlur=30;
  for(let pass=0;pass<2;pass++){
    ctx.strokeStyle=pass?'rgba(255,255,255,'+al+')':'rgba(255,217,102,'+(al*.6)+')';ctx.lineWidth=big?(pass?8:24):(pass?4:12);
    ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
  }
  ctx.restore();
}
function heroFin(){
  const f=R.fin,t=f.t,bx=R.bx,L=[-112,-165];
  let x=PX,y=0,rot=0,glow=1,hand=[28,-94],sa=-1.5;
  if(t<FIN.leap[0]){}
  else if(t<FIN.leap[1]){const u=(t-FIN.leap[0])/(FIN.leap[1]-FIN.leap[0]);x=PX+(bx+L[0]-PX)*es(u);y=L[1]*es(u)-110*Math.sin(Math.PI*u);hand=[30,-72];sa=.15-.95*es(u)}
  else{
    x=bx+L[0];y=L[1];hand=[30,-72];sa=-.8;
    /* un tir de lanterne dans chaque aile : le sceptre pointe l'aile visée, léger recul au départ du tir */
    for(let i=0;i<2;i++){
      const d=t-FIN.cut[i],ang=i?-.22:-.63;
      if(d>-.4&&d<.45){const k=d<.1?es(clamp01((d+.4)/.35)):1-es(clamp01((d-.1)/.35));sa=-.8+(ang+.8)*k;hand=[30-7*(d>=0&&d<.15?1-d/.15:0),-72]}
    }
    if(t>=FIN.charge&&t<FIN.strike){hand=[26,-100];sa=-1.45;y=L[1]-24*es(clamp01((t-FIN.charge)/.6))}
    else if(t>=FIN.strike){hand=[38,-56];sa=.12;x+=14*es(clamp01((t-FIN.strike)/.1))}
    if(t>=FIN.collapse){
      const mag=finTh(t),th=-mag,c=Math.cos(th),sn=Math.sin(th),k=es(clamp01(mag/1.4));
      const A=[L[0]+(45-L[0])*k,L[1]+(-200-L[1])*k];
      x=bx+A[0]*c-A[1]*sn;y=A[0]*sn+A[1]*c;
      hand=[30,-60];sa=.12+.9*k;glow=.4;
    }
    if(t>=FIN.bell-.6){
      /* debout sur le Colosse terrassé, il lève sa lanterne vers la cloche */
      const u=es(clamp01((t-(FIN.bell-.6))/.5));
      hand=[30-4*u,-60-40*u];sa=.12+.9*(1-u)-1.45*u;glow=.4+.6*u;
    }
  }
  return{x,y,hand,sa,rot,sy:1,glow};
}
function finBoss(o){
  const t=R.fin.t,th=-finTh(t),c=Math.cos(th),sn=Math.sin(th);
  o.warm=t<FIN.collapse?(t>=FIN.strike?2:1.5):Math.max(.03,(t<FIN.bell?Math.max(.25,1.7-(t-FIN.collapse)*.35):Math.max(.25,1.7-(FIN.bell-FIN.collapse)*.35)*(1-clamp01((t-FIN.bell)/1.2))));
  o.jaw=(t>=FIN.strike&&t<FIN.collapse)?16:(t<.6?12:0);
  o.lean=th;o.dy=0;
  if(t>=FIN.strike&&t<FIN.collapse)o.x+=rand(-3,3);
  o.hands=[[-128,-66],[128,-66]].map(p=>[o.x+p[0]*c-p[1]*sn,DECK+p[0]*sn+p[1]*c]);
  if(t<FIN.collapse){const sw=Math.sin(t*3)*4;o.hands[0][1]+=sw;o.hands[1][1]-=sw}
  o.nostow=t>=FIN.raise;
  if(t>=FIN.raise&&t<FIN.fling){
    /* le Colosse brandit sa masse au-dessus de lui pour écraser le Veilleur */
    const u=es(clamp01((t-FIN.raise)/.4)),a=-2.1,dir=[Math.cos(a),Math.sin(a)];
    const grip=[o.x-60,DECK-210],g1=[o.hands[0][0]+(grip[0]-o.hands[0][0])*u,o.hands[0][1]+(grip[1]-o.hands[0][1])*u];
    const b0=[grip[0]-dir[0]*34,grip[1]-dir[1]*34],g2=[o.hands[1][0]+(b0[0]-o.hands[1][0])*u,o.hands[1][1]+(b0[1]-o.hands[1][1])*u];
    const sh=t>FIN.bell1?Math.sin(t*60)*3:0;
    o.sword={h:[g1[0]+sh,g1[1]],a:a,l:135*u,heat:1.2+.6*u};o.hands=[g1,g2];o.warm=Math.max(o.warm,1.7);
  }
  if(t>=FIN.fling&&t<FIN.fling+.7)o.jaw=14;
}
/* Final : écho de la cloche vers la masse, masse tombée au sol, tirs de lanterne dans les ailes */

function heroX3(){
  const c=R.cn,p=R.pl;
  if(c&&c.k==='slide'){
    const t=c.t,tx=R.bx-150;
    if(t<.35)return PX+(tx-PX)*eo(t/.35);
    if(t<.65)return tx;
    return tx+(PX-tx)*es(clamp01((t-.65)/.5));
  }
  if((p.s==='down'||p.s==='hurt')&&p.lasso){const d=p.rd||R_T.lasso,k=es(clamp01(p.t/.3))*(1-es(clamp01((p.t-(d-.35))/.35)));return PX+46*k}
  if(p.s==='down'||p.s==='hurt')return PX-24*(1-clamp01(p.t/.5));
  return PX;
}
function heroPose3(){
  if(R.mode==='finale')return heroFin();
  if(R.mode==='intro'){
    const T=R.t;
    /* il arrive en marchant ; au choc du Colosse, il lève sa lanterne qui s'embrase */
    const up=es(clamp01((T-1.1)/.25))*(1-es(clamp01((T-2.4)/.6)));
    return{x:R.introHx,y:T<1.7?-Math.abs(Math.sin(T*9.8))*4:0,hand:[30,-68-26*up],sa:-.3-1.0*up,rot:0,sy:1,glow:Math.max(.25,up)};
  }
  const p=R.pl,c=R.cn;
  let hand=[28,-62],sa=-.45,rot=0,sy=1,glow=0;
  const x=heroX3();
  if(c){
    const t=c.t;
    if(c.k==='plant'){
      const u=es(clamp01(t/.3));hand=[28+10*u,-62+22*u];sa=-.45+.8*u;sy=1-.1*u;glow=t>=.3?clamp01(1-(t-.3)/1.1):0;
      if(t>1.1){const v=es(clamp01((t-1.1)/.4));hand=[38-10*v,-40-22*v];sa=.35-.8*v;sy=.9+.1*v}
    }else if(c.k==='bat'){

      if(V==='A'){hand=[26,-62-40*u*(1-v)];sa=-.45-1.1*u*(1-v)}
      else if(V==='B'){hand=[30,-62-6*u*(1-v)];sa=-.45+.3*u*(1-v)+(t>.2&&t<.6?Math.sin(t*60)*.03:0)}
      else{hand=[28,-62-26*u*(1-v)+(t>.2&&t<.62?Math.sin(t*55)*2.5:0)];sa=-.45-.5*u*(1-v)}
    }else if(c.k==='bell'){
      const u=es(clamp01(t/.2)),v=es(clamp01((t-.85)/.5));
      hand=[28,-62-30*u*(1-v)+(t>.1&&t<.5?Math.sin(t*55)*2.5:0)];sa=-.45-.7*u*(1-v);glow=.9*(1-v)
    }else if(c.k==='bolt'){
      const u=es(clamp01(t/.25));hand=[28,-62-30*u];sa=-.45-.5*u;glow=1;
      if(t>1.5){const v=es(clamp01((t-1.5)/.4));hand=[28,-92+30*v];sa=-.95+.5*v;glow=1-v}
    }else if(c.k==='slide'){
      sy=.82;hand=[34,-34];sa=0;rot=.05;
      if(t>.65){const v=es(clamp01((t-.65)/.5));sy=.82+.18*v;hand=[34-6*v,-34-28*v];sa=-.45*v;rot=.05*(1-v)}

    const r=clamp01(p.t/.08);hand=[28,-62-32*r];sa=-.45-1.05*r;glow=1;

    rot=-1.45*k;hand=[24,-34];sa=.7;
  }else if(p.s==='down'||p.s==='hurt'){rot=.12;sy=.82;sa=.6}
  return{x,hand,sa,rot,sy,glow};
}

function bossSword3(a,two){

/* ---------- musique (générée en direct, aucun fichier audio) ---------- */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MCH=[{r:38,t:[50,53,57]},{r:34,t:[58,62,65]},{r:41,t:[53,57,60]},{r:36,t:[55,60,64]}]; /* ré mineur : Dm · Sib · Fa · Do */
