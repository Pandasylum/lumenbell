/* Layout: the Ember Bridge shell, one centered column: header with the phase track, two health bars,
   the 16:9 arena, then the single action button. The accent follows the boss:
   Chapter II colour code: tide turquoise in every phase (docs/CH2-SPEC.md). Single dark look by choice. */
:root{
  --bg:#0a0c10;--panel:#141820;--line:#2a303c;--fg:#ece6dc;--muted:#9d988f;
  --acc:#4fe0cc;--acc2:#b8fff4;--ward:#7fd6ff;--ink:#02120f;--teal:#4fe0cc;
  --font-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body[data-ph]{--acc:#4fe0cc;--acc2:#b8fff4;--ink:#02120f}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:960px;width:100%;margin:0 auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:.95;letter-spacing:.01em}
.hright{display:flex;align-items:center;gap:10px}
.phases{display:flex;gap:6px;margin:0;padding:0;list-style:none;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em}
.phases li{border:1px solid var(--line);color:var(--muted)}
.phases button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:5px 12px;cursor:pointer;min-width:38px}
.phases button:disabled{opacity:.4;cursor:not-allowed}
.phases li:not(.on) button:hover:not(:disabled){color:var(--fg);background:rgba(255,255,255,.06)}
.phases li.on{border-color:var(--acc);color:var(--ink);background:var(--acc)}
.mbtn{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.mbtn:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.bar{display:grid;gap:5px;min-width:0}
.bar span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar span i{font-style:normal}
.bar.boss{text-align:right}
.bar span b{margin-left:4px;color:var(--fg);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px}
.pips span{flex:1;height:12px;background:#07090c;border:1px solid var(--line)}
.pips span.on{background:var(--ward);border-color:var(--ward)}
.bar.boss .pips span.on{background:var(--acc);border-color:var(--acc)}
.bar .pips span.mark,.bar.boss .pips span.mark{border-bottom:3px solid var(--fg)}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border:1px solid var(--line);background:#06080b;overflow:hidden;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:100%}
.skip{position:absolute;right:12px;bottom:12px;z-index:5;font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;background:rgba(6,8,12,.6);color:var(--fg);border:1px solid rgba(236,230,220,.35);cursor:pointer}
.skip:hover{background:rgba(255,255,255,.12)}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:12px;background:rgba(6,8,12,.72);overflow:auto}
.card{max-width:480px;display:grid;gap:10px;justify-items:start;padding:20px 22px;background:var(--panel);border:1px solid var(--line)}
.card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px}
.rtab{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 14px;width:100%;margin:2px 0 4px}
.rtab div{display:flex;flex-direction:column;gap:1px}
.rtab small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rtab b{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.rtab .rec b{color:var(--acc)}
.btn{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border:0;padding:10px 20px;background:var(--acc);color:var(--ink)}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:none;color:var(--acc);border:2px solid var(--acc)}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.ward{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;min-width:230px;height:56px;padding:0 22px;background:rgba(127,214,255,.1);color:var(--ward);border:2px solid var(--ward);touch-action:none}
.ward.down{background:rgba(127,214,255,.32)}
.mrow{display:flex;gap:8px;align-items:center}
.hint{margin:0;color:var(--muted);font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Home menu: the common menu (LB.menu, shared/js/28-ui.js); only the animations of this chapter's scene stay here */
.mscene .orb{animation:mglow 2.4s ease-in-out infinite alternate}
.mscene .aur{animation:mglow 6s ease-in-out infinite alternate}
.mscene .aur2{animation:mglow 8s ease-in-out infinite alternate-reverse}
.mscene .beam{transform-origin:715px 200px;animation:msweep 7s ease-in-out infinite alternate}
.mscene .tent{animation:mglow 2.4s ease-in-out infinite alternate}
@keyframes msweep{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
@media (prefers-reduced-motion:reduce){.mscene *{animation:none!important}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (max-width:560px){.card{padding:12px 14px;gap:8px}.ward{width:100%}.opts{margin-left:0}.rtab{grid-template-columns:repeat(2,1fr)}}

  body{padding-block:6px}
  .wrap{min-height:calc(100dvh - 12px);max-width:none;grid-template-columns:minmax(0,1fr) clamp(170px,26vw,230px);grid-template-areas:"stage top" "stage bars" "stage controls";grid-template-rows:auto auto 1fr;gap:8px 12px;align-items:start}
  .top{grid-area:top;display:grid;gap:6px}.top h1,.top .eyebrow{display:none}
  .phases button{min-width:30px;padding-inline:6px;min-height:34px}
  .bars{grid-area:bars;grid-template-columns:1fr;gap:8px}.bar.boss{text-align:left}
  .stage{grid-area:stage;width:min(100%,calc((100dvh - 12px)*16/9));margin:0 auto;align-self:center}
  .controls{grid-area:controls;display:grid;gap:8px;align-self:end}.controls>*{width:100%;min-width:0}.controls .mrow{order:-1}.mrow>*{flex:1}
  .ward{min-height:84px;font-size:20px;padding:4px 6px}.hint,.opts{display:none}
  .ov:not(.menu){padding:6px}.card{padding:8px 12px;gap:4px;max-width:100%}.card h2{font-size:20px}.card p{font-size:12px;line-height:1.3}}
</style>

<script>
(()=>{
'use strict';
/* ---------- shared/ : commun à la série (voir shared/NOTES.md). Un seul objet, LB, dans l'IIFE du chapitre ---------- */
const LB={};
/* Polices du canvas : mêmes familles que --font-display / --font-body du CSS (build/fonts.css, inlinées par le build) */
LB.FONT={display:'"Big Shoulders Display",Impact,sans-serif',body:'"DM Sans",system-ui,sans-serif'};
/* ---------- sauvegarde : clés lb-… ----------
   Clés communes à la série : lb-<nom> pour les noms de COMMON ; propres à un chapitre : lb-<id>-<nom> (LB.key).
   LB.store.get lit la nouvelle clé, sinon les anciennes dans l'ordre (OLD_KEYS communes, puis celles du chapitre, puis
   les préfixes du chapitre) et recopie la première trouvée dans la nouvelle. Les anciennes clés ne sont jamais effacées ni écrites. */
LB.COMMON=['lang','snd','mus','help'];
LB.OLD_KEYS={'lb-lang':['pn-lang','eb-lang'],'lb-snd':['db-optSnd'],'lb-mus':['db-optMus'],'lb-help':['db-optHelp']};
LB.id='';LB.old={};LB.oldPrefix=[];
LB.key=name=>LB.COMMON.includes(name)?'lb-'+name:'lb-'+LB.id+'-'+name;
LB.oldKeys=k=>{const o=(LB.OLD_KEYS[k]||[]).concat(LB.old[k]||[]);
  for(const [n,a] of LB.oldPrefix)if(k.startsWith(n))o.push(a+k.slice(n.length));return o};
LB.store={get(k,d){try{let v=localStorage.getItem(k);
  if(v==null)for(const o of LB.oldKeys(k)){v=localStorage.getItem(o);if(v!=null){try{localStorage.setItem(k,v)}catch(e){}break}}
  return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* À appeler en tête du chapitre, avant toute lecture : id (préfixe lb-<id>-), old ({nouvelle clé:[anciennes]}),
   oldPrefix ([[début de la nouvelle clé, début de l'ancienne]], pour les records). Migre au démarrage toutes les clés
   connues (et chaque ancienne clé à préfixe présente), puis fixe la langue. */
LB.setup=({id,old={},oldPrefix=[],audio})=>{LB.id=id;LB.old=old;LB.oldPrefix=oldPrefix;
  try{const ks=[];for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));
    const want=Object.keys(LB.OLD_KEYS).concat(Object.keys(old));
    for(const [n,a] of oldPrefix)ks.filter(k=>k.startsWith(a)).forEach(k=>want.push(n+k.slice(a.length)));
    want.forEach(k=>LB.store.get(k))}catch(e){}
  LB.lang.init();LB.audio.config(audio);LB.audio.load()};
/* ---------- langue et texte ----------
   Choix mémorisé (lb-lang) prioritaire ; sinon la langue de l'appareil (français si elle commence par « fr »), sinon anglais.
   LB.LANGS : ordre des boutons de langue (celui du Chapitre I). */
LB.LANGS=['en','fr'];
LB.lang={cur:'en',
  init(){let l='en';try{const nl=(navigator.languages&&navigator.languages[0])||navigator.language||'';if(/^fr/i.test(nl))l='fr'}catch(e){}
    const v=LB.store.get(LB.key('lang'),null);if(LB.LANGS.includes(v))l=v;return LB.lang.cur=l},
  set(l){if(!LB.LANGS.includes(l))return;LB.lang.cur=l;LB.store.set(LB.key('lang'),l)}};
LB._=(en,fr)=>LB.lang.cur==='fr'?fr:en;
/* ---------- audio : un seul contexte pour toute la série ----------
   LB.audio.ctx : l'unique AudioContext (créé au premier ensure(), recréé s'il est fermé). Chaîne : sources → bus sfx / mus → master → sortie.
   Niveaux par chapitre : LB.setup({audio:{master,sfx,mus}}), 1 par défaut. LB.audio.dest = sortie brute (musique qui a sa propre chaîne).
   Réglages Son / Musique : lb-snd, lb-mus lus par LB.store (load, appelé par LB.setup), écrits par setSound / setMusic.
   Arrière-plan (onglet caché, écran verrouillé, page quittée) : le contexte est suspendu, relancé au retour ou au premier geste. */
LB.audio=(()=>{
  let ctx=null,master=null,sfx=null,mus=null,bg=false,nb=null;
  const lv={master:1,sfx:1,mus:1},A={sound:true,music:true,stat:{tone:0,noise:0,made:0}};
  /* smooth : le bus musique suit en fondu (constante de temps 0,12 s, celle de l'arrêt de la musique du Chapitre I) ; sinon il prend sa valeur d'un coup (création du contexte) */
  const apply=smooth=>{if(!ctx)return;master.gain.value=lv.master;sfx.gain.value=A.sound?lv.sfx:0;
    const m=A.music?lv.mus:0;if(smooth)mus.gain.setTargetAtTime(m,ctx.currentTime,.12);else mus.gain.value=m};
  function ensure(){
    try{
      if(bg&&!document.hidden)bg=false; /* garde-fou : l'arrière-plan ne peut pas durer quand la page est visible (un événement de retour perdu bloquerait le son) */
      if(ctx&&ctx.state==='closed'){ctx=null;nb=null}
      if(!ctx){
        const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
        try{ctx=new C({latencyHint:'playback'})}catch(e){ctx=new C()}
        try{master=ctx.createGain();master.connect(ctx.destination);sfx=ctx.createGain();sfx.connect(master);mus=ctx.createGain();mus.connect(master);apply();A.stat.made++}
        catch(e){ctx=null;return null}
      }
      if(!bg&&ctx.state!=='running'&&ctx.resume)ctx.resume().catch(()=>{}); /* suspended, ou « interrupted » sur Safari */
    }catch(e){}
    return ctx;
  }
  /* off=true : le contexte est suspendu et reste coupé tant qu'on n'est pas revenu */
  function background(off){bg=off;try{if(ctx){if(off){if(ctx.state==='running')ctx.suspend().catch(()=>{})}else ensure()}}catch(e){}}
  /* enveloppe par défaut = celle du Chapitre II ; o={atk,end,tail} pour une enveloppe plus ancienne (Chapitre I) */
  function tone(f,dur,type,vol,dest,when,f2,o){
    if(!ctx||(!dest&&!A.sound))return;
    if(ctx.state!=='running')ensure();
    try{
      const t=when||ctx.currentTime,atk=o&&o.atk!=null?o.atk:.006,end=o&&o.end||.0005,tail=o&&o.tail!=null?o.tail:.05;
      const os=ctx.createOscillator(),g=ctx.createGain();
      os.type=type||'sine';os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dur);
      if(atk>0){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk)}else g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(end,t+dur);
      os.connect(g);g.connect(dest||sfx);os.start(t);os.stop(t+dur+tail);A.stat.tone++;
    }catch(e){}
  }
  function noise(dur,vol,ft,ff,q,dest,when,ff2,o){
    if(!ctx||(!dest&&!A.sound))return;
    if(ctx.state!=='running')ensure();
    try{
      if(!nb){nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
      const t=when||ctx.currentTime,atk=o&&o.atk||0,end=o&&o.end||.0005;
      const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
      s.buffer=nb;s.loop=true;fl.type=ft;fl.frequency.setValueAtTime(ff,t);if(ff2)fl.frequency.exponentialRampToValueAtTime(ff2,t+dur);fl.Q.value=q||1;
      if(atk>0){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+atk)}else g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(end,t+dur);
      s.connect(fl);fl.connect(g);g.connect(dest||sfx);s.start(t);s.stop(t+dur+.05);A.stat.noise++;
    }catch(e){}
  }
  /* le navigateur n'autorise le son qu'après un vrai geste : on crée / relance le contexte à chacun d'eux tant qu'il ne tourne pas, et on joue un son muet pour l'amorcer */
  function unlock(){
    ensure();
    try{if(ctx&&ctx.state==='running'&&!ctx.__u){ctx.__u=1;const b=ctx.createBuffer(1,1,22050),n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);n.start(0)}}catch(e){}
  }
  ['click','pointerup','mousedown','touchend','keydown'].forEach(ev=>window.addEventListener(ev,()=>{if(!ctx||ctx.state!=='running'||!ctx.__u)unlock()},true));
  document.addEventListener('visibilitychange',()=>background(document.hidden));
  window.addEventListener('pagehide',()=>background(true));window.addEventListener('pageshow',()=>background(document.hidden));
  window.addEventListener('blur',()=>{if(document.hidden)background(true)});window.addEventListener('focus',()=>{if(!document.hidden)background(false)});
  Object.assign(A,{
    ensure,background,tone,noise,
    config(o){Object.assign(lv,o||{});apply()},
    load(){A.sound=LB.store.get(LB.key('snd'),'1')==='1';A.music=LB.store.get(LB.key('mus'),'1')==='1';apply()},
    setSound(on){A.sound=!!on;LB.store.set(LB.key('snd'),A.sound?'1':'0');apply();if(A.sound)ensure()},
    setMusic(on){A.music=!!on;LB.store.set(LB.key('mus'),A.music?'1':'0');apply(true);if(A.music)ensure()},
    now(){return ctx?ctx.currentTime:0}
  });
  /* défini à part : Object.assign recopierait la valeur des accesseurs au lieu de les garder */
  Object.defineProperties(A,{ctx:{get:()=>ctx},dest:{get:()=>ctx&&ctx.destination},sfx:{get:()=>sfx},mus:{get:()=>mus},master:{get:()=>master},
    state:{get:()=>ctx?ctx.state:'none'},bg:{get:()=>bg}});
  return A;
})();
/* ---------- LB.hero : la machine à états du Veilleur, commune aux deux chapitres (session engine/hero-states) ----------
   ready -> act -> recover -> ready. Un appui n'agit qu'en ready ; pendant l'action ou la récupération il ne lance rien et ne fait que
   poser deny (la lanterne du Veilleur passe au rouge, dessin du chapitre). Chaque attaque est jugée à son impact : elle est arrêtée
   si le Veilleur est en action à cet instant, ou dans la grâce (grace) de sa récupération ; une attaque arrêtée le renvoie à ready
   (LB.hero.stopped), de sorte qu'une série s'enchaîne. Un coup reçu (hurt) étourdit le Veilleur, raccourci pour qu'il puisse arrêter
   l'attaque suivante : min(base, max(min, écart − marge)).
   Gestes : block (bloquer, tapoter), dodge (esquiver), hold (bloquer tenu : la garde dure tant que le bouton est tenu, avec une
   endurance drain / regen par seconde ; épuisée, récupération broken). L'action dure act × m, la récupération rec × rm (m, rm :
   difficulté, LB.diff.cur) ; un arrêt appuyé moins de perf × m avant l'impact est parfait.
   Réglages propres à une attaque (fenêtre courte du souffle, marge de plus en Difficile) : jamais ici, le chapitre les passe à
   LB.hero.stops(p, {win, grace, graceAdd}) et LB.hero.hurt(p, écart, {dur, min}). Noms d'état gardés (p.s, p.t, p.rd, p.rk, p.deny,
   p.at) : lus par le dessin et par les tests. Durées en secondes, reprises telles quelles des deux chapitres. */
LB.HERO_T={
  block:{act:.333,rec:.7,grace:.06,perf:.08},
  dodge:{act:.333,rec:.7,grace:.05,perf:.08},
  hold:{act:.333,rec:.7,grace:.06,perf:.08,drain:.36,regen:.38,broken:.9},
  deny:.25,                                         /* appui refusé : durée du retour rouge */
  hurt:{base:{block:.38,dodge:.38,hold:.55},min:.14,margin:.2}
};
/* Difficulté du Veilleur : PV (hp), multiplicateurs de l'action (m) et de la récupération (rm). trial : Épreuve, 4 PV au départ, +1 PV entre les
   phases (heal) dans la limite des 4 PV de départ (décision du 31 octobre, qui remplace « aucun soin ») ; elle s'ajoute à la difficulté de base (m et rm de Normal ou de Difficile). */
LB.HERO_DIFF={
  easy:{hp:6,m:2,rm:1},
  normal:{hp:4,m:1,rm:1},
  hard:{hp:3,m:.6,rm:1.2},
  trial:{hp:4,heal:1}
};
LB.diff={
  cur:null,
  /* difficulté du chapitre (ses propres réglages) + celle du Veilleur ; chap.trial ajoute les règles de l'Épreuve */
  apply(name,chap){const out=Object.assign({},chap||{},LB.HERO_DIFF[name]);if(chap&&chap.trial)Object.assign(out,LB.HERO_DIFF.trial);return out},
  /* difficulté en cours (lue par LB.hero pour m et rm) : le chapitre l'appelle à chaque choix de difficulté */
  use(d){return LB.diff.cur=d}
};
LB.diff.cur=LB.diff.apply('normal');
LB.hero={

/* ---------- LB.cine : intro et outro des chapitres (session engine/cine, 1er novembre 2026) ----------

   bouton « Passer » (#cineSkip), cartons enchaînés avec un fondu au noir à chaque bout, Échap / Entrée / Espace passent.

   seen(), playing(), skip()}.

LB.ui=(()=>{
  const $=id=>document.getElementById(id),mk=(tag,attrs,html)=>{const e=document.createElement(tag);for(const k in attrs||{})e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e};
  let styled=false;
  /* style commun, une seule fois, avec les couleurs du chapitre (après le style de la page : les règles du menu l'emportent comme avant) */
  function style(C){if(styled)return;styled=true;const st=document.createElement('style');st.textContent=LB.UI_CSS(C);document.head.appendChild(st)}
  return{$,mk,style};
})();

/* ---------- LB.card : carte de l'arène (#ov), déclarative ----------
   show({eye, title, stats, table, desc, how, go, onGo, go2, onGo2, clear}) ; table = lignes [libellé, valeur, record?].
   hide(), visible(), go() (le bouton principal), el (éléments). Le bouton reçoit le focus (Entrée / Espace le pressent). */
LB.card=(()=>{
  const el={};let onGo=null,onGo2=null;
  function mount(stage,before){
    if(el.ov)return el;
    const ov=LB.ui.mk('div',{class:'ov',id:'ov',hidden:''},'<div class="card"><p class="eyebrow" id="ovEye"></p><h2 id="ovTitle"></h2><p class="stats" id="ovStats" hidden></p><div class="rtab" id="ovTable" hidden></div><p id="ovDesc"></p><p class="how2" id="ovHow" hidden></p><button class="btn" id="go" type="button"></button><button class="btn ghost" id="go2" type="button" hidden></button></div>');
    stage.insertBefore(ov,before||null);
    Object.assign(el,{ov,eye:ov.querySelector('#ovEye'),title:ov.querySelector('#ovTitle'),stats:ov.querySelector('#ovStats'),table:ov.querySelector('#ovTable'),
      desc:ov.querySelector('#ovDesc'),how:ov.querySelector('#ovHow'),go:ov.querySelector('#go'),go2:ov.querySelector('#go2')});
    el.go.addEventListener('click',()=>{if(onGo)onGo()});
    el.go2.addEventListener('click',()=>{if(onGo2)onGo2()});
    return el;
  }
  function table(rows){el.table.innerHTML='';for(const r of rows){const d=document.createElement('div');if(r[2])d.className='rec';d.innerHTML='<small></small><b></b>';d.firstChild.textContent=r[0];d.lastChild.textContent=r[1];el.table.appendChild(d)}}
  function show(o){
    el.eye.textContent=o.eye||'';el.title.textContent=o.title||'';
    el.stats.hidden=!o.stats;el.stats.textContent=o.stats||'';
    el.table.hidden=!o.table;el.table.innerHTML='';if(o.table)table(o.table);
    el.desc.textContent=o.desc||'';el.how.hidden=!o.how;el.how.textContent=o.how||'';
    el.go.textContent=o.go||'';onGo=o.onGo||null;
    el.go2.hidden=!o.go2;el.go2.textContent=o.go2||'';onGo2=o.onGo2||null;
    el.ov.classList.toggle('clear',!!o.clear);el.ov.hidden=false;
    try{el.go.focus({preventScroll:true})}catch(e){}
  }
  return{el,mount,show,hide(){if(el.ov)el.ov.hidden=true},visible(){return!!el.ov&&!el.ov.hidden},go(){if(onGo)onGo()},setGo(f){onGo=f},setGo2(f){onGo2=f}};
})();

/* ---------- LB.pause : carte de pause (Reprendre, Menu) ---------- */

    stage.insertBefore(ov,after?after.nextSibling:null);
    ov.querySelector('#pResume').addEventListener('click',()=>{if(h.onResume)h.onResume()});
    ov.querySelector('#pMenu').addEventListener('click',()=>{if(h.onMenu)h.onMenu()});

  }
  function lang(){if(!ov)return;ov.querySelector('#pTitle').textContent=LB._('Fight paused','Combat en pause');ov.querySelector('#pResume').textContent=LB._('Resume','Reprendre')}
  return{mount,lang,bind(hh){h=hh},show(){ov.hidden=false;try{ov.querySelector('#pResume').focus({preventScroll:true})}catch(e){}},hide(){if(ov)ov.hidden=true},
    visible(){return!!ov&&!ov.hidden},resume(){if(h.onResume)h.onResume()},get el(){return ov}};

/* ---------- LB.fs : plein écran (boutons .fsb : en-tête et menu) ; masqués si l'API manque (iPhone) ---------- */
LB.fs={bind(){const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen,
  isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement),btns=document.querySelectorAll('.fsb');
 if(!rq){btns.forEach(b=>b.hidden=true);return}
 btns.forEach(b=>{if(b.dataset.fs)return;b.dataset.fs='1';b.addEventListener('click',e=>{e.currentTarget.blur();try{const r=isFs()?ex.call(document):rq.call(de);if(r&&r.catch)r.catch(()=>{})}catch(x){}})})},
 lang(){document.querySelectorAll('.fsb').forEach(b=>{const t=LB._('Fullscreen','Plein écran');b.setAttribute('aria-label',t);b.title=t})}};

/* ---------- LB.gate : écran de démarrage (Commencer + langues) ; le clic débloque le son (comme au Chapitre I) ---------- */
LB.gate=(()=>{
  let g=null,h={};
  function mount(stage,before,hh){
    h=hh||{};if(g)return g;
    g=LB.ui.mk('div',{class:'gate',id:'gate'},'<div class="langs" id="gateLangs" role="group" aria-label="Language">'+LB.LANGS.map(l=>'<button type="button" data-lang="'+l+'" aria-pressed="false">'+l.toUpperCase()+'</button>').join('')+'</div><button class="btn big" id="gateBtn" type="button">Start</button>');
    stage.insertBefore(g,before||null);

    return g;
  }
  return{mount,visible(){return!!g&&!g.hidden},focus(){try{g.querySelector('#gateBtn').focus({preventScroll:true})}catch(e){}},get el(){return g}};

/* ---------- LB.menu : menu de la série ----------
   mount(C, h) : construit autour de la scène SVG du chapitre (déjà dans #menu, classe .mscene) les particules, « ▶ Intro »,
   « ▶ Outro » (après la vraie fin), plein écran, langues, puis la carte : « Lumen|bell », la ligne du chapitre dessous, accroche,
   Reprendre, les quatre difficultés, le sous-menu de l'Épreuve (Normal, Difficile, Retour) et sa note, mode d'emploi, version,
   chapitre suivant ; aussi l'écran de démarrage (LB.gate), la carte (LB.card) et la pause (LB.pause) s'ils manquent.
   h : {onDiff(dk), onIntro(), onOutro(), onResume(), onLang(), onStart()}. show(reprendre), hide(), visible(), lang(),
   update() (verrou de l'Épreuve, records, « ▶ Outro », chapitre suivant), trial(on). */
LB.menu=(()=>{
  let C=null,h={},m=null,card=null;const $=LB.ui.$;
  const DK=['easy','normal','hard'];
  const TX={easy:()=>LB._('Easy','Facile'),normal:()=>LB._('Normal','Normal'),hard:()=>LB._('Hard','Difficile'),
    sEasy:()=>LB._('Breathe','Respire'),sNormal:()=>LB._('Fair and square','À la loyale'),sHard:()=>LB._('No mercy','Sans pitié'),sTrial:()=>LB._('Ultimate challenge','Challenge ultime')};
  function particles(){const M=Object.assign({},LB.MENU_T,(C.menu&&C.menu.t)||{}),P=M[C.menu.particles],w=LB.ui.mk('div',{class:'mem-wrap',id:P.id,'aria-hidden':'true'});
    for(let i=0;i<P.n;i++){const e=document.createElement('i');e.className=P.cls;e.style.left=(Math.random()*100)+'%';e.style.setProperty('--dx',((Math.random()-.5)*P.dx)+'px');
      e.style.animationDuration=(P.dur[0]+Math.random()*P.dur[1])+'s';e.style.animationDelay=(-Math.random()*P.delay)+'s';const z=P.size[0]+Math.random()*P.size[1];e.style.width=e.style.height=z+'px';w.appendChild(e)}
    return w}
  function mount(CH,hh){
    C=CH;h=hh||{};if(m)return m;
    LB.ui.style(C);
    m=$('menu');const stage=m.parentNode;
    if(!LB.card.el.ov)LB.card.mount(stage,m);
    LB.gate.mount(stage,m,{onStart:()=>{if(h.onStart)h.onStart()}});
    if(!LB.pause.el)LB.pause.mount(stage,m);
    m.appendChild(particles());
    m.appendChild(LB.ui.mk('button',{type:'button',class:'mbtn',id:'introBtn'},'▶ Intro'));
    m.appendChild(LB.ui.mk('button',{type:'button',class:'mbtn',id:'outroBtn',hidden:''},'▶ Outro'));
    m.appendChild(LB.ui.mk('button',{type:'button',class:'mbtn fsb fsm','aria-label':'Fullscreen',title:'Fullscreen'},'⛶ <span>Fullscreen</span>'));
    m.appendChild(LB.ui.mk('div',{class:'langs',id:'langs',role:'group','aria-label':'Language'},LB.LANGS.map(l=>'<button type="button" data-lang="'+l+'" aria-pressed="false">'+l.toUpperCase()+'</button>').join('')));
    const b=(dk,pr)=>'<button type="button" data-diff="'+dk+'"'+(pr?' aria-pressed="true"':'')+'><b></b><span></span></button>';
    card=LB.ui.mk('div',{class:'mcard'},'<h2><span>Lumen</span>bell</h2><p class="eyebrow chap" id="mEye"></p><p class="tag"></p>'+
      '<button class="btn ghost" id="mResume" type="button" hidden>Resume</button>'+
      '<div class="mph" id="mphM" role="group" aria-label="Choose difficulty">'+b('easy')+b('normal',1)+b('hard')+b('trial')+'</div>'+
      '<div class="mph" id="mphT" role="group" aria-label="Trial" hidden>'+b('tn')+b('th')+'<button type="button" id="mBackT"><b></b><span></span></button></div>'+
      '<div class="tnote" id="trialNote" hidden><b></b><ul>'+LB.TRIAL_RULES.map(()=>'<li></li>').join('')+'</ul></div>'+
      '<p class="how"></p><p class="ver" aria-label="Version '+LB.VERSION+'">v'+LB.VERSION+'</p>'+
      '<div class="mfoot"><button type="button" class="mlink" id="mNext" aria-disabled="true"><span class="nm"></span> <small class="soon"></small></button></div>');
    m.appendChild(card);
    /* scène : cadrée sur le bas en paysage, entière en portrait (comme au Chapitre I) */
    const sv=m.querySelector('.mscene');if(sv){const fit=()=>sv.setAttribute('preserveAspectRatio',innerWidth/innerHeight<1.2?'xMidYMax meet':'xMidYMax slice');fit();addEventListener('resize',fit)}
    m.querySelectorAll('.mph button').forEach(bt=>bt.addEventListener('click',()=>{
      if(bt.disabled||!bt.dataset.diff)return;
      if(bt.dataset.diff==='trial'&&!C.trialOpen()){bt.blur();return}   /* verrouillée : aucun message, le cadenas suffit */
      if(bt.dataset.diff==='trial'){trial(true);return}
      m.querySelectorAll('.mph button').forEach(o=>o.setAttribute('aria-pressed',String(o===bt)));
      if(h.onDiff)h.onDiff(bt.dataset.diff);
    }));
    $('mBackT').addEventListener('click',()=>trial(false));
    $('mResume').addEventListener('click',()=>{if(h.onResume)h.onResume()});
    $('introBtn').addEventListener('click',e=>{e.currentTarget.blur();if(h.onIntro)h.onIntro()});
    $('outroBtn').addEventListener('click',e=>{e.currentTarget.blur();if(h.onOutro)h.onOutro()});
    $('mNext').addEventListener('click',e=>e.currentTarget.blur());   /* chapitre suivant : « À venir » suffit, aucun message */
    document.querySelectorAll('#langs button,#gateLangs button').forEach(bt=>bt.addEventListener('click',()=>{LB.lang.set(bt.dataset.lang);lang();if(h.onLang)h.onLang();bt.blur()}));
    LB.fs.bind();
    lang();
    return m;
  }
  /* records de l'Épreuve, verrou, « ▶ Outro », chapitre suivant */
  function update(){if(!m)return;
    for(const n of ['tn','th']){const sp=m.querySelector('#mphT [data-diff='+n+'] span'),v=+C.best(n)||0;sp.textContent=v?'🏆 '+C.fmt(v):LB._('No record yet','Pas encore de record')}
    const ok=C.endSeen(),tok=C.trialOpen(),tb=m.querySelector('#mphM [data-diff=trial]'),nm=LB.tx(C.trial.name);
    $('outroBtn').hidden=!ok;
    tb.setAttribute('aria-disabled',String(!tok));   /* Épreuve : ouverte pendant les tests (TRIAL_OPEN), sinon débloquée par la vraie fin */
    tb.querySelector('b').textContent=tok?nm:'🔒 '+nm;tb.querySelector('span').textContent=tok?TX.sTrial():LB._('To unlock','À débloquer');
    {const b=$('mNext'),op=!!C.next.open&&C.next.open();   /* chapitre suivant : toujours non cliquable ; cadenas tant qu'il n'est pas ouvert */
     b.classList.toggle('lock',!op);b.querySelector('.nm').textContent=op?LB.chapterName(C.next.n,C.next.title):LB.chapterLock(C.next.n);b.querySelector('.soon').textContent=LB._('Coming soon','À venir')}
  }
  function lang(){if(!m)return;
    document.documentElement.lang=LB.lang.cur;
    update();
    $('mEye').textContent=LB.chapterName(C.n,C.title);
    m.querySelector('.mcard .tag').textContent=LB.tx(C.tag);
    $('mResume').textContent=LB._('Resume','Reprendre');
    const gb=$('gateBtn');if(gb)gb.textContent=LB._('Start','Commencer');

/* ---------- LB.input : entrées communes ----------
   Action : Espace, flèche haut, W, Z, toucher l'arène ou le bouton d'action ; relâchement (touche, doigt, perte du focus) pour
   tous ; P / Échap : pause ; R : réessayer ; Entrée / Espace : carte, pause (reprendre) et menu (Normal) ; écran de démarrage :
   seul son bouton agit ; case à cocher focalisée : rien. bind({press, release, pause, retry, skip}) : skip(e) rend true si le
   chapitre a pris la touche (cinématique propre au chapitre). */
LB.input=(()=>{
  const ACT=[' ','Spacebar','ArrowUp','w','W','z','Z'];let h={},bound=false;
  function bind(hh){h=hh;if(bound)return;bound=true;
    const cv=document.getElementById('c'),ward=document.getElementById('ward'),rel=()=>{if(h.release)h.release()};
    for(const t of [cv,ward]){if(!t)continue;
      t.addEventListener('pointerdown',e=>{e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(x){}if(h.press)h.press()});
      t.addEventListener('pointerup',rel);t.addEventListener('pointercancel',rel);t.addEventListener('lostpointercapture',rel)}
    if(ward){ward.addEventListener('click',e=>{if(e.detail===0&&h.press)h.press()});ward.addEventListener('contextmenu',e=>e.preventDefault())}
    window.addEventListener('blur',rel);
    window.addEventListener('keyup',e=>{if(ACT.includes(e.key)||e.key==='Enter')rel()});   /* Entrée : bouton d'action focalisé (clic clavier) */
    window.addEventListener('keydown',e=>{
      if(LB.gate.visible())return;   /* écran de démarrage : seul le bouton agit */
      const k=e.key,a=document.activeElement;
      if(a&&a.tagName==='INPUT')return;
      if(h.skip&&h.skip(e))return;
      if(e.repeat){if(ACT.includes(k)&&!LB.menu.visible())e.preventDefault();return}
      if(k==='r'||k==='R'){if(!LB.menu.visible()&&h.retry){e.preventDefault();h.retry()}return}
      if(k==='p'||k==='P'||k==='Escape'){if(!LB.menu.visible()&&h.pause){e.preventDefault();h.pause()}return}
      const ok=k===' '||k==='Enter';
      if(LB.pause.visible()){if(ok&&a!==document.getElementById('pMenu')){e.preventDefault();LB.pause.resume()}return}
      if(LB.menu.visible()){const mn=document.getElementById('menu');if(ok&&!mn.contains(a)){e.preventDefault();mn.querySelector('#mphM [data-diff=normal]').click()}return}
      if(LB.card.visible()){if(ok&&a!==LB.card.el.go){e.preventDefault();LB.card.el.go.click()}return}
      if(ACT.includes(k)){e.preventDefault();if(h.press)h.press()}
    });
  }
  return{bind,ACT};
})();

   lb-help) en Épreuve. use(d) au choix de la difficulté ; defeat(facile) : true à la 3e défaite en Facile sans aide (le chapitre

/* ---------- LB.cue : repère d'aide (décision n° 8 du 28 octobre : celui du Chapitre I) ----------
   Normal et Difficile : barre au-dessus de la tête, orange à l'approche, bleue pendant la fenêtre d'action ; Facile : cercle
   qui se resserre autour du Veilleur pendant la fenêtre. LB.cue(ctx, {x, y, cx, cy, r, tt, act, easy}) : x, y = barre (centre,
   haut) ; cx, cy, r = cercle (rayon à l'ouverture) ; tt = temps jusqu'à l'impact ; act = durée de l'action. Le Chapitre II garde
   ses aides propres : demi-cercle des faisceaux (hold), pointillé des reflets (fake). Table LB.CUE_T. */
LB.CUE_T={lead:.8,bar:{w:68,h:6},shrink:20,open:'#6fd3ff',near:'rgba(255,122,43,.85)',ring:'rgba(111,211,255,.9)'};
LB.cue=function(ctx,o){const T=LB.CUE_T,tt=o.tt,act=o.act;
  if(!o.easy){if(tt>0&&tt<=act+T.lead)LB.cue.bar(ctx,o.x,o.y,tt<=act?tt/act:1-(tt-act)/T.lead,tt<=act);return}
  if(tt<=act&&tt>0){ctx.strokeStyle=T.ring;ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.cx,o.cy,o.r-T.shrink*(1-tt/act),0,6.283);ctx.stroke()}};
LB.cue.bar=function(ctx,cx,y,k,open){const T=LB.CUE_T,w=T.bar.w,h=T.bar.h,x=cx-w/2;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle=open?T.open:T.near;ctx.fillRect(x,y,w*(k<0?0:k>1?1:k),h)};
/* cercle d'approche (phase I du Chapitre I) : orange qui se resserre, puis bleu lumineux pendant la fenêtre */
LB.cue.ring=function(ctx,cx,cy,r,open){const T=LB.CUE_T;
  ctx.save();ctx.lineWidth=open?5:3;ctx.strokeStyle=open?T.open:T.near;if(open){ctx.shadowColor=T.open;ctx.shadowBlur=12}
  ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.stroke();ctx.restore()};

/* ---------- input: the Watcher's states, shared with Ember Bridge (LB.hero, shared/js/16-hero.js) ---------- */
/* ready -> action -> recover -> ready. A press only acts in ready; during the action or the recovery it starts nothing and
   only sets deny (the Watcher's lantern turns red). Each attack is settled at its impact: it is stopped if the Watcher is in his
   action then, or within `grace` of his recovery; a stopped attack sends him back to ready, so a series can be chained.
   Durations (HERO_T) and difficulty (m, rm) are in LB: action = base x m, recovery = base x rm. The gesture depends on the phase:
   block (phase II, the King), dodge (phase I, the Voice), hold (phase III: the guard lasts as long as the button is held, against
   the beams, and wears the stamina out; a beam blocked to its end counts as a stopped attack). The stun after a hit is cut short
   so that the next attack can still be stopped (one hit per mistake). Only the reflections' return is chapter-specific:
   backTurn / backWin = a reflection dodged turns round behind the Watcher (backTurn s) and comes back as a real attack after
   the action + the recovery + backWin s (PROVISIONAL), so it can be dodged again. */
const DG={backTurn:.35,backWin:.45};
const GESTURE={1:'block',2:'dodge',3:'hold'};   // internal phase number -> gesture (1 the King, 2 the Voice, 3 the Lighthouse)
const gest=()=>GESTURE[S.phase];

/* durations for the current phase and difficulty (act, rec, grace, perf, hurt, broken) */

function down(){
  if(S.mode!=='play'||S.paused)return;
  ensureAudio();
  $('ward').classList.add('down');S.held=true;
  // the animation dates (guardT, dodgeT) only move when an action starts, never on a refused press
  if(LB.hero.press(S.pl,gest(),gt)){S.guardT=gt;if(S.phase===2)S.dodgeT=gt;if(S.phase===3)play('shield')}
}
function up(){S.held=false;LB.hero.release(S.pl);$('ward').classList.remove('down')}
/* is the attack stopped at its impact? (a shard of the rain gets a wider grace in Hard) */
function stops(th){return LB.hero.stops(S.pl,{graceAdd:th&&th.k==='shard'&&S.d.m<1?RAIN.grace:0})}
/* the Watcher's state over time (phase III: the guard is held while the button is down) */
function plStep(dt){
  const p=S.pl;
  if(LB.hero.step(p,dt,{gesture:gest(),held:S.held})==='broken'){S.broken=gt+PT().broken;say(_('Your guard is broken.','Ta garde est brisée.'))}
  S.holding=S.phase===3&&p.s==='act';
}

function success(th,perfect){
  th.done=true;th.res='ok';th.okT=gt;th.perfect=perfect;S.okT=gt;
  if(perfect){th.pat.perf++;S.perfects++}
  const ph=S.phase;
  if(ph===1){burst(HX+55,GY-80,perfect?26:14,perfect?'#f2fffb':'#8fe8d8',perfect?7:5,.5);play('block',perfect);MUSIC.fx('clank');pop(ONO.block,perfect?'#f2fffb':'#bff3ea')}
  else if(ph===2){S.dodgeOk=gt;play('dodge',perfect)}
  else{burst(HX,GY-120,perfect?24:12,perfect?'#e8fdff':'#7fe8ff',6,.5);play('block',perfect);pop(ONO.block,perfect?'#e8fdff':'#a8f0ff')}
}
function hurt(th){
  if(S.mode!=='play')return;
  S.hp=Math.max(0,S.hp-1);S.hits++;S.hurtT=gt;S.shake=12;
  // stun, cut short so that the next attack can still be stopped (LB.hero.hurt: min(base, max(.14, gap - .2)))
  {let nx=99;for(const o of S.threats)if(o!==th&&!o.done&&o.real!==false){const at=o.hold?o.ta:o.ti;if(at!=null&&at>gt)nx=Math.min(nx,at-gt)}
   LB.hero.hurt(S.pl,nx,{g:gest(),dur:th&&th.k==='shard'?RAIN.hurt:undefined})}
  if(th&&th.k==='rafter')pop(ONO.crush,'#ff8a6b',HX-30,GY-190);
  burst(HX,GY-70,18,'#ff6a5a',5,.55);play('hurt');MUSIC.fx('chunk');hud();
  if(S.hp<=0){S.mode='dead';S.deadT=gt;S.holding=false;say(_('The Watcher falls. Defeat.','Le Veilleur tombe. Défaite.'))}
}
/* the riposte's impact, taken from Ember Bridge (36-p2-foundry-logic.js qDamage, and qFinalStep for the last blow of a
   phase): screen shake (Ember Bridge amplitude; this chapter shakes ±shake/2, hence x2 when applied), hitstop (game time
   stops, s), white flash (fading flashDecay per s), dull impact sound, a ring (ringLife s) and sparks tinted by phase
   (white turquoise for the Voice, violet for the King, turquoise for the tower), the boss pushed back recoilPx (recovering
   recoilDecay per s), then staggered `hurt` s once the riposte is over. All values taken from Ember Bridge. */
const SHOCK={shake:13,hitstop:.11,flash:.4,flashDecay:2.2,ringLife:.35,recoilPx:20,recoilDecay:3.5,hurt:.55,
  final:{shake:16,hitstop:.14,flash:.8},
  tint:{2:['#ffffff','#dffcf6','#8fe8d8'],1:['#ffffff','#e2d2ff','#b48cff'],3:['#ffffff','#b8fff4','#4fe0cc']},
  /* phase III, per form (sound `snd` with `body`, bell or wet fx `fx`, particles `tint` n each of speed `spd`, life `life`, gravity `g`):
     form I = the tower made of the King, rusted metal and bell (metal sparks, bell ring); form II = the jellyfish's own
     matter, soft and gelatinous (dull wet sound, translucent splashes that fall back) */
  form:{1:{snd:'thud',fx:'bellHit',tint:['#ffffff','#ffd9a0','#ff9a4a'],n:[10,16,10],spd:9,life:.6,g:.5},
        2:{snd:'squelch',fx:'jellyHit',tint:['rgba(210,250,255,.55)','rgba(120,225,255,.45)','rgba(90,190,235,.4)'],n:[8,14,14],spd:5,life:.9,g:.9}}};
function damageBoss(n){
  S.bossHp=Math.max(0,S.bossHp-n);S.bossFlash=gt;
  const F=S.bossHp<=0?SHOCK.final:SHOCK,col=SHOCK.tint[S.phase];
  S.shake=Math.max(S.shake,F.shake*2);S.hitstop=F.hitstop;S.flashHit=F.flash;S.recoil=1;
  const FM=S.phase===3?SHOCK.form[S.form===2?2:1]:null,pw=S.bossHp<=0?1.6:1.2;
  play(FM?FM.snd:'thud',pw);MUSIC.fx(FM?FM.fx:[null,'bellHit','crackGlass'][S.phase]);
  const p=bossCore();if(FM)FM.tint.forEach((c,i)=>burst(p.x,p.y,FM.n[i],c,FM.spd,FM.life,FM.g));else col.forEach((c,i)=>burst(p.x,p.y,i?12:10,c,7,.7));(S.rings||(S.rings=[])).push({x:p.x,y:p.y,life:SHOCK.ringLife,c:col[2]});
  hud();
  if(S.bossHp<=0){S.mode='ko';S.koT=gt;S.threats=[];S.pat=null;S.cnt=null;S.holding=false;play('ko');
    say([null,_('The Rust Elder collapses.',"L'Ancien de Rouille s'effondre."),_('The Hollow Voice\'s mirror shatters.','Le miroir de la Voix Creuse éclate.'),_('The lantern goes dark.','La lanterne s\'éteint.')][S.phase]);
    }
}
function bossCore(){return S.phase===1?{x:700,y:GY-160}:S.phase===2?{x:730,y:150}:S.form===2?{x:LX,y:ECY}:{x:LX,y:LY}}

/* ---------- update ---------- */
function update(dt){
  // the riposte's shock: decays run in real time; during the hitstop the game time stands still
  S.flashHit=Math.max(0,(S.flashHit||0)-dt*SHOCK.flashDecay);S.recoil=Math.max(0,(S.recoil||0)-dt*SHOCK.recoilDecay);
  if(S.rings){for(const r of S.rings)r.life-=dt;S.rings=S.rings.filter(r=>r.life>0)}
  if(S.hitstop>0&&(S.mode==='play'||S.mode==='ko')&&!S.paused){const d=Math.min(dt,S.hitstop);S.hitstop-=d;gt-=d;return}
  if(S.mode==='play'&&!S.paused){
    S.runT+=dt;
    plStep(dt);
    if(!S.pat&&!S.cnt&&gt>=S.nextAt)spawn();
    for(const th of S.threats){
      if(th.done)continue;
      if(th.hold){
        if(gt>=th.ta&&gt<=th.tb){if(S.pl.s!=='act'){th.done=true;th.res='hit';th.okT=gt;th.pat.ok=false;hurt(th);if(S.mode!=='play')break}else if(!th.held){th.held=true;burst(HX,GY-110,10,'#b8fff4',4,.4)}}
        else if(gt>th.tb){th.done=true;th.res='ok';th.okT=gt;if(S.pl.s==='act')LB.hero.stopped(S.pl)}
        continue;
      }
      if(gt>=th.ti){
        th.done=true;th.okT=gt;const p=S.pl;
        if(th.real===false){if(p.s==='act'&&aimedAt(th))fooled(th);else{th.res='pass';burst(HX+20,GY-70,10,'#a49bbd',3,.5);play('fool')}}
        else if(stops(th)){success(th,LB.hero.perfect(p,gt));LB.hero.stopped(p)}
        else{th.res='hit';th.pat.ok=false;hurt(th);if(S.mode!=='play')break}
      }
    }
    if(S.mode==='play'&&S.pat&&S.pat.ths.every(t=>t.done))closePat();
    if(S.cnt&&!S.cnt.hit&&gt>=S.cnt.t+S.cnt.hitAt){S.cnt.hit=true;damageBoss(S.cnt.dmg)}
    if(S.cnt&&gt>=S.cnt.t+S.cnt.dur){S.cnt=null;S.bossHurtT=gt}
  }
  if(S.mode==='ko'&&gt>S.koT+2.6&&!S.koShown){S.koShown=true;phaseCleared()}
  if(S.mode==='dead'&&gt>S.deadT+1.1&&!S.deadShown){S.deadShown=true;deathCard()}
  S.threats=S.threats.filter(t=>gt<(t.tb||t.ti)+1.6);
  S.parts=S.parts.filter(p=>gt-p.t0<p.life);
  S.pops=S.pops.filter(p=>gt-p.t0<1);
  S.shake*=Math.pow(.02,dt);
}
/* riposte after a clean series, in every phase (rule of Ember Bridge): dur = length of the Watcher's counter, hitAt = moment
   the boss is hit (s, internal phase number: 1 the King, 2 the Voice, 3 the Lighthouse); next = pause before the next series */
const R_CNT={1:{dur:1.05,hitAt:.42},2:{dur:1.05,hitAt:.4},3:{dur:.95,hitAt:.32},next:1.45,nextFail:.95};
/* a press dodges a reflection only if it was aimed at it: closer to it than to any real attack still to come */
function aimedAt(f){const a=S.pl.at,d=Math.abs(a-f.ti);return!S.threats.some(o=>!o.done&&o!==f&&o.real!==false&&!o.hold&&o.ti!=null&&Math.abs(a-o.ti)<d)}
function closePat(){
  const p=S.pat;S.pat=null;
  if(p.ok){
    const allPerf=p.nReal>=2&&p.perf>=p.nReal,c=R_CNT[S.phase];
    S.cnt={t:gt,dmg:allPerf?2:1,dur:c.dur,hitAt:c.hitAt,k:S.phase};S.nextAt=gt+R_CNT.next;play('counter');counterFx();
    say(S.phase===1?_('Series blocked. The Watcher counters.','Série bloquée. Le Veilleur riposte.'):S.phase===2?_('Volley dodged. The Watcher sends the light back.','Volée esquivée. Le Veilleur renvoie la lumière.'):_('Attacks countered. The Watcher sends the lightning back.','Attaques contrées. Le Veilleur renvoie la foudre.'));
  }else S.nextAt=gt+R_CNT.nextFail;
}

/* ---------- boss animation helpers ---------- */
function curAct(kinds,tail){let best=null;for(const th of S.threats){if(!kinds.includes(th.k)||th.t0>gt)continue;const end=(th.k==='toll'?th.tw:th.ti)+tail;if(gt>end)continue;if(!best||th.t0>best.t0||(th.t0===best.t0&&Math.abs(gt-th.ti)<Math.abs(gt-best.ti)))best=th}return best}

const ARM_REST=1.62,ARM_BACK=-1.9,BACK_DIR=2.11,TWO_PI=Math.PI*2;
/* the anchor lying in the hold before the King arrives (shaft from the ring at x ~ 638 to the crown near the Watcher) */
const ANCHOR_FLOOR={x:600,y:GY-40,a:Math.PI-.08};
function anim1raw(){
  const r={lunge:0,armA:ARM_REST+Math.sin(rt*1.3)*.04,clap:BACK_DIR,onBack:true,chain:null,toll:0,coil:0,larm:0};
  const th=curAct(['slam','sweep','chain','toll'],.75);
  if(!th||S.mode!=='play')return r;
  const p=clamp((gt-th.t0)/(th.ti-th.t0),0,1),af=gt-th.ti;
  if(th.k==='slam'||th.k==='sweep'){
    const slam=th.k==='slam',gEnd=slam?.18:.2,wEnd=slam?.72:.65;
    if(af<0&&p<gEnd){const e=eio(p/gEnd);r.armA=lerp(ARM_REST,ARM_BACK,e);return r}
    r.onBack=false;
    if(af<0&&p<wEnd){const e=eio((p-gEnd)/(wEnd-gEnd));
      if(slam){r.armA=lerp(ARM_BACK,-1.3,e);r.clap=lerp(BACK_DIR,-1.3,e);r.lunge=-30*e}
      else{r.armA=lerp(ARM_BACK,.1,e);r.clap=lerp(BACK_DIR,.1,e);r.lunge=20*e}
      return r}
    if(af<0){const e=ein((p-wEnd)/(1-wEnd));
      if(slam){r.armA=r.clap=lerp(-1.3,-3.5,e);r.lunge=lerp(-30,-175,e)}
      else{r.armA=r.clap=lerp(.1,2.7,e);r.lunge=lerp(20,-165,e)}
      return r}
    const hold=.22,ret=.5,e=eio(clamp((af-hold)/ret,0,1));
    if(af>hold+ret){r.onBack=true;r.armA=lerp(ARM_BACK,ARM_REST,clamp((af-hold-ret)/.2,0,1));return r}
    if(slam){r.armA=lerp(-3.5,ARM_BACK,e);r.clap=lerp(-3.5,BACK_DIR-TWO_PI,e);r.lunge=lerp(-175,0,e)}
    else{r.armA=lerp(2.7,ARM_BACK+TWO_PI,e);r.clap=lerp(2.7,BACK_DIR,e);r.lunge=lerp(-165,0,e)}
    return r;
  }
  if(th.k==='chain'){
    r.lunge=-50;r.coil=1;r.larm=1;
    let near=null;for(const c of S.threats)if(c.k==='chain'&&c.t0===th.t0&&gt>=c.ti-.2&&gt<=c.ti+.12){near=c;break}
    if(near){const k=gt<near.ti?eout(1-(near.ti-gt)/.2):1-(gt-near.ti)/.12;r.chain={k:clamp(k,0,1),ok:near.res==='ok'}}
    if(af>.3){const e=clamp((af-.3)/.4,0,1);r.lunge=lerp(-50,0,e);r.larm=1-e}
    return r;
  }
  if(th.k==='toll'){const q=clamp((gt-th.t0)/(th.tw-th.t0),0,1);r.toll=gt<th.tw?q:Math.max(0,1-(gt-th.tw)/.5)}
  return r;
}

/* ---------- drawing primitives ---------- */
function ell(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
function chainLinks(x0,y0,x1,y1,sag,col){
  const n=Math.max(4,Math.round(Math.hypot(x1-x0,y1-y0)/11));ctx.strokeStyle=col;ctx.lineWidth=3.2;
  for(let i=0;i<n;i++){const t=(i+.5)/n,x=lerp(x0,x1,t),y=lerp(y0,y1,t)+Math.sin(t*Math.PI)*sag;const a=Math.atan2(y1-y0,x1-x0);ctx.save();ctx.translate(x,y);ctx.rotate(a+(i%2?Math.PI/2*.0:0));ctx.beginPath();if(i%2)ctx.ellipse(0,0,6.5,2.2,0,0,Math.PI*2);else ctx.ellipse(0,0,6.5,4.2,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
}

   and the Skip button; then the title shot (no caption). Shots: A the coast in the mist, B the dark Lighthouse out at sea,
   C the beach with the boats that no longer go out, D the Lighthouse's top, a faint glimmer up there; E (title) the
   Watcher comes onto the shore. */

      else{const d=gt-th.okT,hold=th.res==='hit'?.5:0,k=eio(clamp((d-hold)/.8,0,1)),from=th.res==='ok'?{x:hov.x+70,y:hov.y-30}:grd;
        q={x:lerp(from.x,o.x,k),y:lerp(from.y,o.y,k),r:lerp(0,Math.PI,k),z:2,sc:lerp(2.3,1,k)};

    ctx.globalAlpha=a;glow(x,y,rr*2.2,'rgba(110,235,255,.9)',.6);ctx.strokeStyle='#eafcff';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y,rr,rr*.55,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(110,235,255,.8)';ctx.lineWidth=8;ctx.globalAlpha=a*.4;ctx.stroke();ctx.globalAlpha=1}

    else{ctx.strokeStyle=`rgba(255,200,120,${.8*(1-e[3])})`;ctx.lineWidth=3;for(let i=0;i<3;i++){const r=30+((e[3]*90+i*30)%90);ctx.beginPath();ctx.arc(e[1],e[2],r,Math.PI*.15,Math.PI*.85,true);ctx.stroke()}}}
  ctx.restore();
  if(trapQ){const q=trapQ;S.post=()=>{ctx.save();ctx.globalAlpha=.9;tent(J.x,J.y,(J.x+q.x)/2,J.y-60,(J.x+q.x)/2,q.y-140,q.x,q.y-120,3,.8);ctx.restore();ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.scale(q.sc,q.sc);PDRAW.head(.85);ctx.restore()}}

/* ---------- flow ---------- */
let lastCard=null;
function setTheme(id){if($('optMus').checked)MUSIC.play(id);else MUSIC.stop()}
/* cards of the series (LB.card, declarative): kept in lastCard so that « Resume » from the menu shows it again */
function showCard(o){lastCard=o;LB.card.show(o)}

function playCine(id,k,cb){
  MUSIC.stop();S.phase=id;resetCine(S);S.parts=[];S.pops=[];S.cine={k,t0:gt};S.cineCb=cb;S.mode='cine';S.paused=false;
  S.tfBurst=S.tfFlash=S.tfAnch=false;S.tfId=(S.tfId||0)+1;S.flashT=-9;S.shake=0;
  hideCard();hud();if($('optMus').checked)MUSIC.bed(id);$('skip').hidden=false;

function endCine(){if(S.mode!=='cine')return;const cb=S.cineCb;S.cineCb=null;resetCine(S);MUSIC.bedStop();$('skip').hidden=true;S.mode='card';cb&&cb()}
/* intro and outro in the series frame (LB.cine, shared/js/24-cine.js): the chapter draws the shot in the module's canvas
   (ctx swapped for the draw), the module draws the frame (cartons, fades, caption, Skip). Game time (gt, particles) runs
   with the game loop as before; only when the loop is stopped (menu open, replay) does it follow the module's time. */
function cineScene(fn,vig){return(p,t,lt,st,cx)=>{const g=ctx;ctx=cx;try{ctx.save();fn(t);ctx.restore();
  if(vig){const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.9);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}}finally{ctx=g}}}

const PRO=LB.cine.create({key:'intro',scenes:()=>CINE_D.intro.map((d,i)=>({d,txt:()=>i<4?PCAP_TXT()[i]:'',draw:cineScene(drawPrologue,true)})),
  onTick:t=>{if(!$('menu').hidden)gt=S.proT0+t}});   // menu open (replay): the game loop is stopped, game time follows the module's
function playPrologue(cb){MUSIC.stop();S.mode='prologue';S.proT0=gt;S.cineDone={};S.parts=[];S.pops=[];S.proCb=cb;hideCard();if($('optMus').checked)MUSIC.bed(2);$('skip').hidden=true;$('hdEye').textContent='Prologue';PRO.play(endPrologue)}
function endPrologue(){if(S.mode!=='prologue')return;const cb=S.proCb;S.proCb=null;MUSIC.bedStop();$('skip').hidden=true;S.mode='card';cb&&cb()}
/* replay from the menu (button ▶ Intro, as in Chapter I): the prologue plays over the menu even if seen; the game state
   (mode, game time, particles, a paused fight) is left as it was and restored at the end */
/* replay of the epilogue from the menu (button ▶ Outro, after the true ending, as in Chapter I): over the menu, game state kept */
function replayEpilogue(cb){if(EPI.playing())return;const keep={gt,t0:S.epT0,parts:S.parts,pops:S.pops,done:S.cineDone,shake:S.shake};
  S.epT0=gt;S.parts=[];S.pops=[];S.cineDone={};MUSIC.stop();MUSIC.bedStop();setTheme(4);
  EPI.replay(()=>{gt=keep.gt;S.epT0=keep.t0;S.parts=keep.parts;S.pops=keep.pops;S.cineDone=keep.done;S.shake=keep.shake;if(!$('menu').hidden)setTheme(4);cb&&cb()})}
function replayPrologue(cb){if(PRO.playing())return;const keep={gt,t0:S.proT0,parts:S.parts,pops:S.pops,done:S.cineDone};
  S.proT0=gt;S.parts=[];S.pops=[];S.cineDone={};MUSIC.stop();if($('optMus').checked)MUSIC.bed(2);
  PRO.replay(()=>{gt=keep.gt;S.proT0=keep.t0;S.parts=keep.parts;S.pops=keep.pops;S.cineDone=keep.done;MUSIC.bedStop();if(!$('menu').hidden)setTheme(4);cb&&cb()})}
function resetPhaseState(){Object.assign(S,{angerShown:false,rageN:0,rageNext:0,roarT:-9,roarD:0,finalDone:false,hide:null,walkLegs:null,bodyBob:0,threats:[],pat:null,cnt:null,koShown:false,koBurst:false,deadShown:false,broken:0,ecPhi:0,holding:false,pl:newPl(),post:null,rust:null,still:0,hitstop:0,flashHit:0,recoil:0,rings:[],bossHurtT:null})}
function enterPhase(id,o){o=o||{};
  S.phase=id;S.form=1;S.bossMax=S.d.boss;S.bossHp=S.bossMax;if(o.first||S.d.heal===true)S.hp=S.hpMax;else if(S.d.heal)S.hp=Math.min(S.hpMax,S.hp+S.d.heal);   // heal true = full refill; a number = that many HP, capped at the starting HP (trial: +1)

  hud();playCine(id,'in',()=>introCard(id));
}
function introCard(id){S.mode='card';const P=PH[id];showCard({eye:P.eye(),title:P.boss(),desc:P.desc(),go:_('Start','Commencer'),onGo:beginPlay})}
function beginPlay(){hideCard();S.mode='play';S.paused=false;S.nextAt=gt+1.1;setTheme(S.phase);try{$('ward').focus({preventScroll:true})}catch(e){};hud();say(PH[S.phase].head())}
function phaseCleared(){
  MUSIC.stop();const id=S.phase;
  if(id===3&&S.form===1){playCine(3,'p2',()=>{S.form=2;S.bossHp=S.bossMax;resetPhaseState();hud();beginPlay()});return}
  LB.store.set(LB.key('unl'),String(Math.max(+LB.store.get(LB.key('unl'),1),Math.min(3,gpOf(id)+1))));
  if(id===3){playCine(3,'out',()=>clearedCard(3));return}
  playCine(id,'out',()=>clearedCard(id));
}
function clearedCard(id){S.mode='card';S.still=id;const next=ORDER[gpOf(id)];
  showCard({eye:[null,_('Phase II cleared','Phase II terminée'),_('Phase I cleared','Phase I terminée'),_('Phase III cleared','Phase III terminée')][id],title:PH[id].boss(),desc:PH[id].end(),
    go:_('Continue','Continuer'),onGo:id===3?()=>playEpilogue(victory):()=>enterPhase(next),go2:id===3?null:_('Menu','Menu'),onGo2:showMenu});
}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
function victory(){S.mode='won';if(MUSIC.cur!==4)setTheme(4);
  LB.store.set(LB.key('end'),'1');LB.menu.update();   // true ending seen (lb-ch2-end): « ▶ Outro » in the menu, Trial opened if TRIAL_OPEN is false
  const t=S.runT,key=LB.key('best-'+S.dk),rec=+LB.store.get(key,0);let isRec=false;
  if(S.full&&(!rec||t<rec)){LB.store.set(key,String(t));isRec=true}
  const best=S.full?(isRec?t:rec):rec;
  showCard({eye:_('Victory','Victoire')+' · '+S.d[LB.lang.cur],title:_('Chapter II · Silent Bells','Chapitre II · Silent Bells'),
    table:[[_('Time','Temps'),fmt(t)],[_('Hits taken','Coups reçus'),S.hits],[_('Perfects','Parfaits'),S.perfects],[_('Best','Record'),best?fmt(best):'—',true]],
    desc:(isRec?_('New record. ','Nouveau record. '):'')+(S.full?'':_('Records only count for runs started from the beginning.','Le record ne compte que pour une partie lancée depuis le début.')),
    go:_('Play again','Rejouer'),onGo:()=>startRun(S.dk),go2:_('Menu','Menu'),onGo2:showMenu});
}
function deathCard(){MUSIC.stop();const tr=S.d.trial;
  const o={eye:_('Defeat','Défaite'),title:_('The Watcher is down.','Le Veilleur est à terre.'),
    desc:tr?_('Trial: one fall sends you back to Phase I.','Épreuve : une chute te renvoie à la phase I.'):'',
    go:tr?_('Restart','Recommencer'):_('Retry phase','Réessayer la phase'),onGo:()=>tr?startRun(S.dk,true):retryPhase(),go2:_('Menu','Menu'),onGo2:showMenu};
  // Easy: on the 3rd defeat without help, the card offers to enable it (LB.help, decision 3 of 28 October), in place of Menu
  if(!tr&&LB.help.defeat(S.dk==='easy')){o.go2=LB.helpOffer();o.onGo2=()=>{LB.help.enable();retryPhase()}}

/* retry: from the start of the phase; in phase III that is form I, even after a defeat in form II (as in Ember Bridge) */
function retryPhase(){S.hp=S.hpMax;S.bossHp=S.bossMax;resetPhaseState();S.form=1;S.mode='card';hud();beginPlay()}
function startRun(dk,noPro){
  S=fresh(dk);S.full=true;S.phase=2;S.form=1;S.cineDone={};
  hideMenu();hud();
  if(noPro||PRO.seen())enterPhase(2,{first:true});else playPrologue(()=>enterPhase(2,{first:true}));
}
function jumpPhase(gp){if(S.d.trial||S.mode==='menu')return;const id=ORDER[gp-1],dk=S.dk;$('pause').hidden=true;S=fresh(dk);S.full=false;S.cineDone={};enterPhase(id,{first:true})}
function showMenu(){
  const wasPlay=S.mode==='play';if(wasPlay)S.paused=true;
  if(S.mode==='cine'||S.mode==='prologue'||S.mode==='epilogue'||S.mode==='won'||S.mode==='dead'){S.mode='menu';lastCard=null}
  const resume=wasPlay||(S.mode==='card'&&!!lastCard);
  hideCard();LB.pause.hide();$('skip').hidden=true;LB.menu.show(resume);
  MUSIC.bedStop();setTheme(4);
}
function hideMenu(){LB.menu.hide()}
function setPause(p){if(S.mode!=='play')return;S.paused=p;if(p){up();MUSIC.stop();LB.pause.show()}else{LB.pause.hide();setTheme(S.phase)}}

   forest: its caption is tinted with Chapter III's colour (CH_COL[3]). No glow under the waves any more (revisions of

const ECAP_TXT=()=>[_('By morning, the Drowned Lighthouse still stands, mute. Its bell will never ring again.','Au matin, le Phare Noyé se dresse encore, muet. Sa cloche ne résonnera plus.'),

    const z=4.2+.35*eio(clamp(ts/4,0,1));ctx.save();ctx.translate(W/2,372);ctx.scale(z,z);ctx.rotate(-.12);pHead(.85,bellMarks());ctx.restore();
    glow(W/2+60,200,160,'rgba(255,210,160,.6)',.18+.08*Math.sin(t*1.3))}
  else if(shot===2){ // the valley of Chapter I: the earth does not stop trembling, one tower goes dark, the others falter
    if(ts<3.9)S.shake=Math.max(S.shake||0,2+3*Math.abs(Math.sin(t*3)));
    const sx=(Math.random()-.5)*(S.shake||0),sy=(Math.random()-.5)*(S.shake||0);ctx.translate(sx,sy);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0c14');g.addColorStop(.7,'#1e1c22');g.addColorStop(1,'#120e0c');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
    ctx.fillStyle='#0d0f14';ctx.beginPath();ctx.moveTo(-20,330);[[120,220],[260,280],[420,190],[560,260],[720,200],[880,270],[980,240]].forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(980,H);ctx.lineTo(-20,H);ctx.fill();
    ctx.fillStyle='#14120f';ctx.beginPath();ctx.moveTo(-20,H);ctx.lineTo(-20,400);ctx.quadraticCurveTo(480,360,980,410);ctx.lineTo(980,H);ctx.fill();
    // the stone bridge of Chapter I, small, down in the valley
    ctx.fillStyle='#0a0908';ctx.fillRect(380,384,200,10);for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(390+i*64,394);ctx.quadraticCurveTo(422+i*64,372,454+i*64,394);ctx.lineTo(454+i*64,410);ctx.lineTo(390+i*64,410);ctx.fill()}
    VTOW.forEach(([x,h],i)=>{const base=i%2?330:300,top=base-h,sway=Math.sin(t*9+i)*1.5;ctx.fillStyle='#08090c';ctx.beginPath();ctx.moveTo(x-9,base);ctx.lineTo(x-5+sway,top);ctx.lineTo(x+5+sway,top);ctx.lineTo(x+9,base);ctx.closePath();ctx.fill();
      let a;if(i===TOWER_OUT)a=t<EPI_DARK?.9:Math.max(0,.9-(t-EPI_DARK)/.8)*(Math.sin(t*40)>0?1:.3);else a=.55+.35*Math.sin(t*(5+i)+i*2)*Math.sin(t*13+i);
      if(a>0){ctx.save();ctx.globalCompositeOperation='lighter';glow(x+sway,top-6,34,i===0?'rgba(255,170,90,.9)':'rgba(230,225,200,.9)',a);ell(x+sway,top-6,2.5,3,`rgba(255,250,235,${a})`);ctx.restore()}});
    for(const c of VCRACKS){const k=clamp((t-c.t0)/.6,0,1);if(k<=0)continue;const n=Math.max(2,Math.ceil(c.pts.length*k));ctx.strokeStyle='#020202';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<n;i++)i?ctx.lineTo(c.pts[i][0],c.pts[i][1]):ctx.moveTo(c.pts[i][0],c.pts[i][1]);ctx.stroke();
      if(k<1&&Math.random()<.5)burst(c.pts[n-1][0],c.pts[n-1][1],2,'#6a5a48',3,.6,.3)}}
  else{ // the forest: a Bound Spire among the trees, its light failing; the title of the next chapter
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05070a');g.addColorStop(1,'#0b0e0a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const P=SPIRE,dim=lerp(P.a0,P.a1,eio(clamp(ts/P.fade,0,1))),fl=dim*Math.max(.15,.75+.25*Math.sin(t*7)*Math.sin(t*3.1)-(Math.sin(t*2.3)>.92?.6:0));
    const light=()=>{const sg=ctx.createLinearGradient(P.x-16,0,P.x+16,0);sg.addColorStop(0,'#0c110c');sg.addColorStop(.45,'#263022');sg.addColorStop(1,'#0a0e0a');ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(P.x-16,H);ctx.lineTo(P.x-7,P.top+18);ctx.lineTo(P.x,P.top);ctx.lineTo(P.x+7,P.top+18);ctx.lineTo(P.x+16,H);ctx.closePath();ctx.fill();
      ctx.save();ctx.globalCompositeOperation='lighter';glow(P.x,P.top+8,130,'rgba(185,207,90,.9)',.55*fl);ell(P.x,P.top+8,3,4,`rgba(240,245,210,${.9*fl})`);ctx.restore()};
    const R=mulberry(616);for(let layer=0;layer<3;layer++){if(layer===1)light();ctx.fillStyle=['#0b0f0c','#070a08','#030504'][layer];for(let i=0;i<8;i++){const x=R()*W,w=10+layer*12+R()*14;if(layer&&Math.abs(x-P.x)<40)continue;  // the Spire stays visible between the near trunks
      ctx.fillRect(x-w/2,0,w,H);ctx.beginPath();ctx.moveTo(x-w/2,H-60);ctx.quadraticCurveTo(x-w*1.6,H-10,x-w*2,H);ctx.lineTo(x+w*2,H);ctx.quadraticCurveTo(x+w*1.6,H-10,x+w/2,H-60);ctx.fill()}}
    mist(420,4,.08,6);
    nextTitle(t-EPI_TITLE)}   // title of the next chapter over the forest (layout of Chapter I's last card)
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';for(const p of S.parts){const q=gt-p.t0,k=1-q/p.life;ctx.globalAlpha=k;ctx.fillStyle=p.c;ctx.fillRect(p.x+p.vx*q*30,p.y+p.vy*q*30+p.g*q*q*300,p.r,p.r)}ctx.restore();
  EFXL.forEach((c,i)=>{if(t>=c[0]&&once('efx'+i))MUSIC.fx(c[1])});
}
/* the epilogue in the series frame; no "seen" flag: it follows the victory every time */
const EPI=LB.cine.create({scenes:()=>CINE_D.outro.map((d,i)=>({d,txt:()=>ECAP_TXT()[i],col:i===4?CH_COL[3]:'',draw:cineScene(drawEpilogue)})),
  onTick:t=>{if(!$('menu').hidden)gt=S.epT0+t}});
function playEpilogue(cb){MUSIC.stop();MUSIC.bedStop();S.mode='epilogue';S.epT0=gt;S.cineDone={};S.parts=[];S.pops=[];S.epCb=cb;resetCine(S);S.cineDone={};hideCard();setTheme(4);$('skip').hidden=true;$('hdEye').textContent=_('Epilogue','Épilogue');EPI.play(endEpilogue)}
function endEpilogue(){if(S.mode!=='epilogue')return;const cb=S.epCb;S.epCb=null;$('skip').hidden=true;S.mode='card';cb&&cb()}


/* ---------- combat sound effects: wind-ups, releases and impacts ---------- */
const SFX_START={wave:'rumble',rafter:'fallWhine',kwave:'swell',sring:'bellSoft',slam:'draw',sweep:'draw',chain:'chainSlip',stomp:'rumble',rock:'fallWhine',shard:'glints',wail:'voice',back:'swell',beam:'beam',lbeam:'beam',bolt:'charge',spike:'iceCrack',ring:'bellSoft',moon:'chainSlip',trap:'swell',burst:'overload',reform:'clank',implode:'overload'};
const SFX_MID={sring:'whoosh',orb:'throw',toll:'tollLast',ring:'whoosh',trap:'whooshDown',chunk:'clank',shard:'whoosh',sweep:'whoosh',slam:'whoosh'};
const SFX_HIT={wave:'plant',sring:'clank',slam:'slam',sweep:'plant',chain:'clank',bolt:'thunder',spike:'crackGlass',ring:'clank',hpBack:'clank'};
function combatSfx(){
  if(S.mode!=='play'||S.paused)return;
  for(const th of S.threats){
    if(!th.a0&&gt>=th.t0){th.a0=1;const n=SFX_START[th.k];if(n&&th.real!==false)MUSIC.fx(n)}
    const mt=th.k==='toll'?th.tw:(th.k==='slam'||th.k==='sweep')?th.ti-.3:th.tl;
    if(mt!=null&&!th.a1&&gt>=mt){th.a1=1;const n=SFX_MID[th.k];if(n)MUSIC.fx(n)}
    if(!th.hold&&th.ti!=null&&!th.a2&&gt>=th.ti&&th.real!==false){th.a2=1;const n=SFX_HIT[th.k];if(n)MUSIC.fx(n)}
  }
}
function counterFx(){MUSIC.fx([null,'impactLight','throw','thunder'][S.phase])}

/* ---------- per-frame game logic on top of the engine ---------- */
function gameUpdate(dt){
  if(S.mode==='cine'&&S.cine&&gt-S.cine.t0>=CINE_LEN[S.phase][S.cine.k])endCine();
  combatSfx();
  // phase I: the muffled bell under the hatch
  if(S.phase===2&&(S.mode==='play'||(S.mode==='cine'&&S.cine&&S.cine.k==='in'))&&!S.paused){if(!S.hatchRing||gt-S.hatchRing>HATCH.toll){S.hatchRing=gt;MUSIC.fx('bellMuffled')}}
  if(S.phase===3&&S.form===2&&(S.mode==='play'||S.mode==='ko')&&!S.paused){
    S.ecPhi+=(S.bossHp<=S.bossMax/2?1.05:.7)*dt;
  }
  if(S.mode==='ko'&&!S.koShown&&gt>S.koT+.45){S.koShown=true;phaseCleared()}
}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=LB.lang.cur;   // menu, start screen, pause: LB.menu.lang (texts in CHAPTER, 02-core.js, and shared/js/28-ui.js)
  $('retryBtn').textContent=_('Retry','Réessayer');$('skip').textContent=_('Skip ›','Passer ›');
  $('hint').textContent=_("Space, up arrow or tap the screen · P pause · R retry · Enter to skip","Espace, flèche haut ou toucher l'écran · P pause · R réessayer · Entrée pour passer");
  $('lHelp').textContent=_('Visual help','Aide visuelle');$('lSnd').textContent=_('Sound','Son');$('lMus').textContent=_('Music','Musique');
  hud();if(S.mode==='prologue')$('hdEye').textContent='Prologue';
}

/* ---------- events ---------- */
const ward=$('ward'),cvm=$('c'),ctxMain=cvm.getContext('2d');let SCm=1;
function fitMain(){const r=cvm.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cvm.width=Math.max(1,Math.round(r.width*d));cvm.height=Math.max(1,Math.round(r.height*d));SCm=cvm.width/W}
new ResizeObserver(fitMain).observe($('stage'));fitMain();
function skip(){if(S.mode==='prologue'||S.mode==='epilogue')LB.cine.skip();else if(S.mode==='cine')endCine()}
$('skip').addEventListener('click',skip);
/* inputs of the series (LB.input, shared/js/28-ui.js): Space, up arrow, W, Z, touching the arena or the action button, released
   for all; P / Escape pause; R retry; Enter / Space on a card, the pause and the menu (Normal). This chapter's phase cinematics
   (S.mode 'cine') take every key: Enter / Escape skip (the prologue and the epilogue are LB.cine's). */
function retryKey(){if(S.mode!=='play'&&S.mode!=='dead')return;LB.pause.hide();S.d.trial?startRun(S.dk,true):retryPhase()}
LB.input.bind({press:down,release:up,pause:()=>{if(S.mode==='play')setPause(!S.paused)},retry:retryKey,
  skip:e=>{if(S.mode!=='cine')return false;const k=e.key;if(k==='Enter'||k==='Escape'){e.preventDefault();skip()}else if(LB.input.ACT.includes(k))e.preventDefault();return true}});
window.addEventListener('blur',()=>{if(S.mode==='play')setPause(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S.mode==='play')setPause(true);MUSIC.stop();MUSIC.bedStop()}else if(!$('menu').hidden)setTheme(4)});
$('go').addEventListener('click',()=>ensureAudio());
LB.pause.bind({onResume:()=>setPause(false),onMenu:showMenu});
$('pauseBtn').addEventListener('click',()=>{if(S.mode==='play')setPause(!S.paused)});
$('retryBtn').addEventListener('click',retryKey);
$('menuBtn').addEventListener('click',e=>{showMenu();e.currentTarget.blur()});
document.querySelectorAll('#phases button').forEach(b=>b.addEventListener('click',()=>jumpPhase(+b.dataset.ph)));
LB.help.mount();$('optSnd').checked=LB.audio.sound;$('optMus').checked=LB.audio.music;   // help: LB.help (lb-help, unticked by default)
function syncAudio(){LB.audio.setSound($('optSnd').checked);LB.audio.setMusic($('optMus').checked);MUSIC.setMus($('optMus').checked);
  if($('optMus').checked){if(!$('menu').hidden)setTheme(4);else if(S.mode==='play'&&!S.paused)setTheme(S.phase)}}
['optHelp','optSnd','optMus'].forEach(id=>{const el=$(id);el.addEventListener('change',()=>{if(id!=='optHelp')syncAudio();el.blur()})});
// menu music starts on the first interaction (browsers block sound before that)
document.addEventListener('pointerdown',()=>{if(!$('menu').hidden&&MUSIC.cur!==4)setTheme(4)});
document.addEventListener('keydown',()=>{if(!$('menu').hidden&&MUSIC.cur!==4)setTheme(4)});

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;rt+=dt;
  if(!$('menu').hidden)return;
  if(!S.paused&&['play','ko','dead','cine','prologue','epilogue'].includes(S.mode))gt+=dt;
  ctx=ctxMain;SC=SCm;
  update(dt);gameUpdate(dt);draw();
}
/* the menu of the series (LB.menu, shared/js/28-ui.js) around this chapter's scene (page/body.html): sea spray, ▶ Intro, ▶ Outro
   (after the true ending), fullscreen, languages, difficulties, Trial by Water; the start screen (LB.gate: its click unlocks the
   sound and starts the menu music). The spray draws Math.random here, where the old particles did. */
LB.menu.mount(CHAPTER,{
  onDiff:dk=>{ensureAudio();LB.help.use(DIFFS[dk]);startRun(dk)},
  onResume:()=>{hideMenu();MUSIC.stop();if(S.mode==='play')setPause(false);else if(S.mode==='card'&&lastCard)showCard(lastCard)},
  onIntro:()=>{ensureAudio();replayPrologue()},onOutro:()=>{ensureAudio();replayEpilogue()},onLang:()=>applyLang(),
  onStart:()=>{if(!$('menu').hidden&&MUSIC.cur!==4)setTheme(4)}});
LB.menu.show(false);LB.gate.focus();
S.d=DIFFS.normal;S.phase=2;applyLang();requestAnimationFrame(loop);

})();
</script>
