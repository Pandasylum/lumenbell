<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silent Bells</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the Ember Bridge shell, one centered column: header with the phase track, two health bars,
   the 16:9 arena, then the single action button. The accent follows the boss:
   mirror violet (gallery), rust bronze (foundry), aurora teal (frozen lake). Single dark look by choice. */
:root{
  --bg:#0a0c10;--panel:#141820;--line:#2a303c;--fg:#ece6dc;--muted:#9d988f;
  --acc:#b48cff;--acc2:#e2d2ff;--ward:#7fd6ff;--ink:#0f0820;--teal:#4fe0cc;
  --font-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body[data-ph="1"]{--acc:#d98a3a;--acc2:#ffc77a;--ink:#140b04}
body[data-ph="3"]{--acc:#4fe0cc;--acc2:#b8fff4;--ink:#02120f}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:960px;width:100%;margin:0 auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:.95;letter-spacing:.01em}
.hright{display:flex;align-items:center;gap:10px}
.phases{display:flex;gap:6px;margin:0;padding:0;list-style:none;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em}
.phases li{border:1px solid var(--line);color:var(--muted)}
.phases button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:5px 12px;cursor:pointer;min-width:38px}
.phases button:disabled{opacity:.4;cursor:not-allowed}
.phases li:not(.on) button:hover:not(:disabled){color:var(--fg);background:rgba(255,255,255,.06)}
.phases li.on{border-color:var(--acc);color:var(--ink);background:var(--acc)}
.mbtn{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.mbtn:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.bar{display:grid;gap:5px;min-width:0}
.bar span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar span i{font-style:normal}
.bar.boss{text-align:right}
.bar span b{margin-left:4px;color:var(--fg);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px}
.pips span{flex:1;height:12px;background:#07090c;border:1px solid var(--line)}
.pips span.on{background:var(--ward);border-color:var(--ward)}
.bar.boss .pips span.on{background:var(--acc);border-color:var(--acc)}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border:1px solid var(--line);background:#06080b;overflow:hidden;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:100%}
.skip{position:absolute;right:12px;bottom:12px;z-index:5;font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;background:rgba(6,8,12,.6);color:var(--fg);border:1px solid rgba(236,230,220,.35);cursor:pointer}
.skip:hover{background:rgba(255,255,255,.12)}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:12px;background:rgba(6,8,12,.72);overflow:auto}
.card{max-width:480px;display:grid;gap:10px;justify-items:start;padding:20px 22px;background:var(--panel);border:1px solid var(--line)}
.card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .how2{color:var(--fg);font-size:13px;border-left:3px solid var(--acc);padding-left:10px}
.rtab{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 14px;width:100%;margin:2px 0 4px}
.rtab div{display:flex;flex-direction:column;gap:1px}
.rtab small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rtab b{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.rtab .rec b{color:var(--acc)}
.brow{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border:0;padding:10px 20px;background:var(--acc);color:var(--ink)}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:none;color:var(--acc);border:2px solid var(--acc)}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.ward{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;min-width:230px;height:56px;padding:0 22px;background:rgba(127,214,255,.1);color:var(--ward);border:2px solid var(--ward);touch-action:none}
.ward.down{background:rgba(127,214,255,.32)}
.mrow{display:flex;gap:8px;align-items:center}
.hint{margin:0;color:var(--muted);font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Home menu: same look as Ember Bridge's title screen, cold instead of molten */
.ov.menu{position:fixed;inset:0;z-index:50;padding:24px;background:radial-gradient(ellipse 80% 70% at 50% 110%,rgba(79,224,204,.3),transparent 62%),#04070b;place-items:center}
.mscene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mscene .eye{animation:mblink 5s infinite}
.mscene .lava{animation:mglow 3.2s ease-in-out infinite alternate}
.mscene .orb{animation:mglow 2.4s ease-in-out infinite alternate}
.mscene .aur{animation:mglow 6s ease-in-out infinite alternate}
.mscene .aur2{animation:mglow 8s ease-in-out infinite alternate-reverse}
.mscene .beam{transform-origin:715px 200px;animation:msweep 7s ease-in-out infinite alternate}
.mscene .tent{animation:mglow 2.4s ease-in-out infinite alternate}
.mem-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.msn{position:absolute;top:-10px;width:3px;height:3px;border-radius:50%;background:#e8f8ff;box-shadow:0 0 6px 1px rgba(159,242,255,.6);opacity:0;pointer-events:none;animation:mfall linear infinite}
@keyframes mfall{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}100%{transform:translate(var(--dx),90vh);opacity:0}}
@keyframes mglow{from{opacity:.5}to{opacity:1}}
@keyframes mblink{0%,92%,100%{opacity:1}95%{opacity:.15}}
@keyframes msweep{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
@media (prefers-reduced-motion:reduce){.msn,.mscene *{animation:none!important}.msn{display:none}}
/* Portrait: the scene sits in the upper half, framed on the Watcher and the tower; the title and choices below it */
@media (orientation:portrait) and (max-aspect-ratio:10/11){
  .ov.menu{place-items:end center;padding-bottom:max(28px,env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse 90% 40% at 50% 100%,rgba(79,224,204,.22),transparent 70%),linear-gradient(#03070c 0,#03070c 46%,#03080b 52%,#061417 100%)}
  .mscene{top:3%;height:43%}
  .ov.menu .mcard .eyebrow,.ov.menu .mcard h2,.ov.menu .mcard .sub,.ov.menu .mcard .tag{transform:none}
  .mcard{gap:10px}
}
.mcard{position:relative;z-index:1;display:grid;gap:12px;padding:8px 0;justify-items:center;text-align:center;max-width:620px}
.ov.menu .mcard .eyebrow,.ov.menu .mcard h2,.ov.menu .mcard .sub,.ov.menu .mcard .tag{transform:translateY(-9vh)}
.mcard .eyebrow{color:#9fe4ff}
.mcard h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(40px,9vw,88px);line-height:.92;letter-spacing:.01em;text-wrap:balance;color:var(--fg);text-shadow:0 0 40px rgba(79,224,204,.4)}
.mcard h2 span{color:var(--teal);text-shadow:0 0 40px rgba(79,224,204,.8)}
.mcard .sub{margin:-4px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(18px,3vw,24px);letter-spacing:.14em;text-transform:uppercase;color:#cfeee9}
.mcard .tag{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.mcard .how{margin:0;font-size:12px;color:#a8a39a;max-width:60ch}
.btn.big{font-size:24px;padding:12px 38px}
.mph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:620px}
.mph button{min-width:0;display:grid;justify-items:center;padding:8px 6px;background:rgba(10,16,22,.82);border:1px solid #2c3a44;color:var(--fg);cursor:pointer;font:inherit}
.mph button b{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1;color:var(--teal);text-transform:uppercase;letter-spacing:.05em}
.mph button span{font-size:12px;color:var(--muted)}
.mph button:hover{border-color:var(--teal);background:rgba(79,224,204,.12)}
.mfoot{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center}
.mlink{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#ffb07a;text-decoration:none;border:1px solid rgba(255,140,60,.5);padding:6px 12px;background:rgba(30,12,4,.5)}
.mlink:hover{background:rgba(255,122,43,.18);color:#ffd2a6}
.langs{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:3}
.langs button{font-family:inherit;font-weight:700;font-size:13px;line-height:1;letter-spacing:.12em;padding:7px 11px;min-width:42px;color:var(--fg);background:rgba(6,9,14,.6);border:1px solid rgba(236,230,220,.3);border-radius:4px;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--teal);background:rgba(79,224,204,.22)}
@media (prefers-reduced-motion:reduce){.btn,.mph button{transition:none}}
@media (max-width:560px){.mcard .tag,.mcard .how{display:none}.mcard h2{font-size:34px}.mcard{gap:9px}.btn.big{font-size:20px;padding:8px 26px}.card{padding:12px 14px;gap:8px}.ward{width:100%}.opts{margin-left:0}.rtab{grid-template-columns:repeat(2,1fr)}}
@media (pointer:coarse){.hint{display:none}.ward{min-height:84px;font-size:24px}.btn,.mbtn,.phases button,.skip{min-height:44px}.opts label{padding:8px 4px}.langs button{min-height:40px}}
@media (max-width:480px){body{padding-block:12px 20px}.mph{gap:6px;grid-template-columns:1fr 1fr;max-width:340px}.ov.menu{padding-top:16px}.ov:not(.menu){position:fixed;z-index:40;background:rgba(6,8,12,.92);padding:16px}}
@media (orientation:portrait) and (max-width:700px){.bars{grid-template-columns:1fr;gap:8px}.bar.boss{text-align:left}.bar span{display:flex;justify-content:space-between;white-space:nowrap}
  .controls{display:grid;grid-template-columns:1fr;gap:10px}.controls .mrow{order:2}.controls .mrow>*{flex:1}.controls .opts{order:3;margin-left:0}
  .ward{width:100%;min-width:0;height:auto;min-height:clamp(110px,17dvh,160px);font-size:clamp(28px,8vw,40px);letter-spacing:.1em}}
@media (max-height:520px) and (orientation:landscape){
  body{padding-block:6px}
  .wrap{min-height:calc(100dvh - 12px);max-width:none;grid-template-columns:minmax(0,1fr) clamp(170px,26vw,230px);grid-template-areas:"stage top" "stage bars" "stage controls";grid-template-rows:auto auto 1fr;gap:8px 12px;align-items:start}
  .top{grid-area:top;display:grid;gap:6px}.top h1,.top .eyebrow{display:none}
  .phases button{min-width:30px;padding-inline:6px;min-height:34px}
  .bars{grid-area:bars;grid-template-columns:1fr;gap:8px}.bar.boss{text-align:left}
  .stage{grid-area:stage;width:min(100%,calc((100dvh - 12px)*16/9));margin:0 auto;align-self:center}
  .controls{grid-area:controls;display:grid;gap:8px;align-self:end}.controls>*{width:100%;min-width:0}.controls .mrow{order:-1}.mrow>*{flex:1}
  .ward{min-height:84px;font-size:20px;padding:4px 6px}.hint,.opts{display:none}
  .ov:not(.menu){padding:6px}.card{padding:8px 12px;gap:4px;max-width:100%}.card h2{font-size:20px}.card p{font-size:12px;line-height:1.3}
  .mcard .tag,.mcard .how,.mcard .sub{display:none}.ov.menu .mcard .eyebrow,.ov.menu .mcard h2{transform:translateY(-4vh)}.mcard h2{font-size:clamp(30px,9vh,52px)}}
</style>
</head>
<body>

<main class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="hdEye">Prologue</p>
      <h1>Silent Bells</h1>
    </div>
    <div class="hright">
      <ol class="phases" id="phases" aria-label="Phases">
        <li class="on"><button type="button" data-ph="1" aria-label="Phase I">I</button></li><li><button type="button" data-ph="2" aria-label="Phase II">II</button></li><li><button type="button" data-ph="3" aria-label="Phase III">III</button></li>
      </ol>
      <button type="button" class="mbtn" id="menuBtn">Menu</button>
    </div>
  </header>

  <section class="bars" aria-label="Points de vie">
    <div class="bar"><span><i id="nmP">Le Veilleur</i> <b id="hpPn"></b></span><div class="pips" id="hpP"></div></div>
    <div class="bar boss"><span><i id="nmB">La Voix Creuse</i> <b id="hpBn"></b></span><div class="pips" id="hpB"></div></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="c" role="img" aria-label="Arène du combat"></canvas>
    <button type="button" class="skip" id="skip" hidden>Passer ›</button>

    <div class="ov" id="ov" hidden>
      <div class="card">
        <p class="eyebrow" id="ovEye"></p>
        <h2 id="ovTitle"></h2>
        <div class="rtab" id="ovTable" hidden></div>
        <p id="ovDesc"></p>
        <p class="how2" id="ovHow" hidden></p>
        <div class="brow">
          <button class="btn" id="go" type="button">Commencer</button>
          <button class="btn ghost" id="go2" type="button" hidden>Menu</button>
        </div>
      </div>
    </div>

    <div class="ov" id="pause" hidden>
      <div class="card">
        <p class="eyebrow">Pause</p>
        <h2 id="pTitle">Combat en pause</h2>
        <div class="brow">
          <button class="btn" id="pResume" type="button">Reprendre</button>
          <button class="btn ghost" id="pMenu" type="button">Menu</button>
        </div>
      </div>
    </div>

    <div class="ov menu" id="menu">
      <svg class="mscene" id="mScene" viewBox="0 0 960 540" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03070c"/><stop offset=".6" stop-color="#0a2027"/><stop offset="1" stop-color="#0f3c3d"/></linearGradient>
          <linearGradient id="maur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fe0cc" stop-opacity="0"/><stop offset=".55" stop-color="#4fe0cc" stop-opacity=".5"/><stop offset="1" stop-color="#4fe0cc" stop-opacity="0"/></linearGradient>
          <radialGradient id="mgl" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#4fe0cc" stop-opacity=".6"/><stop offset="1" stop-color="#4fe0cc" stop-opacity="0"/></radialGradient>
          <linearGradient id="mbeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8fbff" stop-opacity=".65"/><stop offset="1" stop-color="#6fe8ff" stop-opacity="0"/></linearGradient>
          <radialGradient id="mjel" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#f2feff"/><stop offset=".45" stop-color="#5fd8ff"/><stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="960" height="540" fill="url(#msky)"/>
        <circle cx="170" cy="110" r="34" fill="#e8f4f2" opacity=".12"/>
        <g fill="#e8f4f2" opacity=".55"><circle cx="80" cy="60" r="1.2"/><circle cx="260" cy="40" r="1"/><circle cx="420" cy="90" r="1.2"/><circle cx="640" cy="50" r="1"/><circle cx="860" cy="80" r="1.2"/><circle cx="740" cy="130" r="1"/><circle cx="330" cy="150" r=".9"/><circle cx="560" cy="120" r="1"/><circle cx="910" cy="160" r=".9"/></g>
        <path class="aur" d="M0 170 Q160 90 320 160 T640 130 T960 150 L960 240 Q800 190 640 230 T320 220 T0 250Z" fill="url(#maur)"/>
        <g opacity=".5"><path class="aur2" d="M0 120 Q200 70 380 120 T760 100 T960 110 L960 160 Q760 140 600 160 T260 150 T0 170Z" fill="url(#maur)"/></g>
        <path d="M0 400 L90 300 L160 350 L260 240 L350 340 L450 270 L560 350 L650 250 L760 340 L860 280 L960 360 L960 540 L0 540Z" fill="#0a1b20"/>
        <path d="M0 450 L120 380 L220 430 L340 360 L470 440 L600 370 L730 440 L850 380 L960 430 L960 540 L0 540Z" fill="#071318"/>
        <rect class="lava" y="400" width="960" height="140" fill="url(#mgl)"/>
        <g opacity=".14"><path d="M0 470 Q480 430 960 470 L960 540 L0 540Z" fill="#4fe0cc" class="lava"/></g>
        <!-- the beacon's sweeping beam -->
        <path class="beam" d="M715 200 L520 470 L660 470Z" fill="url(#mbeam)"/>
        <g fill="#03080b">
          <!-- ice shelf -->
          <path d="M0 455 L110 452 L180 457 L300 453 L420 458 L560 452 L700 456 L840 452 L960 456 L960 476 L880 476 L860 492 L800 492 L780 476 L560 476 L540 494 L470 494 L450 476 L210 476 L190 490 L120 490 L100 476 L0 476Z"/>
          <!-- the Watcher -->
          <path class="mw" d="M205 455 L215 392 Q205 380 213 366 Q222 354 234 366 Q242 380 232 392 L242 455Z"/>
          <path class="mw" d="M250 455 L250 330" stroke="#03080b" stroke-width="4" fill="none"/>
          <!-- the Drowned Lighthouse: the King's bells stacked into a tower -->
          <path d="M640 455 Q650 420 664 394 Q670 376 676 362 L754 362 Q760 376 766 394 Q780 420 790 455Z"/>
          <rect x="693" y="334" width="44" height="24" rx="4"/><rect x="694" y="307" width="42" height="24" rx="4"/><rect x="695" y="280" width="40" height="24" rx="4"/><rect x="696" y="253" width="38" height="24" rx="4"/>
          <path d="M700 300 L672 352 L680 356 L706 308Z M730 300 L758 352 L750 356 L724 308Z"/>
          <path d="M668 262 Q648 250 650 236 L664 236 L686 248 L686 262Z M762 262 Q782 250 780 236 L766 236 L744 248 L744 262Z"/>
          <path d="M684 206 L746 206 Q742 228 728 236 L702 236 Q688 228 684 206Z"/>
          <!-- the anchor, planted in the ice -->
          <path d="M818 455 L818 340" stroke="#03080b" stroke-width="7" fill="none"/>
          <path d="M800 352 L836 352" stroke="#03080b" stroke-width="7" fill="none"/>
          <circle cx="818" cy="330" r="9" fill="none" stroke="#03080b" stroke-width="5"/>
        </g>
        <!-- moorings -->
        <path d="M676 400 Q630 440 600 456 M754 400 Q790 430 800 456" stroke="#03080b" stroke-width="4" stroke-dasharray="6 3" fill="none"/>
        <!-- tentacles holding the pieces together -->
        <g opacity=".6"><g class="tent" fill="none" stroke="#6fe8ff" stroke-width="1.6" stroke-linecap="round">
          <path d="M702 208 Q676 260 690 330 Q684 380 668 440"/><path d="M728 208 Q754 260 740 330 Q746 380 762 440"/>
          <path d="M710 210 Q700 300 714 360"/><path d="M720 210 Q732 290 718 360"/>
          <path d="M696 206 Q660 196 640 230"/><path d="M734 206 Q770 196 790 230"/>
        </g></g>
        <!-- the jellyfish in the lantern -->
        <g opacity=".3"><circle class="orb" cx="715" cy="196" r="64" fill="url(#mjel)"/></g>
        <path class="orb" d="M683 206 Q684 168 715 164 Q746 168 747 206 Q731 200 715 206 Q699 200 683 206Z" fill="url(#mjel)"/>
        <g class="mw"><circle class="eye" cx="250" cy="326" r="7" fill="#7fd6ff"/></g>
        <g opacity=".12"><ellipse cx="715" cy="470" rx="90" ry="8" fill="#9ff2ff" class="lava"/></g>
      </svg>
      <div class="mem-wrap" id="mSnow" aria-hidden="true"></div>
      <div class="langs" id="langs" role="group" aria-label="Langue"><button type="button" data-lang="fr" aria-pressed="true">FR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
      <div class="mcard">
        <p class="eyebrow" id="mEye">Ember Bridge · Chapitre II</p>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
/* save keys: common lb-* (lb-lang, lb-snd, lb-mus, lb-help) and per chapter lb-ch2-* (unlock, records).
   Read the new key first, else the old one (pn-/db-, eb-lang from Chapter I), then write it to the new key. */
const OLD_KEYS={'lb-lang':['pn-lang','eb-lang'],'lb-snd':['db-optSnd'],'lb-mus':['db-optMus'],'lb-help':['db-optHelp'],'lb-ch2-unl':['db-unl']};
const oldKeys=k=>OLD_KEYS[k]||(k.startsWith('lb-ch2-best-')?['db-best-'+k.slice(12)]:[]);
const store={get(k,d){try{let v=localStorage.getItem(k);
  if(v==null)for(const o of oldKeys(k)){v=localStorage.getItem(o);if(v!=null){try{localStorage.setItem(k,v)}catch(e){}break}}
  return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
try{const ks=[];for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));
  Object.keys(OLD_KEYS).concat(ks.filter(o=>o.startsWith('db-best-')).map(o=>'lb-ch2-best-'+o.slice(8))).forEach(k=>store.get(k))}catch(e){}
const OPT_KEY={optSnd:'lb-snd',optMus:'lb-mus',optHelp:'lb-help'};
let LANG='fr';{const v=store.get('lb-lang',null);if(v==='fr'||v==='en')LANG=v}
const _=(en,fr)=>LANG==='fr'?fr:en;

/* ---------- constants ---------- */
const W=960,H=540,GY=430,HX=230,HY=GY-70;
const DIFFS={
  easy:{hp:8,win:.26,perf:.11,sp:.85,boss:6,heal:true,fr:'Facile',en:'Easy'},
  normal:{hp:6,win:.2,perf:.08,sp:1,boss:8,heal:true,fr:'Normal',en:'Normal'},
  hard:{hp:5,win:.155,perf:.06,sp:1.18,boss:10,heal:true,fr:'Difficile',en:'Hard'},
  tn:{hp:6,win:.2,perf:.08,sp:1,boss:8,heal:false,trial:true,fr:'Épreuve · Normal',en:'Trial · Normal'},
  th:{hp:5,win:.155,perf:.06,sp:1.18,boss:10,heal:false,trial:true,fr:'Épreuve · Difficile',en:'Trial · Hard'}
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, eout=t=>1-Math.pow(1-t,3), ein=t=>t*t*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- canvas ---------- */
let ctx=document.createElement('canvas').getContext('2d');let SC=1;const hasFilter='filter' in ctx;

/* ---------- state ---------- */
let gt=0,rt=0;
let S=fresh('normal');S.mode='menu';
function fresh(dk){const d=DIFFS[dk];return{dk,d,phase:1,mode:'card',paused:false,hp:d.hp,hpMax:d.hp,bossHp:d.boss,bossMax:d.boss,
  threats:[],pat:null,nextAt:0,cnt:null,lock:0,guardT:-9,okT:-9,hurtT:-9,whiffT:-9,dodgeT:-9,foolT:-9,holding:false,stam:1,broken:0,
  hits:0,perfects:0,runT:0,full:true,parts:[],pops:[],shake:0,bossFlash:-9,koT:0,deadT:0,deadShown:false,lastK:''}}

function say(t){$('live').textContent=t}

/* ---------- audio ---------- */
let AC=null,M,SG,MG;
function ensureAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=.75;M.connect(AC.destination);SG=AC.createGain();SG.connect(M);MG=AC.createGain();MG.gain.value=.3;MG.connect(M);applyVol()}catch(e){AC=null}}
function applyVol(){if(!AC)return;SG.gain.value=$('optSnd').checked?.9:0;MG.gain.value=$('optMus').checked?.3:0}
function tone(f,dur,type,vol,dest,when,f2){if(!AC)return;const t=when||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(dest||SG);o.start(t);o.stop(t+dur+.05)}
let NB=null;function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function noise(dur,vol,ft,ff,q,dest,when,ff2){if(!AC)return;const t=when||AC.currentTime;const s=AC.createBufferSource();s.buffer=nbuf();s.loop=true;const fl=AC.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(ff,t);if(ff2)fl.frequency.exponentialRampToValueAtTime(ff2,t+dur);fl.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(fl);fl.connect(g);g.connect(dest||SG);s.start(t);s.stop(t+dur+.05)}
const sfx={
  parry(p){tone(p?1046:880,.5,'sine',.22);tone(p?1568:1318,.35,'sine',.1);tone(2217,.2,'triangle',.05);if(p)tone(2093,.6,'sine',.07)},
  dodge(p){noise(.22,.25,'bandpass',600,2,null,null,2600);if(p)tone(1760,.25,'sine',.06)},
  hurt(){noise(.3,.4,'lowpass',700);tone(160,.35,'sawtooth',.12,null,null,60)},
  whiff(){tone(200,.08,'square',.05)},
  fool(){tone(2600,.25,'triangle',.08);tone(3150,.2,'triangle',.06);noise(.2,.12,'highpass',4000)},
  bossHit(){tone(80,.5,'sine',.4,null,null,40);noise(.25,.3,'lowpass',1200)},
  toll(){[196,392,466,587,784].forEach((f,i)=>tone(f*(1+i*.002),1.6-i*.2,'sine',[.18,.1,.06,.05,.03][i]))},
  charge(){tone(220,.8,'sawtooth',.04,null,null,880)},
  bolt(){noise(.35,.35,'highpass',1800);tone(60,.4,'sine',.25,null,null,30)},
  shield(){tone(660,.15,'sine',.05);tone(990,.15,'sine',.03)},
  counter(){tone(330,.4,'triangle',.12,null,null,990);noise(.3,.12,'bandpass',2000,3)},
  ko(){tone(110,2,'sine',.3,null,null,40);noise(1.4,.25,'lowpass',900,1,null,null,100)},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,1.2,'sine',.12,null,AC?AC.currentTime+i*.12:0))}
};
function play(k,a){if(AC&&$('optSnd').checked)sfx[k](a)}
/* music */
const MUS=[null,{bpm:84,bass:[73.4,73.4,87.3,65.4],lead:'bell'},{bpm:96,bass:[82.4,87.3,82.4,61.7],lead:'choir'},{bpm:118,bass:[55,55,65.4,49],lead:'arp'}];
let mStep=0,mNext=0;
function musTick(){
  if(!AC||!$('optMus').checked||S.mode!=='play'||S.paused)return;
  const m=MUS[S.phase],bt=60/m.bpm;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.25){
    const t=mNext,beat=mStep%16,bar=Math.floor(mStep/16)%4,root=m.bass[bar];
    if(beat%4===0){tone(90,.25,'sine',.35,MG,t,38)}
    if(beat%8===6&&S.phase>1)noise(.12,.08,'highpass',5000,1,MG,t);
    if(beat===0||beat===8)tone(root,bt*3.6,'sawtooth',.07,MG,t);
    if(m.lead==='bell'&&(beat===0||beat===10))tone(root*4,1.4,'sine',.04,MG,t);
    if(m.lead==='choir'&&beat===0){[1,1.19,1.5].forEach(r=>tone(root*4*r,bt*3.8,'triangle',.025,MG,t))}
    if(m.lead==='arp'&&beat%2===0){const r=[1,1.5,2,2.4,3,2.4,2,1.5][(beat/2)%8];tone(root*4*r,bt*.45,'sine',.03,MG,t)}
    mNext+=bt/4;mStep++;
  }
}


/* ---------- particles & pops ---------- */
function burst(x,y,n,col,spd,life,g){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(.3+Math.random())*spd;S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(g?spd*.4:0),g:g||0,t0:gt,life:life*(.6+Math.random()*.6),c:col,r:1.5+Math.random()*2.2})}}
function pop(txt,col,x,y){S.pops.push({txt,c:col,x:x||HX+10,y:y||GY-150,t0:gt})}

/* ---------- patterns ---------- */
function P1(stage,f,b){
  const T=[];let t=b;
  const slam=()=>{T.push({k:'slam',t0:t,ti:t+.95*f});t+=1.4*f};
  const sweep=()=>{T.push({k:'sweep',t0:t,ti:t+.72*f});t+=1.17*f};
  const chain=n=>{const t0=t;for(let i=0;i<n;i++)T.push({k:'chain',t0,ti:t0+.85*f+i*.4*f,i,n});t=t0+.85*f+(n-1)*.4*f+.55*f};
  const toll=()=>{T.push({k:'toll',t0:t,tw:t+.55*f,ti:t+1.55*f});t+=1.05*f};
  const p0=[slam,sweep,()=>{slam();sweep()},()=>chain(3),toll,()=>{sweep();slam()}];
  const p1=[()=>{slam();chain(3)},()=>{toll();toll()},()=>{sweep();slam();chain(3)},()=>{chain(3);toll()},()=>{toll();slam()},()=>chain(5),()=>{sweep();toll();sweep()}];
  pick(stage?p1:p0)();return T;
}
function P2(stage,f,b){
  const T=[];let t=b;
  const orb=(real,src)=>{T.push({k:'orb',t0:t,tl:t+.45*f,ti:t+1.3*f,real,src:src||0});t+=.44*f};
  const volley=(n,ill)=>{const fake=new Set();while(fake.size<ill){const i=1+Math.floor(Math.random()*(n-1));fake.add(i)}for(let i=0;i<n;i++)orb(!fake.has(i));t+=.9*f};
  const echo=()=>{const real=Math.floor(Math.random()*3);[0,1,2].sort(()=>Math.random()-.5).forEach(s=>{orb(s===real,s);t+=.1*f});t+=.9*f};
  const wail=()=>{T.push({k:'wail',t0:t,tl:t+.8*f,ti:t+1.9*f,real:true});t+=1.3*f};
  const p0=[()=>volley(2,0),()=>volley(3,1),wail,()=>volley(3,0),()=>{wail();volley(2,1)}];
  const p1=[()=>volley(4,1),()=>volley(5,2),echo,()=>{echo();wail()},()=>{volley(3,1);echo()},()=>{wail();volley(4,2)}];
  pick(stage?p1:p0)();return T;
}
function P3(stage,f,b){
  const T=[];let t=b;
  const R=88;
  const sweep=dir=>{const ts=t+.95*f,D=1.6*f;let s0,s1;if(dir<0){s0=(940-HX-R)/1000;s1=(940-HX+R)/1000}else{s0=(HX-R+60)/1000;s1=(HX+R+60)/1000}
    T.push({k:'beam',t0:t,ts,D,dir,ta:ts+D*s0,tb:ts+D*s1,real:true,hold:true});t=ts+D+.35*f};
  const bolt=()=>{T.push({k:'bolt',t0:t,ti:t+.95*f,real:true,seed:Math.random()});t+=1.3*f};
  const spike=()=>{T.push({k:'spike',t0:t,ti:t+.8*f,real:true,seed:Math.random()});t+=1.15*f};
  const p0=[bolt,()=>sweep(-1),()=>{spike();bolt()},()=>{sweep(-1);bolt()},()=>{bolt();spike()}];
  const p1=[()=>{bolt();spike();bolt()},()=>{sweep(-1);sweep(1)},()=>{sweep(-1);t-=.15*f;spike()},()=>{spike();sweep(1);bolt()},()=>{bolt();bolt();sweep(-1)}];
  pick(stage?p1:p0)();return T;
}
function sched(list){const pat={ths:list,ok:true,perf:0,nReal:list.filter(t=>t.real!==false&&!t.hold).length};list.forEach(th=>{if(th.real===undefined)th.real=true;th.pat=pat;S.threats.push(th)});S.pat=pat;return pat}
function spawn(){const d=S.d,stage=S.bossHp<=S.bossMax/2?1:0,f=1/(d.sp*(1+.1*stage));const T=(S.phase===3&&S.form===2?P3b:[P1,P2,P3][S.phase-1])(stage,f,gt+.25);sched(T)}

/* ---------- input ---------- */
function down(){
  if(S.mode!=='play'||S.paused)return;
  ensureAudio();
  $('ward').classList.add('down');
  if(S.phase===3&&gt>=S.broken){if(!S.holding)play('shield');S.holding=true}
  S.guardT=gt;if(S.phase===2)S.dodgeT=gt;
  if(gt<S.lock)return;
  let best=null,bd=1e9;
  for(const th of S.threats){if(th.done||th.hold)continue;const w=th.win||S.d.win,dd=Math.abs(gt-th.ti);if(dd<=w){const sc=dd+(th.real===false?.06:0);if(sc<bd){bd=sc;best=th}}}
  if(best){if(best.real===false)fooled(best);else success(best,Math.abs(gt-best.ti)<=(best.perfW||S.d.perf))}
  else if(S.phase!==3){S.lock=gt+.25;S.whiffT=gt;play('whiff')}
}
function up(){S.holding=false;$('ward').classList.remove('down')}

function success(th,perfect){
  th.done=true;th.res='ok';th.okT=gt;th.perfect=perfect;S.okT=gt;
  if(perfect){th.pat.perf++;S.perfects++}
  if(th.k==='strike')return;
  const ph=S.phase;
  if(ph===1){burst(HX+55,GY-80,perfect?26:14,perfect?'#fff2c4':'#ffb45a',perfect?7:5,.5);play('parry',perfect);MUSIC.fx('clank');pop(perfect?_('Perfect!','Parfait !'):_('Parried','Paré'),perfect?'#fff2c4':'#ffc77a')}
  else if(ph===2){S.dodgeOk=gt;play('dodge',perfect);pop(perfect?_('Perfect dodge','Esquive parfaite'):_('Dodged','Esquivé'),perfect?'#f2e8ff':'#cdb5ff')}
  else{burst(HX,GY-120,perfect?24:12,perfect?'#e8fdff':'#7fe8ff',6,.5);play('parry',perfect);pop(perfect?_('Perfect!','Parfait !'):_('Countered','Contré'),perfect?'#e8fdff':'#9ff2ff')}
}
function fooled(th){th.done=true;th.res='fooled';th.okT=gt;th.pat.ok=false;S.lock=gt+.55;S.foolT=gt;play('fool');pop(_('A reflection!','Un reflet !'),'#a49bbd');say(_('You dodged a reflection.','Tu as esquivé un reflet.'))}
function hurt(){
  if(S.mode!=='play')return;
  S.hp=Math.max(0,S.hp-1);S.hits++;S.hurtT=gt;S.lock=Math.max(S.lock,gt+.3);S.shake=12;
  burst(HX,GY-70,18,'#ff6a5a',5,.55);play('hurt');MUSIC.fx('chunk');hud();
  if(S.hp<=0){S.mode='dead';S.deadT=gt;S.holding=false;say(_('The Watcher falls. Defeat.','Le Veilleur tombe. Défaite.'))}
}
function damageBoss(n){
  S.bossHp=Math.max(0,S.bossHp-n);S.bossFlash=gt;S.shake=8;play('bossHit');MUSIC.fx([null,'bellHit','crackGlass','creature'][S.phase]);
  const p=bossCore();burst(p.x,p.y,26,S.phase===1?'#ffc77a':S.phase===2?'#e2d2ff':'#b8fff4',7,.7);
  pop(n>1?_('Double hit!','Coup double !'):_('Hit','Touché'),'#fff',p.x,p.y-60);hud();
  if(S.bossHp<=0){S.mode='ko';S.koT=gt;S.threats=[];S.pat=null;S.cnt=null;S.holding=false;play('ko');
    say([null,_('The Rust King collapses.','Le Roi de Rouille s\'effondre.'),_('The Hollow Voice\'s mirror shatters.','Le miroir de la Voix Creuse éclate.'),_('The lantern goes dark.','La lanterne s\'éteint.')][S.phase]);
    }
}
function bossCore(){return S.phase===1?{x:700,y:GY-160}:S.phase===2?{x:730,y:150}:S.form===2?{x:LX,y:ECY}:{x:760,y:GY-292}}

/* ---------- update ---------- */
function update(dt){
  if(S.mode==='play'&&!S.paused){
    S.runT+=dt;
    if(S.phase===3){
      if(S.holding){S.stam-=dt*.36;if(S.stam<=0){S.stam=0;S.holding=false;S.broken=gt+.9;pop(_('Guard broken','Garde brisée'),'#ff9a8a');say(_('Your guard is broken.','Ta garde est brisée.'))}}
      else S.stam=Math.min(1,S.stam+dt*.38);
    }
    if(!S.pat&&!S.cnt&&gt>=S.nextAt)spawn();
    for(const th of S.threats){
      if(th.done)continue;
      if(th.hold){
        if(gt>=th.ta&&gt<=th.tb){if(!S.holding){th.done=true;th.res='hit';th.okT=gt;th.pat.ok=false;hurt()}else if(!th.held){th.held=true;burst(HX,GY-110,10,'#b8fff4',4,.4)}}
        else if(gt>th.tb){th.done=true;th.res='ok';th.okT=gt;pop(th.k==='beam'||th.k==='lbeam'?_('Beam blocked','Faisceau bloqué'):_('Blocked','Bloqué'),'#b8fff4')}
        continue;
      }
      if(gt>th.ti+(th.win||S.d.win)){
        th.done=true;th.okT=gt;
        if(th.real===false){th.res='pass';burst(HX+20,GY-70,10,'#a49bbd',3,.5);play('fool')}
        else if(th.k==='strike'){th.res='miss';th.pat.ok=false;pop(_('Too late','Trop tard'),'#9d988f',760,GY-360)}
        else{th.res='hit';th.pat.ok=false;hurt();if(S.mode!=='play')break}
      }
    }
    if(S.mode==='play'&&S.pat&&S.pat.ths.every(t=>t.done))closePat();
    if(S.cnt&&!S.cnt.hit&&gt>=S.cnt.t+S.cnt.hitAt){S.cnt.hit=true;damageBoss(S.cnt.dmg)}
    if(S.cnt&&gt>=S.cnt.t+S.cnt.dur)S.cnt=null;
  }
  if(S.mode==='ko'&&gt>S.koT+2.6&&!S.koShown){S.koShown=true;phaseCleared()}
  if(S.mode==='dead'&&gt>S.deadT+1.1&&!S.deadShown){S.deadShown=true;deathCard()}
  S.threats=S.threats.filter(t=>gt<(t.tb||t.ti)+1.6);
  S.parts=S.parts.filter(p=>gt-p.t0<p.life);
  S.pops=S.pops.filter(p=>gt-p.t0<1);
  S.shake*=Math.pow(.02,dt);
}
function closePat(){
  const p=S.pat;S.pat=null;
  if(p.strike){if(p.ok){S.cnt={t:gt,dmg:p.perf?2:1,dur:.95,hitAt:.32,k:3};play('counter');counterFx()}else S.nextAt=gt+.9;if(p.ok)S.nextAt=gt+1.4;return}
  if(p.ok){
    if(S.phase===3){sched([{k:'strike',t0:gt,ti:gt+(S.form===2?1.3:1.15),win:p.bigWin?.95:.62,perfW:.13,real:true}]).strike=true;say(_('The lantern dims: strike!','La lanterne faiblit : frappe !'));return}
    const allPerf=p.nReal>=2&&p.perf>=p.nReal;
    S.cnt={t:gt,dmg:allPerf?2:1,dur:1.05,hitAt:S.phase===1?.42:.4,k:S.phase};S.nextAt=gt+1.45;play('counter');counterFx();
    say(S.phase===1?_('Series parried. The Watcher counters.','Série parée. Le Veilleur riposte.'):_('Volley dodged. The Watcher sends the light back.','Volée esquivée. Le Veilleur renvoie la lumière.'));
  }else S.nextAt=gt+.95;
}

/* ---------- boss animation helpers ---------- */
function curAct(kinds,tail){let best=null;for(const th of S.threats){if(!kinds.includes(th.k)||th.t0>gt)continue;const end=(th.k==='toll'?th.tw:th.ti)+tail;if(gt>end)continue;if(!best||th.t0>best.t0||(th.t0===best.t0&&Math.abs(gt-th.ti)<Math.abs(gt-best.ti)))best=th}return best}

const ARM_REST=1.62,ARM_BACK=-1.9,BACK_DIR=2.11,TWO_PI=Math.PI*2;
function anim1(){const r=anim1raw();const th=curAct(['slam','sweep'],.75);if(th&&th.ls)r.lunge*=th.ls;return r}
function anim1raw(){
  const r={lunge:0,armA:ARM_REST+Math.sin(rt*1.3)*.04,clap:BACK_DIR,onBack:true,chain:null,toll:0,coil:0,larm:0};
  const th=curAct(['slam','sweep','chain','toll'],.75);
  if(!th||S.mode!=='play')return r;
  const p=clamp((gt-th.t0)/(th.ti-th.t0),0,1),af=gt-th.ti;
  if(th.k==='slam'||th.k==='sweep'){
    const slam=th.k==='slam',gEnd=slam?.18:.2,wEnd=slam?.72:.65;
    if(af<0&&p<gEnd){const e=eio(p/gEnd);r.armA=lerp(ARM_REST,ARM_BACK,e);return r}
    r.onBack=false;
    if(af<0&&p<wEnd){const e=eio((p-gEnd)/(wEnd-gEnd));
      if(slam){r.armA=lerp(ARM_BACK,-1.3,e);r.clap=lerp(BACK_DIR,-1.3,e);r.lunge=-30*e}
      else{r.armA=lerp(ARM_BACK,.1,e);r.clap=lerp(BACK_DIR,.1,e);r.lunge=20*e}
      return r}
    if(af<0){const e=ein((p-wEnd)/(1-wEnd));
      if(slam){r.armA=r.clap=lerp(-1.3,-3.5,e);r.lunge=lerp(-30,-175,e)}
      else{r.armA=r.clap=lerp(.1,2.7,e);r.lunge=lerp(20,-165,e)}
      return r}
    const hold=.22,ret=.5,e=eio(clamp((af-hold)/ret,0,1));
    if(af>hold+ret){r.onBack=true;r.armA=lerp(ARM_BACK,ARM_REST,clamp((af-hold-ret)/.2,0,1));return r}
    if(slam){r.armA=lerp(-3.5,ARM_BACK,e);r.clap=lerp(-3.5,BACK_DIR-TWO_PI,e);r.lunge=lerp(-175,0,e)}
    else{r.armA=lerp(2.7,ARM_BACK+TWO_PI,e);r.clap=lerp(2.7,BACK_DIR,e);r.lunge=lerp(-165,0,e)}
    return r;
  }
  if(th.k==='chain'){
    r.lunge=-50;r.coil=1;r.larm=1;
    let near=null;for(const c of S.threats)if(c.k==='chain'&&c.t0===th.t0&&gt>=c.ti-.2&&gt<=c.ti+.12){near=c;break}
    if(near){const k=gt<near.ti?eout(1-(near.ti-gt)/.2):1-(gt-near.ti)/.12;r.chain={k:clamp(k,0,1),ok:near.res==='ok'}}
    if(af>.3){const e=clamp((af-.3)/.4,0,1);r.lunge=lerp(-50,0,e);r.larm=1-e}
    return r;
  }
  if(th.k==='toll'){const q=clamp((gt-th.t0)/(th.tw-th.t0),0,1);r.toll=gt<th.tw?q:Math.max(0,1-(gt-th.tw)/.5)}
  return r;
}

  else{let sw=0;for(const r of[10.4,11.9,13.3]){const d=t-r;if(d>0&&d<1.4)sw+=Math.sin(d*9)*.35*(1-d/1.4)}hangBell(niche.x,niche.y,sw);
    if(t>=7.6&&once('bellIn'))burst(niche.x,niche.y+12,16,'#bff6ff',4,.6);
    for(const r of[10.4,11.9,13.3]){const d=t-r;if(d>0&&d<1.6){ctx.strokeStyle=`rgba(255,220,150,${.7*(1-d/1.6)})`;ctx.lineWidth=2.5;for(let i=0;i<3;i++){const rr=20+d*120+i*26;ctx.beginPath();ctx.arc(niche.x,niche.y+14,rr,Math.PI*1.05,Math.PI*1.95);ctx.stroke()}}}}
  if(t>=16&&once('plant'))burst(hx+30,GY,14,'#9fb6a0',3,.7,.3);
  // under the ice
  const ug=ctx.createLinearGradient(0,GY+60,0,GY+560);ug.addColorStop(0,'#0b1d1f');ug.addColorStop(1,'#010304');ctx.fillStyle=ug;ctx.fillRect(0,GY+60,W,600);
  ctx.strokeStyle='rgba(160,220,230,.15)';ctx.lineWidth=1;for(let i=0;i<8;i++){const y=GY+60+i*7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+Math.sin(i)*3);ctx.stroke()}
  for(let i=0;i<24;i++){const x=(i*173)%W,y=GY+120+((i*97+rt*8)%420);ctx.fillStyle='rgba(160,220,230,.18)';ctx.fillRect(x,y,1.5,1.5)}
  const pu=.5+.5*Math.sin(t*2.6);glow(W*.62,GY+340,90,'rgba(90,220,255,.9)',(.35+.4*pu)*pan);ell(W*.62,GY+340,5+pu*2,5+pu*2,`rgba(220,252,255,${pan})`);
  ctx.restore();
  // particles, text
  ctx.save();ctx.globalCompositeOperation='lighter';for(const p of S.parts){const q=gt-p.t0,k=1-q/p.life;ctx.globalAlpha=k;ctx.fillStyle=p.c;ctx.fillRect(p.x+p.vx*q*30,p.y+p.vy*q*30+p.g*q*q*300,p.r,p.r)}ctx.restore();
  for(const c of ECAPF()){const a=clamp((t-c[0])/.4,0,1)*(1-clamp((t-c[1]+.4)/.4,0,1));if(a>0){ctx.save();ctx.translate(0,-H*.64);caption(c[2],a);ctx.restore()}}
  title(t,20.6,_('The end','Fin'),'Silent Bells','#7fd6ff');
  fadeAll(1-clamp(t/.8,0,1));fadeAll(clamp((t-22.2)/.8,0,1));
  EFXL.forEach((c,i)=>{if(t>=c[0]&&once('efx'+i))MUSIC.fx(c[1])});
}
function playEpilogue(cb){MUSIC.stop();MUSIC.bedStop();S.mode='epilogue';S.epT0=gt;S.cineDone={};S.parts=[];S.pops=[];S.epCb=cb;resetCine(S);S.cineDone={};hideCard();setTheme(4);$('skip').hidden=false;$('hdEye').textContent=_('Epilogue','Épilogue')}
function endEpilogue(){if(S.mode!=='epilogue')return;const cb=S.epCb;S.epCb=null;$('skip').hidden=true;S.mode='card';cb&&cb()}


/* ---------- combat sound effects: wind-ups, releases and impacts ---------- */
const SFX_START={slam:'draw',sweep:'draw',chain:'chainSlip',stomp:'rumble',rock:'fallWhine',shard:'glints',wail:'voice',back:'swell',beam:'beam',lbeam:'beam',bolt:'charge',spike:'iceCrack',ring:'bellSoft',moon:'chainSlip',trap:'swell',burst:'overload',reform:'clank',implode:'overload',strike:'swell'};
const SFX_MID={orb:'throw',toll:'tollLast',ring:'whoosh',trap:'whooshDown',chunk:'clank',shard:'whoosh',sweep:'whoosh',slam:'whoosh'};
const SFX_HIT={slam:'slam',sweep:'plant',chain:'clank',bolt:'thunder',spike:'crackGlass',ring:'clank',hpBack:'clank'};
function combatSfx(){
  if(S.mode!=='play'||S.paused)return;
  for(const th of S.threats){
    if(!th.a0&&gt>=th.t0){th.a0=1;const n=SFX_START[th.k];if(n&&th.real!==false)MUSIC.fx(n)}
    const mt=th.k==='toll'?th.tw:(th.k==='slam'||th.k==='sweep')?th.ti-.3:th.tl;
    if(mt!=null&&!th.a1&&gt>=mt){th.a1=1;const n=SFX_MID[th.k];if(n)MUSIC.fx(n)}
    if(!th.hold&&th.ti!=null&&!th.a2&&gt>=th.ti&&th.real!==false){th.a2=1;const n=SFX_HIT[th.k];if(n)MUSIC.fx(n)}
  }
}
function counterFx(){MUSIC.fx([null,'impactLight','throw','thunder'][S.phase])}

/* ---------- per-frame game logic on top of the engine ---------- */
function gameUpdate(dt){
  if(S.mode==='cine'&&S.cine&&gt-S.cine.t0>=CINE_LEN[S.phase][S.cine.k])endCine();
  if(S.mode==='prologue'&&gt-S.proT0>=PRO_LEN)endPrologue();
  if(S.mode==='epilogue'&&gt-S.epT0>=EPI_LEN)endEpilogue();
  angerCheck();combatSfx();
  if(S.mode==='play'&&S.phase===1)S.parasite=S.bossHp<=S.bossMax/2?.6+.15*Math.sin(gt*3):0;
  if(S.phase===3&&S.form===2&&(S.mode==='play'||S.mode==='ko')&&!S.paused){
    const st=S.threats.find(t=>t.k==='strike'&&!t.done);
    if(st){if(!st.gp){const ga=S.ecPhi+12*Math.PI/7;let d=((Math.PI-ga)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);if(d<1)d+=2*Math.PI;st.gp={from:S.ecPhi,to:S.ecPhi+d,t0:gt}}
      S.ecPhi=lerp(st.gp.from,st.gp.to,eio(clamp((gt-st.gp.t0)/(st.ti-st.gp.t0),0,1)))}
    else S.ecPhi+=(S.bossHp<=S.bossMax/2?1.05:.7)*dt;
  }
  if(S.mode==='ko'&&!S.koShown&&gt>S.koT+.45){S.koShown=true;phaseCleared()}
}

/* ---------- home menu illustration ---------- */
const MS=fresh('normal');MS.phase=3;MS.mode='menu';MS.form=1;MS.cineDone={};

  const c=$('mc'),r=c.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,1.5),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  const sv=S,cx=ctx;S=MS;ctx=c.getContext('2d');

  const port=h>w*1.1,sc=port?w/W*1.08:Math.max(w/W,h*.82/H);ctx.setTransform(sc,0,0,sc,(w-W*sc)/2,(port?h*.48:h*.8)-GY*sc);
  bg3();ctx.fillStyle='#04121a';ctx.fillRect(-2000,GY,5000,2000);drawBoss3();ell(HX-40,GY+2,30,6,'rgba(0,0,0,.45)');heroShape(HX-40,GY,0,-1.42,0);
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(3,7,12,.25)');g.addColorStop(.4,'rgba(3,7,12,.05)');g.addColorStop(.72,'rgba(3,7,12,.55)');g.addColorStop(1,'rgba(3,7,12,.92)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  S=sv;ctx=cx;
}

  const M=[['easy','Facile','Easy','Respirer','Breathe'],['normal','Normal','Normal','Le vrai combat','The real fight'],['hard','Difficile','Hard','Sans pitié','No mercy'],['trial','Épreuve','Trial','Sans soin','No healing'],['tn','Normal','Normal','6 PV au total','6 HP total'],['th','Difficile','Hard','5 PV au total','5 HP total']];

  $('mLink').textContent=_('‹ Ember Bridge · Chapter I','‹ Ember Bridge · Chapitre I');
  $('mResume').textContent=_('Resume','Reprendre');$('pResume').textContent=_('Resume','Reprendre');$('pTitle').textContent=_('Fight paused','Combat en pause');
  $('retryBtn').textContent=_('Retry','Réessayer');$('skip').textContent=_('Skip ›','Passer ›');
  $('hint').textContent=_("Space, up arrow or tap the screen · P pause · R retry · Enter to skip","Espace, flèche haut ou toucher l'écran · P pause · R réessayer · Entrée pour passer");

  $('nmP').textContent=_('The Watcher','Le Veilleur');
  hud();if(S.mode==='prologue')$('hdEye').textContent='Prologue';

/* ---------- events ---------- */
const ward=$('ward'),cvm=$('c'),ctxMain=cvm.getContext('2d');let SCm=1;
function fitMain(){const r=cvm.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cvm.width=Math.max(1,Math.round(r.width*d));cvm.height=Math.max(1,Math.round(r.height*d));SCm=cvm.width/W}
new ResizeObserver(fitMain).observe($('stage'));fitMain();
ward.addEventListener('pointerdown',e=>{e.preventDefault();try{ward.setPointerCapture(e.pointerId)}catch(_e){}down()});
ward.addEventListener('pointerup',up);ward.addEventListener('pointercancel',up);ward.addEventListener('lostpointercapture',up);ward.addEventListener('contextmenu',e=>e.preventDefault());
cvm.addEventListener('pointerdown',e=>{if(S.mode!=='play')return;e.preventDefault();try{cvm.setPointerCapture(e.pointerId)}catch(_e){}down()});
cvm.addEventListener('pointerup',up);cvm.addEventListener('pointercancel',up);cvm.addEventListener('lostpointercapture',up);
function skip(){if(S.mode==='prologue')endPrologue();else if(S.mode==='epilogue')endEpilogue();else if(S.mode==='cine')endCine()}
$('skip').addEventListener('click',skip);
document.addEventListener('keydown',e=>{
  const k=e.key;if(!$('menu').hidden)return;
  if(S.mode==='cine'||S.mode==='prologue'||S.mode==='epilogue'){if(k==='Enter'||k==='Escape'){e.preventDefault();skip()}else if(k===' '||k==='ArrowUp')e.preventDefault();return}
  if(k===' '||k==='ArrowUp'){if(!$('ov').hidden||!$('pause').hidden)return;e.preventDefault();if(!e.repeat)down();return}
  if(k==='p'||k==='P'||k==='Escape'){if(S.mode==='play')setPause(!S.paused);return}
  if((k==='r'||k==='R')&&(S.mode==='play'||S.mode==='dead')){$('pause').hidden=true;S.d.trial?startRun(S.dk,true):retryPhase()}
});
document.addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp')up()});
window.addEventListener('blur',()=>{up();if(S.mode==='play')setPause(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S.mode==='play')setPause(true);MUSIC.stop();MUSIC.bedStop()}else if(!$('menu').hidden)setTheme(4)});

$('mResume').addEventListener('click',()=>{hideMenu();MUSIC.stop();if(S.mode==='play')setPause(false);else if(S.mode==='card'&&lastCard)showCard(lastCard)});
document.querySelectorAll('#phases button').forEach(b=>b.addEventListener('click',()=>jumpPhase(+b.dataset.ph)));

$('mBackT').addEventListener('click',()=>{$('mphM').hidden=false;$('mphT').hidden=true});
document.querySelectorAll('#langs button').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;store.set('lb-lang',LANG);applyLang()}));
['optSnd','optMus'].forEach(id=>{$(id).checked=store.get(OPT_KEY[id],'1')==='1'});$('optHelp').checked=store.get(OPT_KEY.optHelp,'0')==='1';

  if($('optMus').checked){if(!$('menu').hidden)setTheme(4);else if(S.mode==='play'&&!S.paused)setTheme(S.phase)}}

MUSIC.setFx($('optSnd').checked);MUSIC.setMus($('optMus').checked);

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;rt+=dt;
  if(!$('menu').hidden)return;
  if(!S.paused&&['play','ko','dead','cine','prologue','epilogue'].includes(S.mode))gt+=dt;
  ctx=ctxMain;SC=SCm;
  update(dt);gameUpdate(dt);draw();
}
